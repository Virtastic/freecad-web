# Production compose for freecad.virtastic.app — synced to /opt/freecad/ on the OVH VPS.
# One static-serving nginx container joined to the shared `nostalgia` docker network; the shared
# edge Caddy reaches it by name (freecad:80). Publishes NO host ports — only the edge talks to it.
# FreeCAD.data (the preloaded FS) is baked into the image, so there is no external data volume.
services:
  freecad:
    image: freecad:ovh              # built + tagged by the deploy workflow on the runner
    container_name: freecad
    restart: unless-stopped
    networks: [shared]
    volumes:
      # Event counters (see the /t location in infra/nginx.conf). On a named volume because
      # the container is recreated on every deploy -- inside the image these would be lost
      # each time, which would make the one thing they exist to measure unmeasurable.
      - fcweb-events:/var/log/fcweb

volumes:
  fcweb-events:

networks:
  shared:
    external: true
    name: nostalgia
