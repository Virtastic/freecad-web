name: build FreeCAD deps (wasm)

# The C++ dependency stack, built for wasm on a hosted runner.
#
# This exists because "a FreeCAD relink needs the build machine" turned out to be wrong. The
# probe (run 32030739112) installed emsdk 3.1.70 and built xerces-c and OCCT 7.8.1 for wasm in
# 60.6 minutes on ubuntu-latest. OCCT is the largest C++ dependency FreeCAD has, so if it fits
# in an hour the rest of this stack is a scheduling problem, not an impossibility.
#
# WHAT THIS DOES AND DOES NOT GIVE YOU
#
# It produces .a files in deps/wasm/lib, cached between runs and uploaded as an artifact. That
# is the input a relink consumes.
#
# It does NOT reproduce production. 21 of 23 dependencies have no recorded version (see
# BUILD-WEH.md), so the versions below are plausible upstream choices, not the ones production
# was built from. Anything linked from these is a NEW build that happens to compile -- not the
# binary being served. Run tools/capture-dep-versions.sh on the build machine and commit
# deps-versions.txt, then pin the versions here to match it; only then is a comparison
# meaningful.
#
# Qt is NOT here. It is 2-3 hours from source and cannot be replaced by an official prebuilt,
# because production needs -feature-wasm-exceptions -feature-wasm-jspi and the shipped Qt wasm
# binaries have neither. It needs its own job with its own cache; this covers everything else.
#
# Each dependency is continue-on-error deliberately: one failure should still leave every
# earlier library cached and every later timing measured, because the point is the map.
on:
  # Dispatch-only until now, which meant a change to a dependency PATCH rebuilt nothing.
  # patches/vtk-expat-wasm-xmlsize.patch was added, hashed into this workflow's cache key,
  # and never built -- and the shipped FEMExample trapped on the bug it fixes for months.
  # link-freecad.yml watches its own inputs for exactly this reason; so does this one now.
  push:
    branches: [freecad-1.1.3]
    paths:
      - '.github/workflows/build-deps.yml'
      - 'patches/apply.sh'
      - 'patches/occt.patch'
      - 'patches/coin3d.patch'
      - 'patches/cpython-ctypes-wasm.patch'
      - 'patches/numpy.patch'
      - 'patches/vtk-expat-wasm-xmlsize.patch'
      - 'configure-*-weh.sh'
      - 'build-*-weh.sh'
      - 'build-cpython*.sh'
      - 'toolchain/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Ignore the cache and rebuild from scratch"
        type: boolean
        default: false
      runner:
        description: "Where to build"
        type: choice
        default: vps
        options:
          - vps
          - ubuntu-latest

permissions:
  contents: read

env:
  # Bump to invalidate the cache deliberately (a version change here should force a rebuild).
  DEPS_KEY: v1-emsdk3.1.70-xerces3.2.5-occt7.8.1-vtk9.3.1-coin4.0.3-boost1.86

jobs:
  deps:
    # `vps` (the self-hosted runner on the OVH origin box) by default; `ubuntu-latest` is the
    # opt-out for when the box is busy or being rebuilt.
    #
    # The default flipped on 2026-08-18 for a blunt reason: this workflow was the single
    # largest consumer of a 2000-minute/month free-plan allowance, and the org reached 1823 of
    # it in eighteen days -- 948 of those minutes from fifteen runs of THIS job. Hosted minutes
    # were the scarce resource; the box was sitting at load 0.2.
    #
    # The box is also the better machine: 8 vCPU / 22 GB / 86 GB free, against a hosted
    # runner's 4 vCPU / 16 GB / ~14 GB after the cleanup step below. It was provisioned with
    # build-essential, cmake and ninja-build the same day, which is what the preflight below
    # used to fail on.
    #
    # Two things to know, both unchanged by the flip. The build competes for CPU with the live
    # site (nothing here caps parallelism), and the `ubuntu` account is shared by three runners
    # registered to three different GitHub scopes -- so a long job here can queue another
    # Virtastic repo's deploy behind it. Pick `ubuntu-latest` when a deploy matters more than
    # the minutes.
    # On a push there are no inputs, so `inputs.runner == 'vps'` is false and this used
    # to resolve to ubuntu-latest -- which has none of the caches and cannot build this
    # stack. The first push-triggered run failed before it ran a single step. Treat an
    # absent input as the dispatch default rather than as 'not vps'.
    runs-on: ${{ (inputs.runner || 'vps') == 'vps' && fromJSON('["self-hosted","ovh","virtastic"]') || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # HOSTED RUNNERS ONLY. This deletes /usr/share/dotnet, /usr/local/lib/android and the
      # ghc trees to claw back space on a 14 GB image. On the OVH box those are not throwaway
      # CI images, they are somebody's filesystem -- and that box also runs another product's
      # database. `|| true` would have hidden the mistake rather than prevented it.
      - name: Free disk (this stack is large)
        if: ${{ inputs.runner != 'vps' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h / | sed 's/^/  /'

      - name: Disk before (self-hosted)
        if: ${{ inputs.runner == 'vps' }}
        run: |
          echo "building on $(hostname) -- NOT deleting anything on this box"
          df -h / | sed 's/^/  /'
          nproc | sed 's/^/  cpus: /'
          free -g 2>/dev/null | sed 's/^/  /' || true

      # actions/cache SAVES ONLY WHEN THE RESTORE MISSED. With a fixed key that restored
      # cleanly, the post step is a no-op -- so this cache was created on 2026-08-17T15:27,
      # when only boost and xerces had ever built, and froze at 41 MiB. Every run since has
      # restored those two, rebuilt OCCT (90 min) and VTK (42 min) because they were absent,
      # and then discarded both. Four runs, ~2.2 h of recompilation each, thrown away every
      # time, and the entry could never grow because the key never changed.
      #
      # Split restore/save with a run-unique key and a prefix restore-key: the restore still
      # finds the newest matching entry, and the save always writes a new one, so the cache
      # accumulates instead of freezing.
      # The key includes a hash of everything that changes what gets COMPILED -- the patch
      # set, the configure/build scripts, the staged headers. Without that, applying a source
      # patch and then hitting a cache-skip guard pairs new source with libraries built before
      # it, silently. That is the same shape as every other defect in this repository, so it
      # is worth the rebuilds a script edit now costs.
      # The hash names the patches that affect deps/wasm INDIVIDUALLY rather than globbing
      # patches/**. It used to glob, which meant freecad.patch -- 4,373 lines of FreeCAD
      # port that never touches this stack -- invalidated the whole dependency cache and
      # rebuilt OCCT (77 minutes), VTK and the rest from scratch. Run 32224571660 did
      # exactly that, purely because the port had been rebased onto 1.1.3.
      - name: Restore built dependencies
        id: depcache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/wasm
          key: fcweb-deps-${{ env.DEPS_KEY }}-${{ hashFiles('patches/occt.patch', 'patches/coin3d.patch', 'patches/cpython-ctypes-wasm.patch', 'patches/numpy.patch', 'patches/vtk-expat-wasm-xmlsize.patch', 'patches/apply.sh', 'configure-*-weh.sh', 'build-*-weh.sh', 'build-cpython*.sh', 'toolchain/**') }}-${{ github.run_id }}
          # Two levels. The exact source-hash prefix first; then a bare `fcweb-deps-<KEY>-`
          # fallback, which restore-keys resolves to the NEWEST matching entry.
          #
          # That bare fallback was removed once, after run 32099719534 matched a stale
          # fixed-key entry (41 MiB, boost+xerces+VTK) instead of the 76 MiB one with OCCT
          # in it. Two things have changed since: that entry is deleted, and -- the actual
          # fix -- every build step now checks for its own artifact and rebuilds if it is
          # absent. A partial restore therefore costs exactly the missing pieces, which is
          # the point. Without the fallback, touching toolchain/** rebuilds all of boost,
          # xerces, OCCT and VTK to recompile the one library that depends on it.
          restore-keys: |
            fcweb-deps-${{ env.DEPS_KEY }}-${{ hashFiles('patches/occt.patch', 'patches/coin3d.patch', 'patches/cpython-ctypes-wasm.patch', 'patches/numpy.patch', 'patches/vtk-expat-wasm-xmlsize.patch', 'patches/apply.sh', 'configure-*-weh.sh', 'build-*-weh.sh', 'build-cpython*.sh', 'toolchain/**') }}-
            fcweb-deps-${{ env.DEPS_KEY }}-

      # A hosted runner ships cmake, ninja and gcc. The OVH box does not: run 32155916113
      # died eight times in a row with "[Errno 13] Permission denied: 'cmake'" and
      # "no acceptable C compiler found in $PATH", each failure buried inside a
      # continue-on-error step and only caught by the gate at the end.
      #
      # Check up front and name what is missing, so choosing runner=vps on an unprovisioned
      # box costs one clear line instead of a log dig.
      - name: Preflight -- is this machine able to build at all?
        run: |
          miss=""
          for t in cmake ninja python3 patch curl tar; do
            command -v "$t" >/dev/null 2>&1 || { miss="$miss $t"; continue; }
            "$t" --version >/dev/null 2>&1 || miss="$miss $t(not executable)"
          done
          # CPython's host interpreter needs a native compiler; emcc cannot stand in.
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || miss="$miss cc/gcc"
          if [ -n "$miss" ]; then
            echo "::error::this runner cannot build:$miss"
            echo "On the OVH box, provision it once with:"
            echo "    sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build"
            exit 1
          fi
          echo "  toolchain ok: $(cmake --version | head -1), $(ninja --version), $(cc --version | head -1)"

      - name: Install emsdk 3.1.70
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 3.1.70 && ./emsdk activate 3.1.70
          . ./emsdk_env.sh && emcc --version | head -1

      # Fetch only what is missing, so a cache hit skips straight to the gaps.
      - name: Fetch sources
        run: |
          set -e
          mkdir -p deps/src /tmp/deplogs
          # An explicit if, purely for clarity. I first blamed the previous
          # `[ -e A ] || [ -e B ] && { ...; return; }` form for run 32042480090's 2.3-minute
          # failure, then reproduced it and found it innocent: after the && short-circuits,
          # execution falls through to the fetch lines, so the function exits with tar's
          # status. Kept because it reads better; it fixed nothing.
          get() {  # get <dir> <url> <strip>
            if [ -e "deps/src/$1/CMakeLists.txt" ] || [ -e "deps/src/$1/bootstrap.sh" ]; then
              echo "  $1: present"
              return 0
            fi
            echo "  $1: fetching"
            mkdir -p "deps/src/$1"
            curl -fsSL -o /tmp/s.tar.gz "$2"
            tar xzf /tmp/s.tar.gz -C "deps/src/$1" --strip-components="$3"
          }
          {
            get xercesc   https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.2.5.tar.gz 1
            get occt      https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_8_1.tar.gz 1
            get VTK-9.3.1 https://www.vtk.org/files/release/9.3/VTK-9.3.1.tar.gz                   1
            get coin3d    https://github.com/coin3d/coin/archive/refs/tags/v4.0.3.tar.gz           1
            get boost     https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz      1
            get yaml-cpp  https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz        1
            get cpython   https://github.com/python/cpython/archive/refs/tags/v3.13.3.tar.gz       1
            get hdf5-1.14.3 https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_14_3.tar.gz  1
            echo "--- deps/src ---"; ls -1 deps/src
            echo "--- deps/wasm/lib (from cache, if any) ---"; ls -1 deps/wasm/lib 2>/dev/null | head -50
            echo "--- disk ---"; df -h /
          } 2>&1 | tee /tmp/deplogs/00-fetch.txt
          tail -20 /tmp/deplogs/00-fetch.txt

      # THE project's own source patches -- occt.patch, coin3d.patch, cpython-ctypes-wasm.patch,
      # numpy.patch. None had ever been applied in CI, because apply.sh required git checkouts
      # (deps/src/*/.git) and this workflow fetches tarballs. It handles both layouts now, so
      # the libraries built here are patch-equivalent to the build machine's for the first time.
      #
      # This replaces a separate "Patch OCCT for current freetype" step, and removing it fixed
      # a defect rather than merely tidying. That step applied occt-freetype-tags-const.patch,
      # which fixes the SAME line of StdPrs_BRepFont.cxx as occt.patch's second hunk (FT_Outline
      # ::tags became unsigned char* in current freetype; OCCT assigns it to a const char*).
      # With it applied first, occt.patch no longer matched and apply.sh failed the whole file
      # -- taking with it occt.patch's FIRST hunk, which nothing else supplies:
      #
      #     -  set (CMAKE_CXX_FLAGS "... -fexceptions -fPIC")
      #     -  add_definitions(-DOCC_CONVERT_SIGNALS)
      #     +  if (NOT EMSCRIPTEN)   ... endif()
      #
      # So every CI build of OCCT compiled with -fexceptions and OCC_CONVERT_SIGNALS on top of
      # configure-occt-weh.sh's -fwasm-exceptions: two exception models at once, plus setjmp-
      # based signal conversion that the patch's own comment says makes LLVM emit invalid wasm.
      # Verified that occt.patch applies cleanly to a pristine V7_8_1 tree, so the standalone
      # patch was only ever needed because apply.sh could not run here.
      #
      # FCWEB_PATCH_OPTIONAL=1 because CI builds a subset of the stack: a tree that is not here
      # is skipped rather than fatal. On the build machine the default stays strict.
      - name: Apply the source patches
        run: |
          set -e
          FCWEB_PATCH_OPTIONAL=1 bash patches/apply.sh
          # A positive signal per patch, not just apply.sh's exit code -- "nothing threw" has
          # already proven worthless twice in this repository.
          if [ -d deps/src/cpython ]; then
            grep -q "typeof Module.PyEM_CountArgs" deps/src/cpython/Python/emscripten_trampoline.c \
              && echo "  verified: CPython trampoline delta present" \
              || { echo "::error::cpython patched but the trampoline delta is missing"; exit 1; }
          fi

      # OCCT's script runs `embuilder build freetype >/dev/null 2>&1` and, under set -e, dies
      # silently if that fails -- which is exactly what happened: occt.txt in run 32043014090
      # contained the three env lines and nothing else. Building the port here first makes the
      # failure visible instead of invisible, and warms it for the real step.
      - name: Pre-build the emscripten freetype port (OCCT's only hard dep)
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          rc=0
          { embuilder build freetype && em-config CACHE; } > /tmp/deplogs/01-freetype.txt 2>&1 || rc=$?
          echo "  freetype port exit=$rc"
          tail -25 /tmp/deplogs/01-freetype.txt

      - name: boost
        id: boost
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          # The cache restores deps/wasm, but no step consulted it, so every run rebuilt
          # the whole stack -- run 32077362742 spent 2h28m recompiling artifacts that were
          # already on disk. Honour the cache this workflow already pays to save.
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libboost_*.a 2>/dev/null | wc -l)" -ge 5 ]; then
            echo "  boost: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          bash build-boost-weh.sh > /tmp/deplogs/boost.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  boost exit=$rc in $((SECONDS-t0))s"; tail -30 /tmp/deplogs/boost.txt
          exit $rc

      - name: xerces-c
        id: xerces
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          # The cache restores deps/wasm, but no step consulted it, so every run rebuilt
          # the whole stack -- run 32077362742 spent 2h28m recompiling artifacts that were
          # already on disk. Honour the cache this workflow already pays to save.
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libxerces-c*.a 2>/dev/null | wc -l)" -ge 1 ]; then
            echo "  xerces: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          bash build-xercesc-weh.sh > /tmp/deplogs/xerces.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  xerces exit=$rc in $((SECONDS-t0))s"; tail -30 /tmp/deplogs/xerces.txt
          exit $rc

      # Coin3D does find_package(Boost) for HEADERS, and build-boost-weh.sh stages them under
      # deps/src/boost rather than installing to $DW/include -- b2 logs "headers: not
      # building". So run 32043014090 died on "Could NOT find Boost (missing:
      # Boost_INCLUDE_DIR)" even though the boost .a files had built fine. Expose the headers
      # where a cross-build looks for them.
      - name: Expose boost headers to dependent builds
        continue-on-error: true
        run: |
          mkdir -p deps/wasm/include
          if [ -d deps/src/boost/boost ] && [ ! -e deps/wasm/include/boost ]; then
            cp -r deps/src/boost/boost deps/wasm/include/boost
          fi
          {
            echo "boost headers: $(find deps/wasm/include/boost -name '*.hpp' 2>/dev/null | wc -l) .hpp files"
            echo "BOOST_ROOT will be: $PWD/deps/src/boost"
            ls -la deps/src/boost/boost/version.hpp 2>&1 || echo "version.hpp MISSING"
          } | tee /tmp/deplogs/02-boost-headers.txt
          # Copying headers is not enough: Coin's find_package(Boost) resolves through
          # FindBoost, which searches BOOST_ROOT / Boost_INCLUDE_DIR, not $DW/include. Run
          # 32046710386 still failed with "missing: Boost_INCLUDE_DIR" after the copy.
          echo "BOOST_ROOT=$PWD/deps/src/boost"           >> "$GITHUB_ENV"
          echo "Boost_INCLUDE_DIR=$PWD/deps/src/boost"    >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$PWD/deps/src/boost"     >> "$GITHUB_ENV"
          # Prove the header FindBoost actually probes for is where we are pointing it.
          ls deps/src/boost/boost/version.hpp && echo "  boost/version.hpp present"             || echo "::warning::boost/version.hpp missing -- FindBoost will fail"

      - name: OCCT
        id: occt
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          # The cache restores deps/wasm, but no step consulted it, so every run rebuilt
          # the whole stack -- run 32077362742 spent 2h28m recompiling artifacts that were
          # already on disk. Honour the cache this workflow already pays to save.
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libTK*.a 2>/dev/null | wc -l)" -ge 30 ]; then
            echo "  OCCT: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          bash configure-occt-weh.sh > /tmp/deplogs/occt.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  occt exit=$rc in $((SECONDS-t0))s"; tail -30 /tmp/deplogs/occt.txt
          exit $rc

      - name: VTK
        id: vtk
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          # The cache restores deps/wasm, but no step consulted it, so every run rebuilt
          # the whole stack -- run 32077362742 spent 2h28m recompiling artifacts that were
          # already on disk. Honour the cache this workflow already pays to save.
          # ... but "the archives exist" is not "the archives are the ones this source
          # produces". The restore-keys prefix will happily hand back a VTK built before
          # patches/vtk-expat-wasm-xmlsize.patch existed, and that VTK traps on every .vtu
          # -- which is how the shipped FEMExample stayed unopenable while this step
          # printed "cache hit". Stamp the inputs beside the archives and compare.
          stamp=deps/wasm/lib/.fcweb-vtk-inputs
          want=$(cat patches/vtk-expat-wasm-xmlsize.patch configure-vtk-weh.sh | sha256sum | cut -d" " -f1)
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libvtk*.a 2>/dev/null | wc -l)" -ge 20 ] && [ "$(cat $stamp 2>/dev/null)" = "$want" ]; then
            echo "  VTK: already built from these inputs (cache hit), skipping"; exit 0
          fi
          if [ -s "$stamp" ]; then
            echo "  VTK: the cached archives were built from different inputs, rebuilding"
          fi
          t0=$SECONDS; rc=0
          bash configure-vtk-weh.sh > /tmp/deplogs/vtk.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] && echo "$want" > "$stamp"
          echo "  vtk exit=$rc in $((SECONDS-t0))s"; tail -30 /tmp/deplogs/vtk.txt
          exit $rc

      # gl_compat.h and coin_intrusive.h are force-included into Coin, all of FreeCAD, PySide
      # and all three link commands, and until 2026-08-18 neither was tracked: they existed
      # only on the build machine, under gitignored deps/. coin_intrusive.h is reconstructed
      # and staged from toolchain/include. gl_compat.h is not, so Coin builds here in
      # DIAGNOSTIC mode -- an empty header, whose compile errors enumerate what the real one
      # must declare. Nothing built this way is production-equivalent.
      - name: Stage the force-included compat headers
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          # FCWEB_FORCE_STAGE_HEADERS: stage-headers.sh normally refuses to overwrite a
          # header already present in $DW/include, because on the build machine that copy is
          # the ORIGINAL and the tracked one is a reconstruction. In CI it is neither -- it
          # is whatever this workflow staged last run and then cached. Run 32230261006 lost
          # an entire Coin3D build to exactly that: the cache restored the previous,
          # enum-less gl_compat.h, the stager dutifully kept it, and Coin failed on GL_ACCUM
          # again with the fix sitting unused in toolchain/include. Here the tracked copy IS
          # the authority.
          # PIPESTATUS in both arms: `cmd | tee log` exits with tee's status, so a stager
          # that died would be invisible and Coin3D would build against whatever headers
          # happened to already be staged. That exact shape shipped a stale binary to
          # production on 2026-08-25 from the link lane.
          if [ -e toolchain/include/gl_compat.h ]; then
            FCWEB_FORCE_STAGE_HEADERS=1 bash toolchain/stage-headers.sh 2>&1               | tee /tmp/deplogs/03-headers.txt
            rc=${PIPESTATUS[0]}
          else
            echo "::warning::gl_compat.h is not tracked -- Coin3D builds in DIAGNOSTIC mode. Capture it with tools/capture-build-machine-headers.sh on the build machine."
            FCWEB_ALLOW_MISSING_GL_COMPAT=1 bash toolchain/stage-headers.sh 2>&1               | tee /tmp/deplogs/03-headers.txt
            rc=${PIPESTATUS[0]}
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::staging the toolchain headers failed (exit $rc)"
            tail -40 /tmp/deplogs/03-headers.txt
            exit "$rc"
          fi

      - name: Coin3D
        id: coin
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          # The cache restores deps/wasm, but no step consulted it, so every run rebuilt
          # the whole stack -- run 32077362742 spent 2h28m recompiling artifacts that were
          # already on disk. Honour the cache this workflow already pays to save.
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libCoin.a 2>/dev/null | wc -l)" -ge 1 ]; then
            echo "  Coin3D: already built (cache hit), skipping"; exit 0
          fi
          export FCWEB_ALLOW_MISSING_GL_COMPAT=1   # a no-op once gl_compat.h is tracked
          t0=$SECONDS; rc=0
          bash configure-coin-weh.sh > /tmp/deplogs/coin.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  coin exit=$rc in $((SECONDS-t0))s"; tail -30 /tmp/deplogs/coin.txt
          # The point of a diagnostic run is the error list, which tail -30 truncates.
          # Distinct undeclared identifiers, most frequent first: gl_compat.h's specification.
          if [ "$rc" != 0 ]; then
            echo "--- identifiers Coin needs that nothing declares (candidate gl_compat.h) ---"
            grep -ohE "(undeclared identifier|unknown type name) .[A-Za-z0-9_]+" \
                 /tmp/deplogs/coin.txt 2>/dev/null \
              | grep -oE "[A-Za-z0-9_]+$" | sort | uniq -c | sort -rn | head -80 \
              | tee /tmp/deplogs/coin-missing-symbols.txt
          fi
          exit $rc

      - name: yaml-cpp
        id: yamlcpp
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          if [ "${{ inputs.rebuild }}" != "true" ] && [ -s deps/wasm/lib/libyaml-cpp.a ]; then
            echo "  yaml-cpp: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          {
            emcmake cmake -S deps/src/yaml-cpp -B build-yamlcpp -G Ninja \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
              -DYAML_BUILD_SHARED_LIBS=OFF -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF \
              -DCMAKE_INSTALL_PREFIX="$PWD/deps/wasm" \
              -DCMAKE_CXX_FLAGS="-fwasm-exceptions -pthread -O2" &&
            ninja -C build-yamlcpp install
          } > /tmp/deplogs/yamlcpp.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  yaml-cpp exit=$rc in $((SECONDS-t0))s"; tail -20 /tmp/deplogs/yamlcpp.txt
          exit $rc

      # CPython is where the -DPY_CALL_TRAMPOLINE=1 fix lands. Its failure mode is a build
      # that exits 0 and a browser that silently returns the wrong answer from every modal
      # dialog, so build-cpython*.sh assert the trampoline symbols afterwards.
      - name: CPython 3.13.3 (host + wasm/pthreads)
        id: cpython
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          if [ "${{ inputs.rebuild }}" != "true" ] && [ -s deps/wasm/lib/libpython3.13.a ]; then
            echo "  cpython: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          bash build-cpython.sh    > /tmp/deplogs/cpython.txt   2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            bash build-cpython-mt.sh > /tmp/deplogs/cpython-mt.txt 2>&1 || rc=$?
          fi
          # Stage the -pthread build where the FreeCAD link expects it, so the cache carries it.
          if [ "$rc" = 0 ]; then
            mkdir -p deps/wasm/lib
            cp deps/src/cpython/builddir/emscripten-mt/libpython3.13.a deps/wasm/lib/ || rc=$?
          fi
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  cpython exit=$rc in $((SECONDS-t0))s"
          echo "--- host/stage2 tail ---"; tail -15 /tmp/deplogs/cpython.txt 2>/dev/null
          echo "--- pthreads tail ---";    tail -25 /tmp/deplogs/cpython-mt.txt 2>/dev/null
          exit $rc

      # Only deps/wasm is cached, so until now a consumer restoring this cache got
      # libpython3.13.a and no Python.h -- which is why nothing downstream could configure
      # FreeCAD from a cache hit alone. This runs whether or not the step above rebuilt,
      # because on a cache hit that one exits early and would never reach it.
      #
      # Include/ comes from the source tarball; pyconfig.h is GENERATED into the build
      # directory, so if no build directory survives, cpython has to be rebuilt to get it.
      # That is bounded (one library, not the whole stack) and happens once.
      - name: Stage the CPython headers into the cache
        id: cpyheaders
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          dest=deps/wasm/include/python3.13
          if [ -s "$dest/Python.h" ] && [ -s "$dest/pyconfig.h" ]; then
            echo "  cpython headers: already staged"
            exit 0
          fi
          cfg=deps/src/cpython/builddir/emscripten-mt/pyconfig.h
          if [ ! -s "$cfg" ]; then
            echo "  no pyconfig.h -- rebuilding cpython to generate it"
            bash build-cpython.sh    > /tmp/deplogs/cpython-hdr.txt   2>&1 || {
              echo "::error::cpython host build failed"; tail -25 /tmp/deplogs/cpython-hdr.txt; exit 1; }
            bash build-cpython-mt.sh > /tmp/deplogs/cpython-hdr-mt.txt 2>&1 || {
              echo "::error::cpython wasm build failed"; tail -25 /tmp/deplogs/cpython-hdr-mt.txt; exit 1; }
          fi
          mkdir -p "$dest"
          cp -r deps/src/cpython/Include/. "$dest/"
          cp "$cfg" "$dest/"
          echo "  staged $(find "$dest" -name '*.h' | wc -l) python headers into $dest"

      # FreeCAD's bundled SMESH reads MED through HDF5, so the FEM file formats need it.
      # Pure C and cmake-driven, which makes it one of the cheaper remaining dependencies.
      - name: HDF5 1.14.3
        id: hdf5
        continue-on-error: true
        run: |
          mkdir -p /tmp/deplogs
          . emsdk/emsdk_env.sh
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$(ls -1 deps/wasm/lib/libhdf5*.a 2>/dev/null | wc -l)" -ge 1 ]; then
            echo "  hdf5: already built (cache hit), skipping"; exit 0
          fi
          t0=$SECONDS; rc=0
          bash configure-hdf5.sh > /tmp/deplogs/hdf5.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  hdf5 exit=$rc in $((SECONDS-t0))s"; tail -25 /tmp/deplogs/hdf5.txt
          exit $rc

      # THE GATE. Every dependency step above is continue-on-error, which is deliberate -- one
      # failure should still leave the others measured -- but it also meant a run that built
      # NOTHING reported success. Run 32077362742 was green with Coin3D "exit=0 in 3s" and no
      # libCoin.a anywhere: its cmake configure had died on Boost and `| tail -25` swallowed
      # the status. A green build that produced no library is worse than a red one.
      #
      # So judge the run by what is on disk, not by what exited 0. Coin was carried as a
      # known gap while gl_compat.h was untracked; run 32099719534 then built libCoin.a
      # clean against an EMPTY gl_compat.h, so Coin is now a hard requirement like the
      # rest. The header still matters for the FreeCAD build, not for this one.
      - name: Assert the libraries actually exist
        if: always()
        run: |
          fail=0
          check() {  # check <label> <glob> <min-count>
            n=$(ls -1 $2 2>/dev/null | wc -l | tr -d ' ')
            if [ "$n" -lt "$3" ]; then
              echo "::error::$1: found $n of at least $3 expected libraries ($2)"; fail=1
            else
              echo "  ok  $1: $n libraries"
            fi
          }
          check boost  "deps/wasm/lib/libboost_*.a"   5
          check xerces "deps/wasm/lib/libxerces-c*.a" 1
          check OCCT   "deps/wasm/lib/libTK*.a"      30
          check VTK    "deps/wasm/lib/libvtk*.a"     20
          check yamlcpp "deps/wasm/lib/libyaml-cpp.a"  1
          check cpython "deps/wasm/lib/libpython3.13.a" 1
          check hdf5    "deps/wasm/lib/libhdf5*.a"      1

          if [ -s deps/wasm/lib/libCoin.a ]; then
            echo "  ok  Coin3D: libCoin.a present"
          elif [ -e toolchain/include/gl_compat.h ]; then
            echo "::error::Coin3D: no libCoin.a, and gl_compat.h IS tracked -- a real failure, not the known gap."
            fail=1
          else
            echo "::error::Coin3D: no libCoin.a. This is NOT the gl_compat.h gap -- run 32099719534
                     built Coin clean against an empty one, so a missing library here is a real failure."
          fi
          exit $fail

      # To the step summary, not just stdout: `gh run view --log` came back empty for the
      # probe run and the timings -- the entire point -- were unreadable afterwards.
      - name: Report
        if: always()
        run: |
          {
            echo "## FreeCAD wasm dependency build"
            echo
            echo "| dependency | seconds |"
            echo "|---|---|"
            for p in "boost:${{ steps.boost.outputs.secs }}" "xerces-c:${{ steps.xerces.outputs.secs }}" \
                     "OCCT:${{ steps.occt.outputs.secs }}" "VTK:${{ steps.vtk.outputs.secs }}" \
                     "Coin3D:${{ steps.coin.outputs.secs }}" "yaml-cpp:${{ steps.yamlcpp.outputs.secs }}" \
                     "CPython:${{ steps.cpython.outputs.secs }}" "HDF5:${{ steps.hdf5.outputs.secs }}"; do
              n="${p%%:*}"; v="${p#*:}"
              echo "| $n | ${v:-**FAILED**} |"
            done
            echo
            echo "### deps/wasm/lib"
            echo '```'
            ls -la deps/wasm/lib/ 2>/dev/null || echo "(nothing)"
            echo '```'
            echo
            echo "Not a reproduction of production: the versions here are upstream picks, not"
            echo "the ones production was built from. See BUILD-WEH.md."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la deps/wasm/lib/ 2>/dev/null | sed 's/^/  /' || echo "  (nothing built)"

      # OCCT and Coin3D failed silently in run 32036398715 -- continue-on-error kept the run
      # green and the reason went nowhere, because this workflow uploaded libraries but not
      # logs. The jobs/logs API 404s for this repo, so the artifact is the only channel out.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fcweb-deps-logs
          path: /tmp/deplogs
          if-no-files-found: warn
          retention-days: 7

      # RELEASE-PLAN V4. deps/ is gitignored and most of the trees carry no version marker
      # at all, so "which sources is production built from" had no answer -- which is
      # exactly how CalculiX ended up with 69 routines silently stubbed in a clean build
      # while production's solver worked. This is the only place that can answer it: the
      # machine with deps/src populated, at the moment it finished building.
      - name: Capture which sources these libraries were built from
        if: always()
        run: |
          bash tools/capture-dep-versions.sh > deps-versions.txt || true
          echo "--- deps-versions.txt ---"
          cat deps-versions.txt

      - name: Upload the dependency manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps-versions
          path: deps-versions.txt
          if-no-files-found: warn

      - name: Upload the built libraries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fcweb-wasm-deps
          path: |
            deps/wasm/lib/*.a
            deps/wasm/include
          if-no-files-found: warn
          retention-days: 3

      # Always save, even on failure: a run that got three of five dependencies built should
      # leave those three for the next one. That is the whole point of the cache, and the
      # reason the previous fixed-key form never delivered it.
      - name: Save built dependencies
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/wasm
          key: fcweb-deps-${{ env.DEPS_KEY }}-${{ hashFiles('patches/occt.patch', 'patches/coin3d.patch', 'patches/cpython-ctypes-wasm.patch', 'patches/numpy.patch', 'patches/vtk-expat-wasm-xmlsize.patch', 'patches/apply.sh', 'configure-*-weh.sh', 'build-*-weh.sh', 'build-cpython*.sh', 'toolchain/**') }}-${{ github.run_id }}

      - name: Disk after
        if: always()
        run: df -h / | sed 's/^/  /'
