name: link FreeCAD (wasm)

# THE ACTUAL ARTIFACT.
#
# build-freecad.yml compiles, and deliberately does not link: it configures with PySide,
# Assembly and Test OFF, because compiling is what tests the patch and the headers. That is
# a useful gate and it is NOT the build that ships.
#
# This one runs the production path end to end -- the same four commands BUILD-WEH.md
# documents for the build machine:
#
#     bash build-weh-objs.sh                         # the 8 objects cmake does not build
#     bash configure-gui-weh.sh                      # -> build-freecad-gui-weh
#     ninja && ninja install                         # -> freecad-gui-install
#     bash scratchpad/linkcmds/fc-linkcmd-weh.sh     # -> bin/FreeCAD.{js,wasm,data}
#     bash scratchpad/stage-jspi.sh                  # GL post-patches + validate
#
# and produces FreeCAD.js / FreeCAD.wasm / FreeCAD.data as a downloadable artifact.
#
# It is expensive (the compile is ~1h cold, the link another ~45-60 min, wasm-opt being the
# slow tail), so the build tree and install tree are cached and every later run is
# incremental. The cache saves on always(), not success(), for the same reason the pydeps
# one does: a partial build tree is exactly what is worth keeping.

on:
  # Same reasoning as build-freecad.yml: GitHub only offers workflow_dispatch once the file
  # is on the DEFAULT branch, and this lives on the port branch. Drop the push trigger when
  # the branch merges.
  push:
    branches: [freecad-1.1.3]
    paths:
      - '.github/workflows/link-freecad.yml'
      - 'build-weh-objs.sh'
      - 'configure-gui-weh.sh'
      - 'scratchpad/linkcmds/fc-linkcmd-weh.sh'
      - 'scratchpad/stage-jspi.sh'
      # The port itself. A change here changes the source that gets linked, so not
      # watching it meant a patch fix triggered only the COMPILE check and never a relink
      # -- the artifact would stay stale while CI went green.
      - 'patches/freecad.patch'
      - 'patches/apply.sh'
      - 'toolchain/**'
      - 'tools/patch-freecad-js.py'
      # Run by this workflow, so a change to them must retrigger it (the hygiene
      # check in ci.yml enforces exactly this).
      - 'tools/check-eh-model.sh'
      - 'tools/check-symbol-hijack.py'
      - 'tools/wasm-func-sig.py'
  workflow_dispatch:
    inputs:
      rebuild:
        description: "ignore the cached build tree and start clean"
        type: boolean
        default: false
      jobs:
        description: "parallel compile jobs (blank = nproc)"
        type: string
        default: ""
      stop_after:
        description: "stop after this stage"
        type: choice
        options: [link, configure, compile, install]
        default: link
      runner:
        description: "where to build"
        type: choice
        options: [vps, hosted]
        default: vps
      ccache:
        description: "compile cache: on, off (baseline), clear (drop it first)"
        type: choice
        options: [on, off, clear]
        default: on

permissions:
  contents: read
  # actions: write is needed only to DELETE this job's own superseded build-tree caches.
  # Without it they accumulate at ~421 MB per run against a 10 GB per-repo budget: on
  # 2026-08-26 there were five, all with the same hash, and the budget stood at 9.30 GB --
  # close enough to start LRU-evicting the Qt cache (56 minutes to rebuild) and pydeps.
  actions: write

env:
  # Outside the workspace on purpose: actions/checkout runs `git clean -ffdx`, which would
  # otherwise delete the very thing this is meant to preserve.
  BUILDTREE_STORE: /home/ubuntu/.cache/fcweb-buildtree
  DEPS_KEY: v2-wasm64-emsdk6.0.9-xerces3.2.5-occt7.8.1-vtk9.3.1-coin4.0.3-boost1.86
  QT_KEY: fcweb-qt-6.11.2-wasm64-eh-jspi-mt-emsdk6.0.9-v1
  PYDEPS_KEY: v2-wasm64-emsdk6.0.9-cpython3.13.3-numpy2.1.3-mpl3.9.2

jobs:
  link:
    timeout-minutes: 720
    # One box is a single point of failure: when the runner agent died on 2026-08-25 the
    # queue simply stopped, with a verdict an hour away and no way to reach it. An absent
    # input (any push event) means vps, which is the same trap build-deps.yml fell into --
    # `inputs.runner == 'vps'` is false when there are no inputs at all.
    #
    # BUT: `runner: hosted` does not currently work, and it is not this expression's fault.
    # Dispatching it fails in two seconds with
    #     The job was not started because an Actions budget is preventing further use.
    # GitHub-hosted minutes are blocked on this account, which is the reason the whole
    # pipeline is self-hosted in the first place. The option is kept because it is correct
    # and costs nothing, and because the alternative is someone rediscovering the budget
    # wall in an hour when a build box is down. If the box is down, the box is the fix.
    runs-on: ${{ (inputs.runner || 'vps') == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "ovh", "virtastic"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A hosted runner starts with ~14 GB free and this stack needs rather more. Same
      # reclamation build-deps.yml does. Never on the build box, which owns its own disk.
      - name: Free disk (hosted only)
        if: ${{ inputs.runner == 'hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h / | sed 's/^/  /'

      - name: Which FreeCAD are we building?
        id: ver
        run: |
          set -e
          want="$(grep -v '^#' patches/freecad.version | tr -d '[:space:]')"
          [ -n "$want" ] || { echo "::error::patches/freecad.version is empty"; exit 1; }
          echo "tag=$want" >> "$GITHUB_OUTPUT"
          echo "  building FreeCAD $want (from patches/freecad.version)"

      # Three caches, restored in this order deliberately: the C++ stack owns deps/wasm,
      # and the Python one adds subdirectories (lib/*-mod, shiboken6, pyside-pkg) inside it.
      - name: Restore the C++ dependency stack
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/wasm
          key: fcweb-deps-${{ env.DEPS_KEY }}-freecad-build
          restore-keys: |
            fcweb-deps-${{ env.DEPS_KEY }}-

      - name: Restore Qt 6.11.2 for wasm
        id: qtcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: qt/6.11.2/wasm_mt_weh
          key: ${{ env.QT_KEY }}

      # This list must stay BYTE-IDENTICAL to the save list in build-python-deps.yml.
      # actions/cache derives a cache VERSION from the path list, and a restore only matches
      # caches with the same version -- so a list that has drifted silently matches an older
      # entry instead of the newest one, with no warning. That is exactly what happened: this
      # copy predated deps/src/matplotlib and deps/wasm/include/freetype2 being added, so it
      # kept restoring the cache from before the freetype headers were staged and the job
      # failed on ft2build.h against a cache that had contained it for hours.
      - name: Restore the Python extension libraries
        id: pydepscache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/wasm/lib/numpy-mod
            deps/wasm/lib/mpl-mod
            deps/wasm/lib/kiwi-mod
            deps/wasm/lib/ctypes-mod
            deps/wasm/lib/pil-mod
            deps/wasm/lib/ifc-mod
            deps/wasm/lib/pivy-mod
            deps/wasm/lib/libffi.a
            deps/src/cpython
            deps/src/numpy
            deps/src/matplotlib
            deps/wasm/include/freetype2
            deps/src/pivy
            deps/src/ifcopenshell
            deps/src/pyside-setup
            deps/src/eigen
            build-numpy
            build-pivy-wasm
            build-ifcopenshell
            deps/host/shiboken6
            deps/host/llvm-*
            deps/wasm/pyside-pkg
            deps/wasm/shiboken6
            build-shiboken-wasm
            build-pyside-wasm
          key: fcweb-pydeps-${{ env.PYDEPS_KEY }}-
          restore-keys: |
            fcweb-pydeps-${{ env.PYDEPS_KEY }}-

      # THE BUILD TREE LIVES ON THIS BOX, not in actions/cache.
      #
      # It used to be tarred, uploaded to GitHub and downloaded back every run -- roughly
      # 421 MB compressed each way, for a directory that is produced on this machine and
      # consumed on this machine and never needed anywhere else. That cost minutes of
      # transfer per run and 8.16 GB of a 10 GB per-repo cache budget, close enough to
      # start LRU-evicting the Qt cache (56 minutes to rebuild).
      #
      # A rename on the same filesystem is instant, so this is strictly faster as well as
      # strictly cheaper. It is the same reasoning that already put ccache on local disk.
      #
      # Why a move and not a symlink: actions/checkout runs `git clean -ffdx` before this
      # step, which would delete a symlink (and, following it, risk the target). Moving the
      # real directory in AFTER checkout and back out at the end sidesteps that entirely.
      #
      # The store sits outside the workspace precisely so `git clean` cannot reach it.
      # ONE-TIME BRIDGE, safe to delete once it has run.
      #
      # The build tree just moved from actions/cache to local disk. On the very first run
      # after that move the store is empty, so without this the job would rebuild every
      # edge -- about 25 minutes that the cache sitting in GitHub could have saved. This
      # restores it once, the save step then writes it to the store, and from then on the
      # probe finds the store and this is skipped forever.
      - name: Is the local build-tree store populated?
        id: store-probe
        run: |
          set -euo pipefail
          if [ -d "$BUILDTREE_STORE/build-freecad-gui-weh" ]; then
            echo "  store is populated"
            echo "need_cache=0" >> "$GITHUB_OUTPUT"
          else
            echo "  store is empty -- seeding once from actions/cache"
            echo "need_cache=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed the store from the old cache (first run only)
        if: ${{ inputs.rebuild != true && steps.store-probe.outputs.need_cache == '1' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build-freecad-gui-weh
            freecad-gui-install
            weh-objs
          key: fcweb-fclink-${{ hashFiles('patches/freecad.patch', 'configure-gui-weh.sh') }}
          restore-keys: |
            fcweb-fclink-

      - name: Restore the FreeCAD build and install trees
        id: fccache
        if: ${{ inputs.rebuild != true }}
        run: |
          set -euo pipefail
          store="$BUILDTREE_STORE"
          hit=0
          for d in build-freecad-gui-weh freecad-gui-install weh-objs; do
            if [ -d "$store/$d" ]; then
              rm -rf "./$d"
              mv "$store/$d" "./$d"
              hit=1
              echo "  restored $d"
            else
              echo "  $d: not in the store (cold)"
            fi
          done
          echo "cache-hit=$hit" >> "$GITHUB_OUTPUT"
          df -h . | tail -1

      # rebuild:true means "do not reuse anything". Without this the store would survive a
      # rebuild request and the request would silently do nothing -- which is the shape of
      # bug this repo has hit before: a flag that claims to reset state and does not.
      - name: Drop the stored build tree (rebuild requested)
        if: ${{ inputs.rebuild == true }}
        run: |
          set -euo pipefail
          rm -rf "$BUILDTREE_STORE"
          echo "  build-tree store dropped at the user's request"

      # Every input the link names comes from another workflow. Say which one is missing and
      # which workflow makes it, rather than failing an hour later inside cmake or wasm-ld.
      - name: Is everything the link needs actually here?
        run: |
          set -e
          fail=0
          need() {  # need <path> <what> <workflow>
            if [ -e "$1" ]; then echo "  ok       $2"
            else echo "::error::missing $2 ($1) -- run $3 first"; fail=1; fi
          }
          need deps/wasm/lib/libTKernel.a                          "OCCT"                build-deps.yml
          need deps/wasm/lib/libCoin.a                             "Coin3D"              build-deps.yml
          need deps/wasm/lib/libxerces-c.a                         "Xerces"              build-deps.yml
          need deps/wasm/lib/libvtkCommonCore-9.3.a                "VTK"                 build-deps.yml
          need qt/6.11.2/wasm_mt_weh/lib/cmake/Qt6                  "Qt 6.11.2 for wasm"   build-qt-wasm.yml
          need deps/src/cpython/builddir/emscripten-mt/libpython3.13.a "CPython (wasm/mt)" build-python-deps.yml
          need deps/wasm/lib/numpy-mod/libnpy__multiarray_umath.a  "numpy"               build-python-deps.yml
          need deps/wasm/lib/mpl-mod/libfreetype.a                 "freetype (via mpl)"  build-python-deps.yml
          need deps/wasm/lib/kiwi-mod/libkiwi__cext.a              "kiwisolver"          build-python-deps.yml
          need deps/wasm/lib/ctypes-mod/lib_ctypes.a               "_ctypes"             build-python-deps.yml
          need deps/wasm/lib/pil-mod/libpil__imaging.a             "PIL"                 build-python-deps.yml
          need deps/wasm/lib/pivy-mod/lib_coin.a                   "pivy _coin"          build-python-deps.yml
          need deps/wasm/lib/ifc-mod/lib_ifcopenshell_wrapper.a    "IfcOpenShell wrapper" build-python-deps.yml
          need deps/wasm/lib/ifc-mod/libIfcParse.a                 "IfcOpenShell IfcParse" build-python-deps.yml
          need build-pyside-wasm/PySide6/QtWidgets/QtWidgets.abi3.a "PySide6 QtWidgets"  build-python-deps.yml
          need deps/wasm/shiboken6/lib/libshiboken6.abi3.a         "libshiboken6"        build-python-deps.yml
          need build-pyside-wasm/PySide6/QtNetwork/QtNetwork.abi3.a "PySide6 QtNetwork"   build-python-deps.yml
          need build-pyside-wasm/PySide6/QtSvg/QtSvg.abi3.a         "PySide6 QtSvg"       build-python-deps.yml
          need deps/wasm/pyside-pkg/PySide6/__init__.py            "pyside-pkg glue"     build-python-deps.yml
          # The PYTHON half of every third-party package. The C half is linked from the
          # archives above and registered in the inittab, so a build missing these produces
          # a binary where numpy._core._multiarray_umath is a builtin that nothing can
          # import -- FEM, Draft, BIM and Plot all dead, with every other gate green. That
          # shipped once. It happened because the dependency lane staged the tree and then
          # could not save its cache (the key did not cover the staging script), so the link
          # restored a pre-staging cache and never noticed.
          need deps/wasm/pyside-pkg/numpy/__init__.py               "numpy (python half)" build-python-deps.yml
          need deps/wasm/pyside-pkg/matplotlib/__init__.py          "matplotlib (python)" build-python-deps.yml
          need deps/wasm/pyside-pkg/PIL/__init__.py                 "PIL (python half)"   build-python-deps.yml
          need deps/wasm/pyside-pkg/ifcopenshell/__init__.py        "ifcopenshell (py)"   build-python-deps.yml
          need deps/wasm/pyside-pkg/pivy/pivy_meta.py               "pivy (python half)"  build-python-deps.yml

          # An archive that exists is not the same as an archive that is linked. QtNetwork
          # was built, verified to carry PyInit_QtNetwork, registered in the inittab and
          # aliased in the package glue -- and the link still died two hours in on
          # "undefined symbol: PyInit_QtNetwork", because nothing had put it on the link
          # line. This compares the three files that have to agree, in a second.
          python3 tools/check-pyside-link-line.py || fail=1
          exit $fail

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: emsdk
          key: emsdk-6.0.9-wasm64-shims-v1

      - name: Install emsdk 6.0.9
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9

      # THE COMPILE CACHE.
      #
      # Why this is needed at all: deps/src/freecad is cached nowhere and is re-extracted
      # every run, but a tag tarball carries the TAG's mtimes, so the ~2,700 pristine
      # sources come back older than the cached objects and are correctly up to date.
      # patches/apply.sh then rewrites ~200 files with patch(1), stamping them NOW --
      # newer than every object, unconditionally, every run. Those 200 fan out to 1,860
      # edges. Run 33004112792 ended `reached: [1860/1860]`: every target rebuilt, 87.9 of
      # its 110 minutes, with a 421 MB build-tree cache restored and then discarded.
      #
      # 1,860 is a deterministic floor, not bad luck. It recurs until either the mtimes
      # stop moving or the compiles stop costing anything. This is the second.
      #
      # NOT chosen: touching the patched files back to a fixed mtime. It is faster (0 edges
      # rather than 1,860 cheap ones) and it is the wrong trade -- getting it wrong in the
      # "should rebuild but doesn't" direction pairs new source with old objects and
      # nothing notices. That is the shape RELEASE-PLAN.md V7 says to avoid. ccache errs
      # the other way: an unrecognised input is a miss, and a miss is slow, not wrong.
      #
      # ccache is installed on the box by hand (apt, 4.12.3) rather than here, so this
      # workflow needs no root. If it is missing the compile still runs -- slowly -- and
      # says so loudly, because a check that cannot tell "0 hits because it missed" from
      # "0 hits because it never ran" is not a check.
      - name: Compile cache (ccache)
        id: ccache
        run: |
          set -e
          MODE="${{ inputs.ccache || 'on' }}"
          if [ "${{ inputs.rebuild }}" = "true" ] && [ "$MODE" = "on" ]; then
            MODE=clear          # "start clean" should mean clean
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if ! command -v ccache >/dev/null 2>&1; then
            echo "::warning::ccache is not installed on this runner -- the compile will be"
            echo "::warning::uncached and will take ~88 minutes. Install it: sudo apt-get install -y ccache"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          export CCACHE_DIR="$HOME/.cache/fcweb-ccache"
          mkdir -p "$CCACHE_DIR/tmp"
          if [ "$MODE" = "clear" ]; then
            echo "  clearing the cache on request"
            ccache -C >/dev/null 2>&1 || true
          fi
          echo "  $(ccache --version | head -1), mode=$MODE"
          # --show-config labels each value (environment)/(default), so a setting that did
          # NOT take effect is visible rather than assumed.
          ccache --show-config 2>/dev/null \
            | grep -iE "cache_dir|max_size|compress|compiler_check|sloppiness|depend_mode|temporary" \
            | sed 's/^/  /'
          df -h "$HOME" | tail -1 | awk '{print "  disk free: "$4" (used "$5")"}'

      - name: Host Python 3.13 (must match the wasm CPython)
        id: hostpy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Host Qt 6.11.2 (native tools only)
        id: hostqt
        run: |
          set -e
          if [ -d qt-host/6.11.2/gcc_64/bin ]; then
            echo "  host Qt already present"
          else
            python3 -m pip install --quiet --break-system-packages aqtinstall 2>/dev/null \
              || python3 -m pip install --quiet aqtinstall
            python3 -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 \
              -m qtshadertools -O "$PWD/qt-host"
          fi
          host="$PWD/qt-host/6.11.2/gcc_64"
          [ -x "$host/libexec/moc" ] || [ -x "$host/bin/moc" ] || {
            echo "::error::no moc under $host"; find qt-host -name moc | head; exit 1; }
          echo "  QT_HOST_PATH=$host"

      - name: Build tools (pybind11, swig) and the ICU port
        run: |
          set -e
          . emsdk/emsdk_env.sh
          # SWIG IS PINNED, and it must match the version that built pivy in
          # build-python-deps.yml (swig==4.2.1). This is not tidiness.
          #
          # FreeCAD compiles a SWIG runtime into itself to convert Python coin nodes
          # into C++ SoNode*. SWIG publishes its type table in the interpreter under a
          # VERSION-STAMPED key: swig_runtime_data4 for 4.2.x, swig_runtime_data5 for
          # 4.4.x. Two different versions in one binary cannot see each other's types.
          #
          # Unpinned this resolved to 4.4.1 while pivy stayed on 4.2.1, and the linked
          # wasm carried BOTH keys -- 2x swig_runtime_data4, 5x swig_runtime_data5.
          # FreeCAD asked for the table pivy had not registered, every SWIG pointer
          # conversion failed with "No SWIG wrapped library loaded", and any Python
          # view provider calling addDisplayMode(coinNode, ...) threw. Opening a
          # document with Assembly or Draft view providers gave a BLACK VIEWPORT:
          # the app booted, the geometry loaded, and nothing drew.
          SWIG_PIN=4.2.1        # keep in step with build-python-deps.yml
          python3 -m pip install --quiet --break-system-packages pybind11 "swig==$SWIG_PIN" 2>/dev/null \
            || python3 -m pip install --quiet pybind11 "swig==$SWIG_PIN"
          python3 -c 'import pybind11; print("  pybind11:", pybind11.get_cmake_dir())'
          swig -version | grep -i version | head -1 | sed 's/^/  swig: /'
          embuilder build icu
          # ...and again for the PTHREADS variant. embuilder builds ports with DEFAULT
          # settings, so `embuilder build icu` produces a single-threaded ICU, and the
          # FreeCAD link -- which is -pthread throughout -- ends in
          #     --shared-memory is disallowed by umutex.cpp.o because it was not compiled
          #     with 'atomics' or 'bulk-memory' features
          # Emscripten caches port builds per settings-variant, so compiling one trivial
          # translation unit with -pthread --use-port=icu builds and caches the right one.
          echo 'int main(){return 0;}' > /tmp/icuprobe.cpp
          em++ -pthread --use-port=icu -c /tmp/icuprobe.cpp -o /tmp/icuprobe.o
          echo "  icu sysroot: $(em-config CACHE)/sysroot"
          echo "  icu libraries now in the cache:"
          find "$(em-config CACHE)" -name 'libicu*.a' | sed 's|.*/cache/|    |'

      - name: Fetch FreeCAD ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          if [ -e deps/src/freecad/CMakeLists.txt ]; then
            echo "  freecad: present"
          else
            mkdir -p deps/src/freecad
            curl -fsSL -o /tmp/freecad.tar.gz \
              "https://github.com/FreeCAD/FreeCAD/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
            tar xzf /tmp/freecad.tar.gz -C deps/src/freecad --strip-components=1
          fi
          ls deps/src/freecad/CMakeLists.txt

      # GitHub source tarballs carry no submodules. build-freecad.yml needs only GSL because
      # it builds with BUILD_ASSEMBLY=OFF; the production configure has it ON, and Assembly
      # is a real workbench, so OndselSolver has to come too.
      #
      # AddonManager is now fetched as well. It was off because "the submodule is missing
      # from the tarball" -- but that is a description of the obstacle, not a reason: GSL and
      # OndselSolver have the same problem and are simply fetched. Pinned to the commit
      # FreeCAD 1.1.3 itself points at, so this tracks the release rather than a moving
      # branch. googletest stays out; it is only for ENABLE_DEVELOPER_TESTS, which is off.
      - name: Submodules the tarball does not carry (GSL, OndselSolver, AddonManager)
        run: |
          set -e
          gsl=deps/src/freecad/src/3rdParty/GSL
          if [ ! -e "$gsl/include/gsl/gsl" ]; then
            mkdir -p "$gsl"
            curl -fsSL -o /tmp/gsl.tar.gz https://github.com/microsoft/GSL/archive/refs/tags/v4.0.0.tar.gz
            tar xzf /tmp/gsl.tar.gz -C "$gsl" --strip-components=1
          fi
          echo "  GSL:          $(ls "$gsl/include/gsl" | wc -l) headers"
          ond=deps/src/freecad/src/3rdParty/OndselSolver
          if [ ! -e "$ond/CMakeLists.txt" ]; then
            mkdir -p "$ond"
            curl -fsSL -o /tmp/ondsel.tar.gz \
              https://github.com/Ondsel-Development/OndselSolver/archive/refs/heads/main.tar.gz
            tar xzf /tmp/ondsel.tar.gz -C "$ond" --strip-components=1
          fi
          [ -e "$ond/CMakeLists.txt" ] || { echo "::error::OndselSolver missing -- BUILD_ASSEMBLY needs it"; exit 1; }
          echo "  OndselSolver: present"
          # The commit FreeCAD 1.1.3 pins for src/Mod/AddonManager. Read from the tag, not
          # from a branch: an addon manager newer than the app it ships in is a bug waiting.
          adm=deps/src/freecad/src/Mod/AddonManager
          adm_sha=937b6877239dc78ef59eeefe8099e5f14243eda1
          if [ ! -e "$adm/AddonManager.py" ]; then
            mkdir -p "$adm"
            curl -fsSL -o /tmp/addonmgr.tar.gz \
              "https://codeload.github.com/FreeCAD/AddonManager/tar.gz/$adm_sha"
            tar xzf /tmp/addonmgr.tar.gz -C "$adm" --strip-components=1
          fi
          [ -e "$adm/AddonManager.py" ] || { echo "::error::AddonManager missing -- BUILD_ADDONMGR needs it"; exit 1; }
          echo "  AddonManager: present ($(ls "$adm"/*.py 2>/dev/null | wc -l) modules)"

      - name: The patch matches this tree byte for byte
        run: python3 tools/check-patch-applies.py patches/freecad.patch deps/src/freecad

      - name: Apply the source patches
        run: |
          set -e
          FCWEB_PATCH_OPTIONAL=1 bash patches/apply.sh
          for f in src/Main/MainGui.cpp src/Gui/CMakeLists.txt; do
            n=$(grep -c 'EMSCRIPTEN' "deps/src/freecad/$f" || true)
            echo "  $f: $n EMSCRIPTEN references"
            [ "$n" -gt 0 ] || { echo "::error::$f carries no wasm port"; exit 1; }
          done

      - name: Stage the force-included compat headers
        run: FCWEB_FORCE_STAGE_HEADERS=1 bash toolchain/stage-headers.sh

      # The eight objects cmake does not build. Verified by symbol inside the script -- an
      # object that compiles to nothing is the failure this repo has already shipped once.
      # The PySide archives are the one input that can be PRESENT and USELESS: emstrip drops
      # the symbol table, and the link runs with ERROR_ON_UNDEFINED_SYMBOLS=0, so a stripped
      # archive becomes a trapping `import PySide6.QtWidgets` in the browser rather than a
      # build failure. Check the symbol, not the file.
      #
      # AFTER the emsdk steps, deliberately. This ran before them once and reported all three
      # archives symbol-less because llvm-nm did not exist yet -- a check that cannot tell
      # "the symbol is absent" from "the checker did not run" is not a check, which is the
      # same trap this repository has now hit in four different places. Hence the explicit
      # test for nm below.
      # A signature mismatch across a library boundary does not fail the link -- with
      # ERROR_ON_UNDEFINED_SYMBOLS=0 wasm-ld resolves it to a stub that traps, and the bill
      # arrives as "RuntimeError: unreachable" in the browser. That is how the shipped
      # FEMExample crashed the engine for months on expat's XML_Index width. Seconds here
      # against a two-hour link and a crash a user finds.
      - name: Do the expat halves agree about XML_Index?
        run: |
          set -e
          fail=0
          for sym in vtkexpat_XML_GetCurrentByteIndex                      vtkexpat_XML_GetCurrentLineNumber                      vtkexpat_XML_GetCurrentColumnNumber; do
            echo "  $sym"
            python3 tools/wasm-archive-sig.py "$sym"               deps/wasm/lib/libvtkexpat-9.3.a deps/wasm/lib/libvtkIOXMLParser-9.3.a || fail=1
          done
          exit $fail

      - name: The PySide archives carry their PyInit
        run: |
          set -e
          nm=emsdk/upstream/bin/llvm-nm
          [ -x "$nm" ] || { echo "::error::$nm is missing -- cannot verify the archives"; exit 1; }
          fail=0
          # Every module MainGui.cpp registers, not the three this loop was written
          # with. QtNetwork and QtSvg were added to the inittab, built, and put on the
          # link line, and this check looked straight past both -- so the first thing
          # to notice that QtSvg.abi3.a had no PyInit_QtSvg was wasm-ld, two hours in.
          mods=$(grep -oE 'PyImport_AppendInittab[(]"Qt[A-Za-z]+_fcweb"' patches/freecad.patch | grep -oE 'Qt[A-Za-z]+' | sort -u)
          [ -n "$mods" ] || { echo "::error::no PySide inittab registrations found in the patch"; exit 1; }
          echo "  checking: $(echo $mods)"
          for m in $mods; do
            a="build-pyside-wasm/PySide6/$m/$m.abi3.a"
            if "$nm" "$a" 2>/dev/null | grep -q "T PyInit_$m"; then
              echo "  ok       $m ($a)"
            else
              echo "::error::$a has no PyInit_$m -- rerun build-python-deps.yml"
              echo "    first lines nm produced:"
              "$nm" "$a" 2>&1 | head -3 | sed 's/^/      /'
              fail=1
            fi
          done
          exit $fail

      - name: weh-objs
        run: |
          set -e
          . emsdk/emsdk_env.sh
          bash build-weh-objs.sh

      # Before the hour-long compile, not after: an object built -fexceptions cannot link
      # against this -fwasm-exceptions build, and wasm-ld's message names no file at all
      # ("referenced by root reference (e.g. compiled C/C++ code)"). Two rounds were spent
      # guessing which lane it was.
      - name: Which objects were built with the wrong exception model?
        run: |
          set -e
          . emsdk/emsdk_env.sh 2>/dev/null || true
          bash tools/check-eh-model.sh

      - name: Configure (the production configure, not a compile check)
        id: configure
        run: |
          set -e
          mkdir -p /tmp/fclogs
          . emsdk/emsdk_env.sh
          # A configure that FAILED still writes CMakeCache.txt, complete with the negative
          # results of whatever probes it got through -- and the cache saves on always(), so
          # the next run restores those negatives and repeats them. build.ninja is the signal
          # that a configure actually finished; without it the tree is a liability.
          if [ -f build-freecad-gui-weh/CMakeCache.txt ] && [ ! -f build-freecad-gui-weh/build.ninja ]; then
            echo "  restored build tree has CMakeCache.txt but no build.ninja -- a failed"
            echo "  configure. Discarding it rather than inheriting its cached probe results."
            rm -rf build-freecad-gui-weh
          fi
          bash configure-gui-weh.sh 2>&1 | tee /tmp/fclogs/configure.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "::error::configure failed"
            tail -60 /tmp/fclogs/configure.txt
            tail -60 build-freecad-gui-weh/CMakeFiles/CMakeError.log 2>/dev/null || true
          fi
          exit $rc

      - name: Compile
        id: compile
        if: ${{ inputs.stop_after != 'configure' }}
        run: |
          set +e
          set -o pipefail
          . emsdk/emsdk_env.sh
          n="${{ inputs.jobs }}"; [ -n "$n" ] || n="$(nproc)"
          t0=$(date +%s)

          # ccache via EM_COMPILER_WRAPPER, not CMAKE_CXX_COMPILER_LAUNCHER.
          #
          # emcc.py reads it at RUNTIME (tools/config.py builds "EM_" + COMPILER_WRAPPER
          # from the environment) and does `compiler.insert(0, ...)` at emcc.py:972 -- so
          # ninja runs the identical command line it ran yesterday, the restored build tree
          # stays valid, and no edge goes dirty. A compiler launcher would rewrite every
          # command in build.ninja and dirty all ~2,700 edges, both when added and again if
          # ever removed.
          #
          # It also means ccache sees the REAL clang++, not the em++ Python shim, which is
          # what makes compiler_check=content meaningful. With a launcher it would be
          # hashing a wrapper that has nothing to do with code generation -- a stamp, and
          # this project has been bitten by stamps.
          #
          # compiler_check=content is NOT optional. The default (mtime) identifies the
          # compiler by path+size+mtime, and the emsdk here is restored from a cache whose
          # key is a hand-written string (emsdk-6.0.9-wasm64-shims-v1) with tar-restored mtimes:
          # an emsdk change that did not change that string would hand ccache a new clang
          # wearing the old identity.
          #
          # sloppiness stays EMPTY on purpose. The -include absolute-path compat headers
          # and -fwasm-exceptions/-pthread need none: paths are stable on this one box and
          # header CONTENTS are hashed. file_stat_matches (trust an include's mtime over
          # its content) and time_macros (cache objects containing __DATE__) would each
          # reintroduce exactly the bug class this repo keeps hitting.
          if [ "${{ steps.ccache.outputs.available }}" = "true" ] \
             && [ "${{ steps.ccache.outputs.mode }}" != "off" ]; then
            export CCACHE_DIR="$HOME/.cache/fcweb-ccache"
            export CCACHE_TEMPDIR="$CCACHE_DIR/tmp"
            export CCACHE_MAXSIZE=6G
            export CCACHE_COMPRESS=1
            export CCACHE_COMPRESSLEVEL=1
            export CCACHE_COMPILERCHECK=content
            export CCACHE_SLOPPINESS=
            export CCACHE_DEPEND=true
            export CCACHE_STATSLOG=/tmp/fclogs/ccache-stats.log
            export EM_COMPILER_WRAPPER=ccache
            echo "  ccache: $(command -v ccache) via EM_COMPILER_WRAPPER"
            ccache --zero-stats >/dev/null 2>&1 || true
          else
            echo "  ccache: DISABLED (available=${{ steps.ccache.outputs.available }} mode=${{ steps.ccache.outputs.mode }})"
          fi

          # Which edges does ninja think are dirty, and why? `-d explain` names the file
          # whose mtime moved. This turns "we believe it is the patch mtimes" into a line
          # in the log, permanently -- if the cache ever stops working, this says what did it.
          echo "--- why ninja thinks work is needed (first 12) ---"
          ninja -C build-freecad-gui-weh -n -d explain 2>&1 \
            | grep -F 'ninja explain' | head -12 | sed 's/^/  /' || true
          # -k 0 so one failure does not hide the other 40. The FreeCADMain link target is
          # excluded here on purpose: fc-linkcmd-weh.sh is the link, and it carries flags
          # (fcweb_dispatch_event in ASYNCIFY_EXPORTS, wasm_event_dispatch.o) that the cmake
          # target does not.
          # Four archives are named as raw TEXT in CMAKE_EXE_LINKER_FLAGS, so ninja has no
          # dependency edge from the executables to them and may link before they exist:
          #     em++: error: .../src/Mod/Draft/App/DraftUtils.a: No such file or directory
          #     [2688/2701] Linking CXX static library src/Mod/Draft/App/DraftUtils.a
          # -- the exe linked at 2687, the archive appeared at 2688. Earlier runs simply got
          # a luckier order. Build them first; the main pass then finds them.
          ninja -C build-freecad-gui-weh -j "$n"             src/Mod/Draft/App/DraftUtils.a             src/Mod/CAM/libarea/area.a             src/Mod/CAM/libarea/libarea-native.a             src/Mod/Test/Gui/QtUnitGui.a 2>&1 | tail -5
          ninja -C build-freecad-gui-weh -j "$n" -k 0 2>&1 | tee /tmp/fclogs/compile.txt
          rc=${PIPESTATUS[0]}
          # NOTE: nothing may go between the pipeline above and this line -- rc is
          # PIPESTATUS[0] and any command in between would overwrite it.
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          echo "  reached: $(grep -oE '\[[0-9]+/[0-9]+\]' /tmp/fclogs/compile.txt | tail -1)"
          if [ "${{ steps.ccache.outputs.available }}" = "true" ] \
             && [ "${{ steps.ccache.outputs.mode }}" != "off" ]; then
            export CCACHE_DIR="$HOME/.cache/fcweb-ccache"
            ccache -s -v 2>&1 | tee /tmp/fclogs/ccache.txt | sed 's/^/  /'
            # Direct hits are the win. Preprocessed hits mean direct mode is failing --
            # investigate, do not celebrate. "Unsupported compiler option" must be 0 or we
            # are paying full price silently.
            _num() { grep -iE "^ *$1" /tmp/fclogs/ccache.txt | grep -oE '[0-9]+' | head -1; }
            H=$(_num 'Direct'); PH=$(_num 'Preprocessed'); M=$(_num 'Cache miss')
            H=${H:-0}; PH=${PH:-0}; M=${M:-0}
            TOT=$(( H + PH + M ))
            if [ "$TOT" -gt 0 ]; then
              RATE=$(( (H + PH) * 100 / TOT ))
              echo "ccache_hits=$H" >> "$GITHUB_OUTPUT"
              echo "ccache_miss=$M" >> "$GITHUB_OUTPUT"
              echo "ccache_rate=$RATE" >> "$GITHUB_OUTPUT"
              echo "  ccache: $H direct + $PH preprocessed hits, $M misses -- ${RATE}%"
              # A warning, never a failure: the populating run legitimately misses
              # everything, and a gate that fires on its own first correct run gets
              # deleted rather than fixed.
              if [ "$TOT" -gt 1000 ] && [ "$RATE" -lt 80 ]; then
                echo "::warning::ccache hit rate ${RATE}% over $TOT compilations -- expected >=80% on a warm cache"
              fi
            fi
          fi
          echo "  failed targets: $(grep -c '^FAILED:' /tmp/fclogs/compile.txt || true)"
          if [ "$rc" != 0 ]; then
            echo "--- distinct errors, most frequent first ---"
            grep -oE "error: .*" /tmp/fclogs/compile.txt | sed 's/[0-9]\+/N/g' \
              | sort | uniq -c | sort -rn | head -30
          fi
          exit $rc

      # ccache -s proves ccache RAN. It says nothing about whether the object it served is
      # the object clang produces for that input right now, and that gap is exactly the one
      # this project keeps falling into: a claim stored beside a thing, with nothing tying
      # the claim to the thing's content.
      #
      # Advisory until it has a run history, for the same reason the rendering gate is:
      # this assumes wasm objects are bit-reproducible. They should be -- no timestamps,
      # deterministic symbol order -- but that must be OBSERVED before a mismatch is read
      # as a defect rather than as a property of the compiler.
      - name: Do ccache's objects match what the compiler produces now?
        id: ccacheverify
        if: ${{ always() && steps.ccache.outputs.available == 'true' && steps.ccache.outputs.mode != 'off' }}
        continue-on-error: true
        run: |
          . emsdk/emsdk_env.sh
          export CCACHE_DIR="$HOME/.cache/fcweb-ccache"
          python3 tools/check-ccache-objects.py build-freecad-gui-weh --sample 15

      - name: Install
        id: install
        if: ${{ inputs.stop_after != 'configure' && inputs.stop_after != 'compile' }}
        run: |
          set -e
          . emsdk/emsdk_env.sh
          # A PARTIAL install is what this has to catch. The existing "is there a Mod tree"
          # check below passes when half the workbenches copied, and the install tree is
          # what becomes FreeCAD.data -- so a silent partial install is one of the ways a
          # payload loses its packages.
          ninja -C build-freecad-gui-weh install 2>&1 | tail -20
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error::ninja install failed (exit $rc)"; exit "$rc"; }
          echo "  Mod:   $(find freecad-gui-install/Mod -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l) workbench dirs"
          echo "  Ext:   $(find freecad-gui-install/Ext -type f 2>/dev/null | wc -l) files"
          echo "  share: $(find freecad-gui-install/share -type f 2>/dev/null | wc -l) files"
          [ -d freecad-gui-install/Mod ] || { echo "::error::install produced no Mod tree"; exit 1; }

      - name: Link
        id: link
        if: ${{ inputs.stop_after == '' || inputs.stop_after == 'link' }}
        run: |
          set -e
          . emsdk/emsdk_env.sh
          cd build-freecad-gui-weh
          # A marker to date the outputs against. A link that fails leaves the PREVIOUS
          # bin/FreeCAD.* in place, and every later step happily works on them.
          touch /tmp/fclogs/.link-started
          # PIPESTATUS, not the pipeline's status. `cmd | tee | tail` exits with tail's
          # status, which is always 0, so `set -e` never saw a failed link: run 32868637104
          # ended with "wasm-ld: error: undefined symbol: PyInit_QtSvg" and reported
          # "Link: success". What it handed on was a stale binary from an abandoned
          # experiment, and the only reason anyone noticed is that the GL patch table no
          # longer matched it. Configure and Compile above already do this; Link did not.
          bash ../scratchpad/linkcmds/fc-linkcmd-weh.sh 2>&1 | tee /tmp/fclogs/link.txt | tail -40
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "::error::the link failed (exit $rc) -- see the tail above and the link log artifact"
            exit "$rc"
          fi
          # ... and even a zero exit is not proof the files were rewritten.
          for f in bin/FreeCAD.js bin/FreeCAD.wasm bin/FreeCAD.data; do
            [ -s "$f" ] || { echo "::error::$f is missing after a link that claimed to succeed"; exit 1; }
            [ "$f" -nt /tmp/fclogs/.link-started ] || {
              echo "::error::$f is older than this link -- it is left over from an earlier"
              echo "         build, so everything downstream would be testing that one"
              exit 1; }
          done
          ls -la bin/FreeCAD.js bin/FreeCAD.wasm bin/FreeCAD.data 2>&1 | sed 's/^/  /'

      # NOT scratchpad/stage-jspi.sh. That script is build-machine-shaped: it copies into
      # play-gui/ from spikes/01-qt-widgets/build/qtloader.js (untracked) and validates with
      # scratchpad/wasmvalidate.js (does not exist). The part that MATTERS is
      # tools/patch-freecad-js.py -- six behavioural GL fixes that live only in the linked
      # JS, are silently lost by every relink, and whose absence is a boot-time storm of
      # "Cannot read properties of null (reading '0')" with newDocument() never returning.
      # FreeCAD and pivy must share a SWIG runtime version, or every Python view
      # provider throws "No SWIG wrapped library loaded" and the viewport is black --
      # while every other gate passes, because they build geometry through C++ view
      # providers that never cross the bridge. See the tool's header.
      - name: FreeCAD and pivy share a SWIG runtime
        if: ${{ inputs.stop_after == '' || inputs.stop_after == 'link' }}
        run: python3 tools/check-swig-runtime.py build-freecad-gui-weh deps/wasm

      - name: GL post-patches, and validate the wasm
        if: ${{ inputs.stop_after == '' || inputs.stop_after == 'link' }}
        run: |
          set -e
          # node comes from emsdk, not from the runner. Without this the validate below
          # fails with "node: command not found" AFTER the patches have been applied --
          # a green link reported as a failure.
          . emsdk/emsdk_env.sh
          js=build-freecad-gui-weh/bin/FreeCAD.js
          # Keep a copy with the logs. It is 489 KB, it rides along with an artifact that is
          # uploaded on always(), and when a patch site moves it is the only way to see what
          # emscripten actually emitted without re-running an hour-long link.
          mkdir -p /tmp/fclogs && cp "$js" /tmp/fclogs/FreeCAD.js
          python3 tools/patch-freecad-js.py "$js"
          echo "--- verifying they are in ---"
          python3 tools/patch-freecad-js.py "$js" --check
          node -e '
            const fs=require("fs");
            const b=fs.readFileSync("build-freecad-gui-weh/bin/FreeCAD.wasm");
            if(!WebAssembly.validate(b)){console.error("::error::FreeCAD.wasm does not validate");process.exit(1);}
            console.log("  FreeCAD.wasm VALID, "+(b.length/1048576).toFixed(1)+" MB");
          '
          # wasm64 NOTE: these numbers were measured on the wasm32 build. 64-bit pointers make the
          # module bigger -- expect the correct link to land somewhere above 152 MB, and the
          # skipped-wasm-opt case to move up with it. The 200 MB threshold is kept unchanged on
          # purpose: it is a discriminator between "optimised" and "wasm-opt never ran", not a
          # budget, and guessing a new value before a single wasm64 link has been measured would
          # either mask the failure it exists to catch or fail a good build. RE-BASELINE IT from the
          # first green wasm64 link: set it a little above the real size, not to a round number.
          # A correct link lands near 152 MB. ~234 MB means wasm-opt did not run (or was
          # killed mid-link, leaving the un-optimized intermediate looking finished), which
          # is a large silent performance regression -- the same check
          # tools/sync-play-artifacts.sh makes before it will stage anything.
          sz=$(stat -c %s build-freecad-gui-weh/bin/FreeCAD.wasm)
          if [ "$sz" -gt 200000000 ]; then
            echo "::error::FreeCAD.wasm is $sz bytes -- that is the pre-wasm-opt size"
            exit 1
          fi

      - name: What came out
        if: always()
        run: |
          echo "### FreeCAD ${{ steps.ver.outputs.tag }} for wasm -- link" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "| stage | result | seconds |"
            echo "|---|---|---|"
            echo "| configure | ${{ steps.configure.outcome }} | |"
            echo "| compile | ${{ steps.compile.outcome }} | ${{ steps.compile.outputs.seconds }} |"
            echo "| install | ${{ steps.install.outcome }} | |"
            echo "| link | ${{ steps.link.outcome }} | |"
            echo
            if [ "${{ steps.ccache.outputs.available }}" != "true" ]; then
              echo "**ccache: NOT AVAILABLE** -- this compile was uncached."
            else
              echo "ccache (\`${{ steps.ccache.outputs.mode }}\`): ${{ steps.compile.outputs.ccache_hits }} hits, ${{ steps.compile.outputs.ccache_miss }} misses, ${{ steps.compile.outputs.ccache_rate }}% hit rate"
            fi
            echo
            for f in build-freecad-gui-weh/bin/FreeCAD.js build-freecad-gui-weh/bin/FreeCAD.wasm \
                     build-freecad-gui-weh/bin/FreeCAD.data; do
              [ -e "$f" ] && echo "- \`$(basename $f)\` $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- module archives built ---"
          find build-freecad-gui-weh -name '*.a' 2>/dev/null | wc -l

      # shiboken's limited-API stand-ins (PyMethod_New and friends) hijack CPython's
      # symbols in a static monolith. patches/pyside-setup.patch renames them out of the
      # way -- but that rename sat behind a macro defined nowhere and was inert for the
      # whole of the 1.1.3 port, which is precisely why the app could not boot: every
      # bound method built during interpreter startup raised "null argument to internal
      # routine". Check the linked binary, not the build flags, so it cannot go quiet again.
      - name: No CPython symbols hijacked by shiboken shims
        if: always()
        run: |
          f=build-freecad-gui-weh/bin/FreeCAD.wasm
          if [ -s "$f" ]; then
            python3 tools/check-symbol-hijack.py "$f"
          else
            echo "no linked wasm to check"
          fi

      # THE GATE THIS REPOSITORY DID NOT HAVE. For the whole of the 1.1.3 port the
      # application could not start, and every check above was green: they compile, link,
      # validate and measure the binary, but not one of them RUNS it. This one launches the
      # artifact in headless Chromium, waits for the app to report Ready, then makes FreeCAD
      # build a Part::Box and checks the volume and topology that come back -- interpreter,
      # bindings and OCCT kernel together, which is exactly what the boot bug broke.
      #
      # Proven in both directions before it landed: it passes the fixed engine, and against
      # the pre-fix binary it fails with "err=failed to initialize importlib".
      #
      # ?no3d is deliberate. Headless GL is not the GL a user has, so a rendering verdict
      # from here would look like coverage while proving something else (RELEASE-PLAN V6).
      - name: Boot gate -- does the application actually start and do CAD work?
        id: bootgate
      # The gate budgets itself to 40 minutes, and that budget bounds its WAITS -- not
      # a page load, a syncfs, or anything else that can sit. Measured on run 32946598073:
      # 53 minutes and still going, on a healthy box, with the self-budget in the build.
      # A limit a process enforces on itself is a promise; this one is a limit. Generous
      # enough that the gate still reports its own verdict when it can, because "the gate
      # said which scenario" beats "the runner killed it".
        timeout-minutes: 55
        run: |
          set -e
          bin=build-freecad-gui-weh/bin
          [ -s "$bin/FreeCAD.wasm" ] || { echo "::error::no linked wasm to boot"; exit 1; }

          rm -rf gate-serve && mkdir -p gate-serve
          cp play-gui/freecad-gui.html gate-serve/index.html
          cp play-gui/qtloader.js play-gui/sw.js play-gui/manifest.webmanifest gate-serve/
          cp play-gui/icon-192.png play-gui/icon-512.png gate-serve/ || true
          cp "$bin/FreeCAD.js" "$bin/FreeCAD.wasm" gate-serve/
          # Mirror what production serves: the shell asks for FreeCAD.data.gz, and the GL
          # patch table is applied to the served loader.
          gzip -1 -c "$bin/FreeCAD.data" > gate-serve/FreeCAD.data.gz
          python3 tools/patch-freecad-js.py gate-serve/FreeCAD.js
          # The payload has to contain the Python packages, not just the engine. A
          # build staged without them boots in 13 s, draws a box, passes every
          # header and stamping check -- and cannot run FEM, the Addon Manager or
          # Draft. One shipped on 2026-08-25 and was live for two days.
          python3 tools/check-payload-packages.py gate-serve/FreeCAD.js

          # The mesher and the solver are separate wasm modules, fetched by the shell at
          # the moment FEM needs them. Without them in the serve tree the fem scenario
          # cannot run, and a scenario that cannot run is not a gate -- so take them from
          # the working copy if a ccx/gmsh build left them there, and otherwise from
          # production, which is where the deployed shell gets them.
          for f in gmsh.js gmsh.wasm ccx.js ccx.wasm; do
            if [ -s "play-gui/$f" ]; then
              cp "play-gui/$f" gate-serve/
            else
              curl -fsS --retry 2 "https://freecad.virtastic.app/$f" -o "gate-serve/$f"                 || { echo "::error::no $f locally and none served by production -- the FEM gate cannot run"; exit 1; }
            fi
            echo "  $f: $(stat -c%s gate-serve/$f) bytes"
          done

          ver=$(grep -v '^#' patches/freecad.version | grep -v '^$' | head -1)
          echo "expecting App.Version() $ver"
          # Run the gate inside Playwright's own image rather than on the box. Chromium
          # needs a pile of system libraries (this failed on libatk-1.0.so.0), installing
          # them needs root, and this runner's sudo is deliberately scoped -- so the first
          # CI run of the gate died on a missing .so after two hours of compiling.
          #
          # The image already carries those libraries and the matching browsers, docker is
          # already on this box because the app itself runs in a container, and nothing has
          # to be installed on the host. The playwright pip version is pinned to the image
          # tag so the client and the bundled browser build always agree.
          #
          # Root inside the container is fine: the gate only reads the workspace, and its
          # browser profile goes to /tmp inside the container.
          # Cap the container's memory at three quarters of the box. On 2026-08-25 the
          # gate exhausted RAM, the OOM killer took the container AND the runner agent,
          # and the queue sat idle for the rest of the night with nothing to say. The
          # cause is fixed (the gate now holds one engine, not eleven), but a harness that
          # can kill the build machine should not be able to do it twice: with a cap the
          # container dies and the runner survives to report it.
          memgb=$(free -g | awk '/^Mem:/{print $2}')
          cap=$(( memgb * 3 / 4 )); [ "$cap" -ge 4 ] || cap=4
          echo "  box has ${memgb}G; giving the gate ${cap}G"
          docker run --rm --memory="${cap}g" --memory-swap="${cap}g" -v "$PWD:/w" -w /w -e HOME=/tmp mcr.microsoft.com/playwright/python:v1.62.0-noble sh -c "pip install --quiet --break-system-packages playwright==1.62.0 >/dev/null 2>&1 || pip install --quiet playwright==1.62.0; python3 -u tools/boot-gate.py gate-serve --port 8795 --timeout 900 --expect-version $ver --scenario all"

      # RENDERING, which has never been gated. Separate from the run above because it needs
      # the 3D pipeline, and that one deliberately runs ?no3d -- headless GL is not the GL a
      # user has, so a PASS here is not a statement about anyone's GPU.
      #
      # What it is worth: the viewport draws a shaded solid rather than nothing. Coin renders
      # into its own offscreen FBO, so the canvas reads black however well it is drawing --
      # that is why this was believed impossible for so long. ?pixelgate=1 reads the right
      # buffer. Measured on the artifact this was written against: 195 distinct colours,
      # 28.1% of the frame non-background.
      #
      # continue-on-error while it earns trust: it is a new measurement on a software
      # rasteriser, and a rendering gate that blocks a release on its first flake gets
      # deleted rather than fixed.
      - name: Does the 3D viewport actually draw anything?
        id: render
        timeout-minutes: 25
        continue-on-error: true
        run: |
          set -o pipefail
          set -e
          memgb=$(free -g | awk '/^Mem:/{print $2}')
          cap=$(( memgb * 3 / 4 )); [ "$cap" -ge 4 ] || cap=4
          docker run --rm --memory="${cap}g" --memory-swap="${cap}g" -v "$PWD:/w" -w /w -e HOME=/tmp mcr.microsoft.com/playwright/python:v1.62.0-noble sh -c "pip install --quiet --break-system-packages playwright==1.62.0 >/dev/null 2>&1 || pip install --quiet playwright==1.62.0; python3 -u tools/boot-gate.py gate-serve --port 8796 --timeout 900 --scenario render --with-3d --budget 900" 2>&1 | tee /tmp/fclogs/render.txt

      # THE GATES RUN AFTER "What came out", so their results could never appear in it.
      # This one runs last and appends what the gates actually measured.
      #
      # The rendering gate stays continue-on-error deliberately. As of 2026-08-26 it had
      # never completed a run in CI -- cancelled or skipped every time -- and separately it
      # was exiting non-zero after a successful measurement because the pass-line lookup
      # did not know its own scenario name. So it has no track record at all yet, and the
      # comment above it is right that a rendering gate which blocks a release on its first
      # flake gets deleted rather than fixed. Promote it once several consecutive runs pass.
      # Recording the numbers here is what makes "several consecutive runs" checkable.
      # DOES A REAL PROJECT REACH THE SCREEN?
      #
      # The rendering gate above reads Coin's OFFSCREEN framebuffer. That is a fair test of
      # "did Coin draw", and it is not a statement about what a user sees -- on 2026-08-27
      # production drew 739 distinct colours into that buffer while the canvas was 100%
      # black, and the gate passed. The composite from that buffer to the page canvas is a
      # separate step; it is the step that broke.
      #
      # This one opens a shipped example carrying PYTHON view providers (Assembly/Draft),
      # which is the path that crosses both the SWIG bridge and the compositor, and then
      # reads framebuffer 0 -- the canvas. Three separate faults on that path produced a
      # black viewport in one day with all thirteen ?no3d scenarios green.
      #
      # THE CANVAS GATE NOW BLOCKS.
      #
      # It went in advisory, as the render gate did, on the principle that a rendering
      # gate which fails on its first flake gets deleted rather than fixed. It has since
      # earned the promotion the hard way: it failed on the broken production build, it
      # failed again on 33086608999, and BOTH failures were real. On that second run a
      # Playwright screenshot taken beside it independently confirmed the verdict -- the
      # window is 102 KB of painted UI before a document opens and 4.9 KB of flat black
      # after.
      #
      # Advisory was actively harmful here: the run reported the step as `success`
      # because continue-on-error rewrites the conclusion, and only `outcome` carried the
      # truth. A gate whose failure is displayed as success is worse than no gate,
      # because it is trusted.
      - name: Does a real project actually reach the canvas?
        id: project3d
        timeout-minutes: 25
        run: |
          set -o pipefail
          set -e
          memgb=$(free -g | awk '/^Mem:/{print $2}')
          cap=$(( memgb * 3 / 4 )); [ "$cap" -ge 4 ] || cap=4
          docker run --rm --memory="${cap}g" --memory-swap="${cap}g" -v "$PWD:/w" -w /w -e HOME=/tmp mcr.microsoft.com/playwright/python:v1.62.0-noble sh -c "pip install --quiet --break-system-packages playwright==1.62.0 >/dev/null 2>&1 || pip install --quiet playwright==1.62.0; python3 -u tools/boot-gate.py gate-serve --port 8798 --timeout 900 --scenario project3d --with-3d --budget 900" 2>&1 | tee /tmp/fclogs/project3d.txt

      - name: What the gates measured
        if: always()
        run: |
          {
            echo
            echo "| gate | result | measured |"
            echo "|---|---|---|"
            echo "| boot (all scenarios) | ${{ steps.bootgate.outcome || 'n/a' }} | |"
            r="$(grep -m1 -oE 'render: [0-9]+ distinct colours, [0-9.]+% of the frame is not background'                   /tmp/fclogs/render.txt 2>/dev/null || true)"
            echo "| render (advisory) | ${{ steps.render.outcome }} | ${r:-not reached} |"
            p="$(grep -m1 -oE 'CANVAS [0-9]+x[0-9]+, [0-9]+ distinct colours, dominant [0-9,]+ at [0-9.]+%' \
                  /tmp/fclogs/project3d.txt 2>/dev/null || true)"
            echo "| project on canvas | ${{ steps.project3d.outcome }} | ${p:-not reached} |"
            echo
            echo "Baseline when the render gate was written: 195 distinct colours, 28.1% non-background."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the boot-gate serve tree on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-gate-shell
          path: |
            gate-serve/index.html
            gate-serve/FreeCAD.js
          if-no-files-found: ignore
          retention-days: 5

      # THE ARTIFACT UPLOAD IS GONE, deliberately.
      #
      # It uploaded ~110 MB to GitHub so that `gh run download` could fetch it back --
      # for a file that is already sitting on this machine, built by this job. The only
      # consumer was tools/publish-release.sh, and on 2026-08-26 that script learned to
      # read a local DIRECTORY instead. Which made the round trip pointless, and nobody
      # removed it.
      #
      # It was also actively harmful: this is a PRIVATE repo on a FREE org, so the
      # Actions artifact allowance is 500 MB. At ~110 MB a run it stayed over quota, and
      # once over, EVERY upload in the repo was refused -- including the boot-gate shell
      # and the build logs, which are small and genuinely useful when a gate fails.
      #
      # Releases are a different pool entirely and are not affected: 4.09 GB of release
      # assets publish fine while a 110 MB artifact upload is refused. Both deploy paths
      # (Jenkins for dev, deploy-ovh.yml for prod) consume the RELEASE, so nothing in the
      # pipeline ever needed this step.

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freecad-link-logs
          path: /tmp/fclogs
          if-no-files-found: ignore
          retention-days: 14

      # always(), not success(): a partial build tree is the most valuable thing this job
      # produces on a failing run, because the next round then starts from it.
      - name: Save the FreeCAD build and install trees
        if: always()
        run: |
          set -euo pipefail
          store="$BUILDTREE_STORE"
          mkdir -p "$store"
          for d in build-freecad-gui-weh freecad-gui-install weh-objs; do
            if [ -d "./$d" ]; then
              rm -rf "$store/$d"
              mv "./$d" "$store/$d"
              echo "  stored $d"
            fi
          done
          echo "  store: $(du -sh "$store" 2>/dev/null | cut -f1) at $store"
          df -h "$store" | tail -1

      # The save above writes a NEW ~421 MB entry every run and nothing ever removed one.
      # Twenty-four runs would be the entire 10 GB repo budget, at which point GitHub
      # starts evicting the caches that cost hours to rebuild rather than minutes.
      #
      # Housekeeping must never fail a two-hour job, hence continue-on-error. Two are kept,
      # not one: the newest may be from a run that failed before it had anything useful in
      # it, and the save step's own comment explains why a partial tree is worth keeping.
      - name: Reclaim the now-unused build-tree caches
        # Not on the run that seeded from them -- delete only once the
        # store is known good, or a failed first run leaves neither copy.
        if: always() && steps.store-probe.outputs.need_cache == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          before=$(gh cache list --limit 100 --json sizeInBytes                     --jq '[.[].sizeInBytes] | add // 0')
          ids=$(gh cache list --key fcweb-fclink- --limit 100                   --json id,createdAt --jq '.[].id')
          n=0
          for id in $ids; do
            gh cache delete "$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done
          after=$(gh cache list --limit 100 --json sizeInBytes                    --jq '[.[].sizeInBytes] | add // 0')
          echo "  deleted $n build-tree cache(s) -- the tree now lives on local disk"
          echo "  cache budget: $((before/1048576)) MB -> $((after/1048576)) MB of 10240 MB"
