name: build FreeCAD (wasm)

# THE MISSING GATE.
#
# The dependency stack, Qt and CalculiX all build in CI. FreeCAD itself never has -- so
# patches/freecad.patch has never been compiled by anything except the build machine, and
# the three force-included headers in toolchain/include/ have never been compiled at all.
# Everything downstream of them is assertion, not evidence.
#
# This job closes that. It COMPILES; it does not link. The final link needs PySide6,
# shiboken, pivy, IfcOpenShell, numpy and matplotlib -- none of which the deps cache
# carries -- and none of them change whether the port's C++ is correct. Compiling is what
# tests the patch and the headers:
#
#   * every #if defined(__EMSCRIPTEN__) branch the port adds is actually parsed
#   * gl_compat.h is force-included into every C and C++ unit, so a missing or wrong
#     declaration fails here rather than in an inscrutable link error later
#   * qprocess_stub.h has to satisfy every QProcess use in FreeCADGui, MeshGui and
#     MeshPartGui -- the three targets whose CMakeLists force-include it
#
# Failure output is the point of this workflow, so errors are collected and printed rather
# than left in a log to be dug out.

on:
  # workflow_dispatch alone is not enough: GitHub only offers a workflow for manual
  # dispatch once the file exists on the DEFAULT branch, and this one lives on the port
  # branch until the port is merged. A branch-scoped push trigger makes it runnable now.
  # Drop this trigger when the branch merges and dispatch takes over.
  #
  # Until then there is NO other way to start this lane: `gh workflow run` and
  # workflow_run both need the file on the default branch, and nothing chains it off
  # build-deps or build-qt-wasm. To (re)run it from dev, push a change to one of the
  # paths below. This lane compiles only; link-freecad.yml needs its build tree AND
  # build-python-deps.yml, and is started the same way.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-freecad.yml'
      - 'patches/freecad.patch'
      - 'patches/freecad.version'
      - 'patches/apply.sh'
      - 'toolchain/**'
      - 'tools/check-patch-applies.py'
      - 'tools/fetch-freecad-submodules.sh'
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build"
        type: choice
        options: [vps, hosted]
        default: vps
      targets:
        description: "ninja targets (blank = the default focused set)"
        type: string
        default: ""
      jobs:
        description: "parallel compile jobs (blank = nproc)"
        type: string
        default: ""

permissions:
  contents: read

env:
  DEPS_KEY: v2-wasm64-emsdk6.0.9-xerces3.2.5-occt7.8.1-vtk9.3.1-coin4.0.3-boost1.86
  # -mt-v2: the threaded rebuild. The v1 cache was single-threaded and had no
  # QtConcurrent in it at all -- see build-qt-wasm.yml.
  QT_KEY: fcweb-qt-6.11.2-wasm64-eh-jspi-mt-emsdk6.0.9-v1
  FREECAD_TAG: "1.1.3"

jobs:
  freecad:
    timeout-minutes: 360
    # Default to the VPS, and phrase it so a push event -- where `inputs` is empty --
    # still lands there. The other way round, run 32231308018 was handed
    # labels=[ubuntu-latest], never got a runner, and failed in four seconds with no
    # steps and no message.
    runs-on: ${{ inputs.runner == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","ovh","virtastic"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk (hosted runners are tight)
        if: ${{ inputs.runner == 'hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      # The tag this patch is rebased onto is recorded in one place. Read it rather than
      # repeating it, so the two cannot disagree.
      - name: Which FreeCAD are we building?
        id: ver
        run: |
          set -e
          want="$(grep -v '^#' patches/freecad.version | tr -d '[:space:]')"
          [ -n "$want" ] || { echo "::error::patches/freecad.version is empty"; exit 1; }
          echo "tag=$want" >> "$GITHUB_OUTPUT"
          echo "  building FreeCAD $want (from patches/freecad.version)"

      # Prefix match, deliberately. The full key in build-deps.yml hashes patches/**, which
      # includes freecad.patch -- and freecad.patch has nothing to do with what is inside
      # deps/wasm. Keying on it here would miss every existing entry the moment the port
      # changes, which is exactly when this job is most worth running. The contents are
      # asserted below instead of trusted.
      - name: Restore built dependencies
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/wasm
          key: fcweb-deps-${{ env.DEPS_KEY }}-freecad-build
          restore-keys: |
            fcweb-deps-${{ env.DEPS_KEY }}-

      - name: Restore Qt 6.11.2 for wasm
        id: qtcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: qt/6.11.2/wasm_mt_weh
          key: ${{ env.QT_KEY }}

      # Both caches are produced by other workflows. If either is missing, say which and
      # which workflow makes it, instead of failing 20 minutes later inside cmake.
      - name: Are the prerequisites actually here?
        run: |
          set -e
          fail=0
          need() {  # need <path> <what> <workflow>
            if [ -e "$1" ]; then
              echo "  ok       $2"
            else
              echo "::error::missing $2 ($1) -- run $3 first"
              fail=1
            fi
          }
          need deps/wasm/lib/libTKernel.a            "OCCT"                build-deps.yml
          need deps/wasm/lib/libCoin.a               "Coin3D"              build-deps.yml
          need deps/wasm/lib/libpython3.13.a         "CPython (wasm/mt)"   build-deps.yml
          need deps/wasm/include/python3.13/Python.h "CPython headers"     build-deps.yml
          need qt/6.11.2/wasm_mt_weh/lib/cmake/Qt6    "Qt 6.11.2 for wasm"   build-qt-wasm.yml
          echo "  Qt modules present:"
          ls -d qt/6.11.2/wasm_mt_weh/lib/cmake/Qt6*/ 2>/dev/null | sed 's|.*/cmake/||; s|/$||' | xargs echo | fold -sw 100 | sed 's/^/    /'
          if [ "$fail" != 0 ]; then
            echo
            echo "deps cache key hit: ${{ steps.depcache.outputs.cache-matched-key || '(none)' }}"
            echo "qt   cache key hit: ${{ steps.qtcache.outputs.cache-matched-key || '(none)' }}"
            echo "--- what deps/wasm does contain ---"
            ls deps/wasm/lib 2>/dev/null | head -40 || echo "  (no deps/wasm/lib)"
            echo "--- deps/wasm/include ---"
            ls deps/wasm/include 2>/dev/null | head -20 || echo "  (no deps/wasm/include)"
          fi
          exit $fail

      # FreeCAD does find_package(Python3 COMPONENTS Interpreter Development REQUIRED),
      # and CMake insists the two be CONSISTENT. The Development artifacts here are the
      # wasm CPython 3.13 from the deps cache, so the host interpreter must be 3.13 too --
      # the runner's own python3 (3.12 on ubuntu-24.04) would fail as "unsuitable version".
      - name: Host Python 3.13 (must match the wasm CPython)
        id: hostpy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Confirm the interpreter matches the headers
        run: |
          set -e
          py='${{ steps.hostpy.outputs.python-path }}'
          echo "  interpreter: $("$py" -V) at $py"
          hdr="$(grep -oE '"3\.[0-9]+' deps/wasm/include/python3.13/patchlevel.h | head -1 | tr -d '"')"
          echo "  headers:     ${hdr:-unknown}"
          got="$("$py" -c 'import sys;print("%d.%d"%sys.version_info[:2])')"
          if [ -n "$hdr" ] && [ "$hdr" != "$got" ]; then
            echo "::error::host interpreter $got does not match the wasm headers $hdr"
            exit 1
          fi

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: emsdk
          key: emsdk-6.0.9-wasm64-shims-v1

      - name: Install emsdk 6.0.9
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9

      # QT_HOST_PATH. The wasm Qt ships no host tools, but the build runs moc, uic and rcc,
      # and they must be native. Same aqtinstall route build-qt-wasm.yml uses.
      - name: Host Qt 6.11.2 (native tools only)
        id: hostqt
        run: |
          set -e
          if [ -d qt-host/6.11.2/gcc_64/bin ]; then
            echo "  host Qt already present"
          else
            python3 -m pip install --quiet --break-system-packages aqtinstall 2>/dev/null \
              || python3 -m pip install --quiet aqtinstall
            python3 -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 \
              -m qtshadertools -O "$PWD/qt-host"
          fi
          host="$PWD/qt-host/6.11.2/gcc_64"
          [ -x "$host/libexec/moc" ] || [ -x "$host/bin/moc" ] || {
            echo "::error::no moc under $host"; find qt-host -name moc | head; exit 1; }
          echo "path=$host" >> "$GITHUB_OUTPUT"
          echo "  QT_HOST_PATH=$host"

      # FreeCAD 1.1 added `find_package(ICU REQUIRED COMPONENTS uc i18n)` at the top of
      # CMakeLists.txt and links ICU into Base. 1.0 had no such dependency, so this is a
      # genuinely new third-party library the wasm stack has to supply. emscripten ships an
      # ICU port, so it costs a prebuild rather than another cross-compile -- the same route
      # build-deps.yml already uses for freetype.
      - name: Pre-build the emscripten ICU port (new hard dep in FreeCAD 1.1)
        id: icu
        run: |
          set -e
          . ./toolchain/env.sh
          embuilder build icu
          sysroot="$(em-config CACHE)/sysroot"
          echo "sysroot=$sysroot" >> "$GITHUB_OUTPUT"
          echo "  sysroot: $sysroot"
          echo "  libraries:"
          find "$sysroot" -name 'libicu*.a' | sed 's/^/    /'
          if [ ! -e "$sysroot/include/unicode/uversion.h" ]; then
            echo "::error::ICU port built but no unicode/ headers under $sysroot"
            exit 1
          fi

      - name: pybind11 (FreeCAD 1.1 build dependency)
        id: pybind
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages pybind11 2>/dev/null \
            || python3 -m pip install --quiet pybind11
          d="$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "  pybind11_DIR=$d"

      # SetupSwig.cmake makes SWIG a hard requirement whenever BUILD_SKETCHER is on, and
      # then runs `swig -python -external-runtime` to check its runtime version against
      # pivy's. It is a host tool, so it comes from PyPI rather than apt -- the runner has
      # no root, and this keeps the job self-contained.
      # Eigen is header-only and the dependency stack never built it -- deps/wasm/include
      # has no Eigen at all, which is why FindEigen3 reported "version .. found" with an
      # empty version and then refused. Fetch the headers; there is nothing to compile.
      - name: Eigen 3.4.0 headers
        id: eigen
        run: |
          set -e
          if [ ! -e deps/src/eigen/Eigen/Core ]; then
            mkdir -p deps/src/eigen
            curl -fsSL -o /tmp/eigen.tar.gz https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
            tar xzf /tmp/eigen.tar.gz -C deps/src/eigen --strip-components=1
          fi
          d="$PWD/deps/src/eigen"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          grep -hE '#define EIGEN_(WORLD|MAJOR|MINOR)_VERSION' "$d/Eigen/src/Core/util/Macros.h" | sed 's/^/  /'

      - name: SWIG (required by BUILD_SKETCHER)
        run: |
          set -e
          if command -v swig >/dev/null 2>&1; then
            echo "  system swig: $(swig -version | grep -i version | head -1)"
          else
            python3 -m pip install --quiet --break-system-packages swig 2>/dev/null || python3 -m pip install --quiet swig
          fi
          swig -version | grep -i version | head -1 | sed 's/^/  /'

      - name: Fetch FreeCAD ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          if [ -e deps/src/freecad/CMakeLists.txt ]; then
            echo "  freecad: present"
          else
            mkdir -p deps/src/freecad
            curl -fsSL -o /tmp/freecad.tar.gz \
              "https://github.com/FreeCAD/FreeCAD/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
            tar xzf /tmp/freecad.tar.gz -C deps/src/freecad --strip-components=1
          fi
          ls deps/src/freecad/CMakeLists.txt

      # Before patch(1) gets a chance to be lenient about it. GNU patch and the msys
      # patch(1) the port is generated with disagree on line endings, so "it applied on the
      # authoring machine" says nothing about here. This compares every context line to the
      # tree byte for byte and names the first mismatch, which is a far better failure than
      # 188 rejected hunks.
      # GitHub's source tarballs do not contain git submodules, and FreeCAD keeps four.
      # tools/fetch-freecad-submodules.sh says which and why; it runs BEFORE the byte-for-byte
      # check because patches/freecad.patch carries hunks for the AddonManager submodule,
      # and against the bare tarball those report "missing from tree" -- which is what
      # stopped the first wasm64 run of this lane before a single file compiled.
      - name: Submodules the tarball does not carry (GSL, OndselSolver, AddonManager)
        run: bash tools/fetch-freecad-submodules.sh

      - name: The patch matches this tree byte for byte
        run: python3 tools/check-patch-applies.py patches/freecad.patch deps/src/freecad

      # This is itself a test: apply.sh gates on patches/freecad.version and applies at zero
      # fuzz, so "the patch still applies to a pristine 1.1.3 tree" is proven on Linux here
      # and not only on the machine that generated it.
      - name: Apply the source patches
        run: |
          set -e
          FCWEB_PATCH_OPTIONAL=1 bash patches/apply.sh
          echo "--- spot-check that the wasm port is really in the tree ---"
          for f in src/Main/MainGui.cpp src/Gui/CMakeLists.txt src/Mod/Part/Gui/SoBrepFaceSet.cpp; do
            n=$(grep -c 'EMSCRIPTEN' "deps/src/freecad/$f" || true)
            echo "  $f: $n EMSCRIPTEN references"
            [ "$n" -gt 0 ] || { echo "::error::$f carries no wasm port"; exit 1; }
          done

      - name: Stage the force-included compat headers
        run: |
          set -e
          # FCWEB_FORCE_STAGE_HEADERS: stage-headers.sh normally refuses to overwrite a
          # header already in $DW/include, because on the build machine that copy is the
          # ORIGINAL and the tracked one is a reconstruction. In CI it is neither -- it is
          # whatever this workflow staged last run and then cached. Run 32230261006 lost a
          # whole Coin3D build to that: the cache restored the previous, enum-less
          # gl_compat.h, the stager dutifully kept it, and Coin failed on GL_ACCUM again
          # with the fix sitting unused in toolchain/include. Here the tracked copy IS the
          # authority.
          FCWEB_FORCE_STAGE_HEADERS=1 bash toolchain/stage-headers.sh

      - name: Configure
        id: configure
        run: |
          # GitHub runs bash -e: without +e a failed configure aborts before the
          # diagnostics below, which are the point of this job.
          set +e
          set -o pipefail
          . ./toolchain/env.sh
          ROOT="$PWD"; DW="$ROOT/deps/wasm"
          QT="$ROOT/qt/6.11.2/wasm_mt_weh"
          mkdir -p /tmp/fclogs

          # Modules are limited to the ones whose third-party libraries the deps cache
          # actually carries. The set kept is the set that exercises the port: Part and
          # PartGui (SoBrepFaceSet, ViewProviderExt -- the GL-heavy files), Sketcher (the
          # std::async change), Mesh/MeshPart (the two other qprocess_stub.h consumers),
          # PartDesign (ViewProviderDatum), and all of App + Gui.
          # BIM/CAM/Draft/FEM/TechDraw need IfcOpenShell, libarea, pivy, gmsh and freetype;
          # their absence says nothing about whether this port compiles.
          emcmake cmake -S deps/src/freecad -B build-freecad-weh -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PROJECT_INCLUDE_BEFORE="$ROOT/force-static.cmake" \
            -DFCWEB_DW="$DW" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DINSTALL_TO_SITEPACKAGES=OFF \
            -DFREECAD_USE_PYSIDE=OFF -DFREECAD_USE_SHIBOKEN=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Shiboken6=ON -DCMAKE_DISABLE_FIND_PACKAGE_PySide6=ON \
            -DBUILD_PART=ON -DBUILD_PART_DESIGN=ON -DBUILD_SKETCHER=ON \
            -DBUILD_MESH=ON -DBUILD_MESH_PART=ON -DBUILD_SMESH=ON \
            -DBUILD_MATERIAL=ON -DBUILD_POINTS=ON \
            -DBUILD_IMPORT=ON -DBUILD_MEASURE=ON \
            `# Everything the dependency cache can satisfy is now ON. None of these` \
            `# modules pulls an exotic find_package of its own; what kept them off was` \
            `# caution, not a missing library.` \
            -DBUILD_BIM=ON -DBUILD_DRAFT=ON -DBUILD_FEM=ON -DBUILD_SPREADSHEET=ON \
            -DBUILD_CAM=ON -DBUILD_TECHDRAW=ON -DBUILD_HELP=ON \
            -DBUILD_IDF=ON -DBUILD_INSPECTION=ON -DBUILD_OPENSCAD=ON -DBUILD_PLOT=ON \
            -DBUILD_REVERSEENGINEERING=ON -DBUILD_ROBOT=ON -DBUILD_SHOW=ON \
            -DBUILD_START=ON -DBUILD_SURFACE=ON -DBUILD_TUX=ON -DBUILD_WEB=ON \
            `# The two the source tarball genuinely cannot build: Assembly needs the` \
            `# OndselSolver submodule and AddonManager is itself a submodule, and` \
            `# GitHub tarballs carry no submodules.` \
            -DBUILD_ASSEMBLY=OFF -DBUILD_ADDONMGR=OFF \
            -DBUILD_TEST=OFF -DENABLE_DEVELOPER_TESTS=OFF \
            -DBUILD_FLAT_MESH=OFF \
            -DFREECAD_USE_FREETYPE=OFF \
            -DFREECAD_USE_PYBIND11=ON -Dpybind11_DIR="${{ steps.pybind.outputs.dir }}" \
            `# SetupCoin3D.cmake imports pivy in the HOST python to compare its Coin` \
            `# version against ours. FreeCAD guards that behind FREECAD_CHECK_PIVY,` \
            `# commented in-source as 'do not make pivy a host dependency for cross` \
            `# compiling' -- which is exactly this build.` \
            -DFREECAD_CHECK_PIVY=OFF \
            -DFREECAD_USE_EXTERNAL_PIVY=OFF -DFREECAD_USE_PCH=OFF \
            -DFREECAD_QT_VERSION=6 \
            -DVTK_DIR="$DW/lib/cmake/vtk-9.3" \
            -DOpenCASCADE_DIR="$DW/lib/cmake/opencascade" \
            -DEIGEN3_INCLUDE_DIR="${{ steps.eigen.outputs.dir }}" \
            -DCOIN3D_INCLUDE_DIRS="$DW/include" \
            -DCOIN3D_LIBRARIES="$DW/lib/libCoin.a" \
            -DCOIN3D_FOUND=ON \
            `# CMake own FindICU searches for libicuuc/libicui18n; the emscripten port` \
            `# builds libicu_common/libicu_i18n, so toolchain/cmake/FindICU.cmake takes` \
            `# over. FreeCAD only APPENDS to CMAKE_MODULE_PATH, so ours stays first.` \
            -DCMAKE_MODULE_PATH="$ROOT/toolchain/cmake" \
            -DICU_EM_SYSROOT="${{ steps.icu.outputs.sysroot }}" \
            -DBoost_USE_STATIC_LIBS=ON -DBoost_USE_STATIC_RUNTIME=ON \
            -DCMAKE_PREFIX_PATH="$DW;$QT" \
            -DCMAKE_FIND_ROOT_PATH="$DW;$QT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DQt6_DIR="$QT/lib/cmake/Qt6" \
            -DQT_HOST_PATH="${{ steps.hostqt.outputs.path }}" \
            -DPython3_EXECUTABLE="${{ steps.hostpy.outputs.python-path }}" \
            -DPython3_INCLUDE_DIR="$DW/include/python3.13" \
            -DPython3_LIBRARY="$DW/lib/libpython3.13.a" \
            -DPYTHON_VERSION_STRING=3.13 \
            -DCMAKE_CXX_FLAGS="-fwasm-exceptions -pthread -O1 -DBOOST_ALL_NO_LIB --use-port=zlib --use-port=icu -I$DW/include -include $DW/include/gl_compat.h -include $DW/include/coin_intrusive.h" \
            -DCMAKE_C_FLAGS="-fwasm-exceptions -pthread -O1 --use-port=zlib --use-port=icu -I$DW/include -include $DW/include/gl_compat.h -include $DW/include/coin_intrusive.h" \
            2>&1 | tee /tmp/fclogs/configure.txt
          # PIPESTATUS[0], not $?. $? here is tee's, which is always 0, so this guard read
          # correctly and could never fire. The same shape in the link lane reported a
          # failed link as success and handed on a stale binary that reached production.
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "::error::configure failed"
            echo "--- last 60 lines ---"
            tail -60 /tmp/fclogs/configure.txt
            echo "--- CMakeError.log ---"
            tail -60 build-freecad-weh/CMakeFiles/CMakeError.log 2>/dev/null || true
          fi
          exit $rc

      - name: Compile
        id: compile
        run: |
          set +e
          set -o pipefail
          . ./toolchain/env.sh
          n="${{ inputs.jobs }}"; [ -n "$n" ] || n="$(nproc)"
          t="${{ inputs.targets }}"
          if [ -z "$t" ]; then
            # FreeCADGui is the one that matters most: it force-includes BOTH headers and is
            # where the bulk of the port lives. MeshGui and MeshPartGui are the other two
            # qprocess_stub.h consumers. PartGui carries the GL-heavy files.
            t="FreeCADApp FreeCADGui Part PartGui Sketcher SketcherGui PartDesign PartDesignGui Mesh MeshGui MeshPart MeshPartGui Materials MatGui Points PointsGui Import ImportGui Measure MeasureGui Fem FemGui DraftUtils Spreadsheet SpreadsheetGui Start StartGui Surface SurfaceGui Inspection InspectionGui Robot RobotGui ReverseEngineering ReverseEngineeringGui TechDraw TechDrawGui Path PathGui PathSimulator CAMSimulator"
          fi
          echo "  targets: $t"
          echo "  jobs:    $n"
          # -k 0: keep going after a failure. The point of this job is the error LIST,
          # and stopping at the first one turns 1,699 targets into one defect per CI
          # round trip. ninja still reports every failure at the end.
          cmake --build build-freecad-weh -j "$n" --target $t -- -k 0 2>&1 | tee /tmp/fclogs/compile.txt
          rc=${PIPESTATUS[0]}
          echo "compile_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "  reached: $(grep -oE '\[[0-9]+/[0-9]+\]' /tmp/fclogs/compile.txt | tail -1)"
          echo "  failed targets: $(grep -c '^FAILED:' /tmp/fclogs/compile.txt || true)"
          exit $rc

      # The point of the workflow is the error list, so surface it rather than burying it.
      - name: What failed
        if: failure()
        run: |
          set +e
          echo "### FreeCAD wasm build: failures" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/fclogs/configure.txt /tmp/fclogs/compile.txt; do
            [ -s "$f" ] || continue
            echo "--- $f: distinct errors, most frequent first ---"
            grep -oE "error: .*" "$f" | sed 's/[0-9]\+/N/g' | sort | uniq -c | sort -rn | head -40
            {
              echo "<details><summary>$(basename $f)</summary>"
              echo
              echo '```'
              grep -E "error:|Error " "$f" | head -60
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # A missing declaration is the specific failure gl_compat.h exists to prevent, so
          # call it out by name instead of leaving it in a list of 200 errors.
          echo "--- undeclared identifiers (candidate gl_compat.h gaps) ---"
          grep -ohE "use of undeclared identifier '[^']+'" /tmp/fclogs/compile.txt 2>/dev/null \
            | sort | uniq -c | sort -rn | head -30
          exit 0

      - name: Report
        if: always()
        run: |
          {
            echo "### FreeCAD ${{ steps.ver.outputs.tag }} for wasm"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| deps cache | \`${{ steps.depcache.outputs.cache-matched-key || 'MISS' }}\` |"
            echo "| qt cache | \`${{ steps.qtcache.outputs.cache-matched-key || 'MISS' }}\` |"
            echo "| configure | ${{ steps.configure.outcome }} |"
            echo "| compile | ${{ steps.compile.outcome }} |"
            echo
            echo "Compile only -- the final link needs PySide6, pivy, IfcOpenShell, numpy and"
            echo "matplotlib, which this cache does not carry."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- object files produced ---"
          find build-freecad-weh -name '*.o' 2>/dev/null | wc -l
          echo "--- static libraries produced ---"
          find build-freecad-weh -name '*.a' 2>/dev/null | sed 's|.*/||' | sort | head -30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freecad-wasm-logs
          path: /tmp/fclogs
          if-no-files-found: ignore
          retention-days: 14
