name: probe — can the FreeCAD deps build in CI?

# I claimed a FreeCAD relink "needs the build machine" and could not happen in CI, citing 14
# dependency builds plus Qt 6.11 from source. I never tested it. That is the same claim I made
# about CalculiX, where it turned out to be false and the whole solver now builds here.
#
# This measures rather than argues. It builds real dependencies for wasm on a hosted runner
# and reports how long each takes. The point is a number: with per-dependency timings you can
# say whether the full stack fits a 6-hour job, needs splitting across cached jobs, or is
# genuinely out of reach. Without them, "infeasible" is just an assertion.
#
# WHAT THIS IS NOT. It does not reproduce production. 21 of 23 dependencies have no recorded
# version (see BUILD-WEH.md), so the versions below are plausible choices, not the ones
# production was built from. Feasibility is the question here; reproduction needs
# deps-versions.txt from the build machine first.
#
# Qt is deliberately absent. It is the expensive one and it cannot be substituted with a
# prebuilt: production needs -feature-wasm-exceptions -feature-wasm-jspi, and the official Qt
# wasm binaries ship with neither. Establish the cheap deps first; Qt is a separate question.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, ovh, virtastic]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disk before
        run: df -h / | sed 's/^/  /'

      # Same pin as build-ccx.yml and BUILD-WEH.md. A different emscripten produces objects
      # that may not link against the rest of the world.
      - name: Install emsdk 6.0.9
        run: |
          set -e
          t0=$SECONDS
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9
          . ./emsdk_env.sh && emcc --version | head -1
          echo "  emsdk install: $((SECONDS-t0))s"

      - name: Fetch dependency sources
        run: |
          set -e
          mkdir -p deps/src
          echo "--- xerces-c 3.2.5 ---"
          curl -fsSL -o /tmp/x.tar.gz https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.2.5.tar.gz
          mkdir -p deps/src/xercesc && tar xzf /tmp/x.tar.gz -C deps/src/xercesc --strip-components=1
          ls deps/src/xercesc/CMakeLists.txt >/dev/null && echo "  ok"
          echo "--- OCCT 7.8.1 ---"
          curl -fsSL -o /tmp/o.tar.gz https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_8_1.tar.gz
          mkdir -p deps/src/occt && tar xzf /tmp/o.tar.gz -C deps/src/occt --strip-components=1
          ls deps/src/occt/CMakeLists.txt >/dev/null && echo "  ok"

      # The cheap one first: small, self-contained, pure cmake. If this fails the approach is
      # wrong and the OCCT number would be meaningless anyway.
      - name: Build xerces-c for wasm
        id: xerces
        run: |
          set -e
          t0=$SECONDS
          bash build-xercesc-weh.sh
          echo "  === xerces-c: $((SECONDS-t0))s ==="
          echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"

      # The expensive one, and the one that decides whether the whole stack is viable: OCCT is
      # the largest C++ dependency FreeCAD has. continue-on-error so a failure here still
      # leaves the xerces datapoint and the log to diagnose from.
      - name: Build OCCT for wasm
        id: occt
        continue-on-error: true
        run: |
          set -e
          t0=$SECONDS
          bash configure-occt-weh.sh
          echo "  === OCCT configure+build: $((SECONDS-t0))s ==="
          echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"

      # Written to the STEP SUMMARY, not just stdout. `gh run view --log` returned nothing
      # for the first probe run, which left the timings unreadable after the fact -- the whole
      # point of the exercise. The summary survives independently of log retention.
      - name: What got built
        if: always()
        run: |
          {
            echo "## FreeCAD dependency build probe"
            echo
            echo "| step | result |"
            echo "|---|---|"
            echo "| xerces-c | ${{ steps.xerces.outputs.secs && format('{0}s', steps.xerces.outputs.secs) || 'FAILED' }} |"
            echo "| OCCT | ${{ steps.occt.outputs.secs && format('{0}s', steps.occt.outputs.secs) || 'FAILED' }} |"
            echo
            echo "### libraries in deps/wasm/lib"
            echo '```'
            ls -la deps/wasm/lib/ 2>/dev/null || echo "(nothing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "  --- deps/wasm/lib ---"
          ls -la deps/wasm/lib/ 2>/dev/null | sed 's/^/    /' || echo "    (nothing)"
          echo "  --- timings ---"
          echo "    xerces-c : ${{ steps.xerces.outputs.secs || 'failed' }}s"
          echo "    OCCT     : ${{ steps.occt.outputs.secs || 'failed' }}s"
          echo
          echo "  Extrapolate honestly: these two are a sample, not the whole stack, and none"
          echo "  of it is Qt. What they settle is whether a hosted runner can build this"
          echo "  world at all -- which was the part I asserted without checking."

      - name: Disk after
        if: always()
        run: df -h / | sed 's/^/  /'
