name: build ccx.wasm

# Build the CalculiX solver module in CI, on a hosted runner.
#
# This exists because "needs a relink" was being used to mean "needs the build machine", and
# for CalculiX that is simply not true. Relinking FreeCAD consumes 168 prebuilt .a/.o inputs
# -- the whole of OCCT, Coin, VTK, Qt, CPython -- and genuinely cannot happen here. ccx.wasm
# consumes FOUR small numerical libraries, none of which touch that stack:
#
#     libccx.a  libarpack.a  libspooles.a  libf2c.a
#
# All four are public tarballs. So the only thing standing between CI and a CalculiX build
# was that the build scripts expect sources at deps/src/* and nothing fetches them. This
# fetches them.
#
# The payoff is item 7 of ROADMAP.md: FCWEB_CCX_PTHREADS=1 builds ccx with real threads
# instead of bridge/ccx_threads.c's inline wrap, which is the "single-threaded CalculiX"
# limit users feel on large FEM jobs. That option is implemented but UNVERIFIED, and it
# cannot be verified without a build -- which is what this provides.
#
# Runs on the OVH box's self-hosted runner by default, with ubuntu-latest as the opt-out.
#
# That is a reversal of this file's original position ("never the production self-hosted
# runner"), and the reason is cost, not a change of mind about the risk. 45 dispatches of this
# job burned 413 hosted minutes in three days against a 2000-minute monthly allowance the org
# had already spent 1823 of. The box it lands on does serve another product's database -- so
# nothing here raises parallelism, and `ubuntu-latest` remains one dropdown away whenever a
# deploy or the live site matters more than the minutes.
on:
  # workflow_dispatch alone is not enough: GitHub only offers a workflow for manual dispatch
  # once the file exists on the DEFAULT branch, and this one lives on the port branch until
  # the port is merged -- so on dev nothing could start it, and ccx.wasm had never been
  # built by the wasm64 toolchain while every other module had. A branch-scoped push
  # trigger makes it runnable now, the way build-freecad.yml and link-freecad.yml are;
  # drop it when the branch merges and dispatch takes over. On a push event every input
  # is empty: pthreads reads as off (the verified path), and runs-on below must land on
  # the self-hosted box for an empty runner input, not on hosted minutes.
  push:
    branches: [dev]
    paths:
      - .github/workflows/build-ccx.yml
      - build-ccx-module-weh.sh
      - build-ccx-weh.sh
      - build-libf2c-weh.sh
      - build-arpack-weh.sh
      - build-spooles-weh.sh
      - patches/ccx-*.patch
      - bridge/**
      - scratchpad/ccxval/**
      - toolchain/**
  workflow_dispatch:
    inputs:
      pthreads:
        description: "Build CalculiX WITH pthreads (the unverified fast path)"
        type: boolean
        required: false
        default: false
      runner:
        description: "Where to build"
        type: choice
        default: vps
        options:
          - vps
          - ubuntu-latest

permissions:
  contents: read

jobs:
  build:
    # Hosted only when asked for by name. The old form defaulted to ubuntu-latest for any
    # value other than 'vps' -- including the EMPTY value a push event supplies -- and the
    # header above is explicit about what hosted minutes cost this org.
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted","ovh","virtastic"]') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disk before
        run: |
          echo "  building on $(hostname)"
          df -h / | sed 's/^/  /'
          nproc | sed 's/^/  cpus: /'

      # A hosted runner ships a native toolchain; the OVH box did not until it was provisioned
      # on 2026-08-18. Nothing below builds without one -- f2c is compiled from source with the
      # NATIVE compiler before it can translate a single Fortran file, so a missing cc fails
      # this job minutes in, inside a step whose log nobody reads until it is already red.
      # Name what is missing up front instead.
      #
      # `unzip` is in the list because of run 32158073040, the first dispatch to the box: it
      # got four steps in, fetched CalculiX fine, and died on `unzip: command not found` for
      # libf2c.zip. Every hosted image ships unzip, so nothing had ever needed to ask for it.
      # That is the whole failure mode this step exists to convert into one line.
      - name: Preflight -- is this machine able to build at all?
        run: |
          miss=""
          for t in make python3 patch curl tar unzip; do
            command -v "$t" >/dev/null 2>&1 || miss="$miss $t"
          done
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || miss="$miss cc/gcc"
          if [ -n "$miss" ]; then
            echo "::error::this runner cannot build:$miss"
            echo "On the OVH box, provision it once with:"
            echo "    sudo apt-get install -y build-essential cmake ninja-build"
            exit 1
          fi
          echo "  toolchain ok: $(cc --version | head -1)"

      # Pinned to match BUILD-WEH.md. 6.0.9 is the toolchain everything else here is built
      # with; a different emscripten would produce a module that may not agree with the
      # engine it has to interoperate with.
      - name: Install emsdk 6.0.9
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 6.0.9
          ./emsdk activate 6.0.9
          . ./emsdk_env.sh
          emcc --version | head -1

      # The build scripts read from deps/src/<name>/<versioned-dir>; those exact paths are
      # what they hardcode, so the layout here is not arbitrary.
      - name: Fetch sources
        run: |
          set -e
          mkdir -p deps/src/{ccx,spooles,f2c,arpack,lapack}

          echo "--- CalculiX 2.22 ---"
          # The tarball unpacks as ./CalculiX/ccx_2.22/src/ -- one level deeper than the
          # build scripts expect, which hardcode deps/src/ccx/ccx_2.22/src. Strip the
          # leading ./CalculiX components rather than moving directories afterwards. It is 2, not 1:
          # the archive entries begin "./", so that dot is itself a component.
          curl -fsSL -o /tmp/ccx.tar.bz2 http://www.dhondt.de/ccx_2.22.src.tar.bz2
          tar xjf /tmp/ccx.tar.bz2 -C deps/src/ccx --strip-components=2
          # 977 .f files; f77ify.py globs src/*.f and fails with FileNotFoundError on the
          # unexpanded pattern if this layout is wrong, which is how the second run failed.
          echo "  .f files: $(ls deps/src/ccx/ccx_2.22/src/*.f 2>/dev/null | wc -l)"
          ls deps/src/ccx/ccx_2.22/src/ccx_2.22.c >/dev/null

          echo "--- SPOOLES 2.2 ---"
          mkdir -p deps/src/spooles/SPOOLES.2.2
          curl -fsSL -o /tmp/spooles.tgz https://netlib.org/linalg/spooles/spooles.2.2.tgz
          tar xzf /tmp/spooles.tgz -C deps/src/spooles/SPOOLES.2.2

          echo "--- f2c (two separate trees: the runtime library, and the translator) ---"
          # libf2c is the runtime linked INTO the wasm build.
          curl -fsSL -o /tmp/libf2c.zip https://www.netlib.org/f2c/libf2c.zip
          mkdir -p deps/src/f2c/libf2c
          unzip -q -o /tmp/libf2c.zip -d deps/src/f2c/libf2c

          # The translator is a NATIVE host tool that turns CalculiX's Fortran into C.
          # build-ccx-weh.sh expects the built binary at deps/src/f2c/src/f2c and stops with
          # "missing f2c translator" without it -- which is exactly how the first run failed.
          # Note the URL: netlib serves src.tgz; the .tar.gz and mksrc.zip spellings both 404.
          curl -fsSL -o /tmp/f2csrc.tgz https://netlib.org/f2c/src.tgz
          mkdir -p deps/src/f2c
          tar xzf /tmp/f2csrc.tgz -C deps/src/f2c        # unpacks as src/
          ls deps/src/f2c/src/main.c >/dev/null

          echo "--- arpack-ng 3.9.1 (netlib arpack96 404s; see build-arpack-weh.sh) ---"
          curl -fsSL -o /tmp/arpack.tar.gz \
            https://github.com/opencollab/arpack-ng/archive/refs/tags/3.9.1.tar.gz
          tar xzf /tmp/arpack.tar.gz -C deps/src/arpack

          echo "--- reference LAPACK 3.12.0 (arpack-ng does not bundle BLAS/LAPACK) ---"
          curl -fsSL -o /tmp/lapack.tar.gz \
            https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.0.tar.gz
          tar xzf /tmp/lapack.tar.gz -C deps/src/lapack

          echo "--- resulting layout (must match what the build scripts hardcode) ---"
          for p in deps/src/ccx/ccx_2.22/src deps/src/spooles/SPOOLES.2.2 \
                   deps/src/f2c/libf2c deps/src/f2c/src/f2c \
                   deps/src/arpack/arpack-ng-3.9.1 deps/src/lapack/lapack-3.12.0; do
            [ -e "$p" ] && echo "  OK      $p" || echo "  MISSING $p"
          done

      # The repo carries source deltas that are NOT in the upstream tarballs. Skipping them
      # silently produces a SMALLER, less capable module: the first CI build came out 844 KB
      # short of production's compiled code, which is missing functionality, not a smaller
      # binary to be pleased about.
      #
      # ccx is deliberately not in patches/regen.sh's MAP (like VTK), so this one is applied
      # by hand rather than through patches/apply.sh.
      # Every patches/ccx-*.patch, not one named file. The named form meant adding a second
      # CalculiX patch required editing this workflow, which is the kind of coupling that
      # leaves a patch sitting in the tree unapplied.
      - name: Apply the CalculiX source patches
        run: |
          set -e
          cd deps/src/ccx/ccx_2.22
          n=0
          for pf in "$GITHUB_WORKSPACE"/patches/ccx-*.patch; do
            [ -e "$pf" ] || continue
            b=$(basename "$pf")
            if patch -p1 --dry-run --force --silent < "$pf" >/dev/null 2>&1; then
              patch -p1 --silent < "$pf"; echo "  applied $b"; n=$((n+1))
            elif patch -p1 -R --dry-run --force --silent < "$pf" >/dev/null 2>&1; then
              echo "  already applied $b"; n=$((n+1))
            else
              echo "::error::$b does not apply to this source"
              exit 1
            fi
          done
          [ "$n" -gt 0 ] || { echo "::error::no patches/ccx-*.patch found -- the glob or the path is wrong"; exit 1; }
          echo "  $n CalculiX patch(es) in effect"

      # Native, not wasm: this runs ON the runner to translate Fortran to C. f2c is 1990s C
      # and trips several modern-clang/gcc defaults, hence the demotions -- the same reason
      # build-spooles-weh.sh carries a -Wno- list for SPOOLES.
      - name: Build the f2c translator (host tool)
        run: |
          set -e
          cd deps/src/f2c/src
          cp makefile.u makefile
          make CC=gcc CFLAGS="-O2 -std=gnu89 -w -Wno-implicit-function-declaration -Wno-return-type" f2c
          ls -la f2c
          ./f2c -h 2>&1 | head -3 || true

      - name: Build the dependency libs
        run: |
          set -e
          . ./toolchain/env.sh
          bash build-libf2c-weh.sh
          bash build-spooles-weh.sh
          bash build-arpack-weh.sh
          ls -la deps/wasm/lib/ | sed 's/^/  /'

      - name: Build libccx.a
        env:
          FCWEB_CCX_PTHREADS: ${{ inputs.pthreads && '1' || '0' }}
        run: |
          set -e
          . ./toolchain/env.sh
          echo "FCWEB_CCX_PTHREADS=$FCWEB_CCX_PTHREADS"
          bash build-ccx-weh.sh

      # The actionable half of the size gap. Routines f2c cannot translate are STUBBED --
      # they compile and link, and then do nothing at run time. That is why a build can
      # report "failed: 0" and still be missing functionality, and it is what makes the CI
      # module smaller than production's. This prints exactly which ones, so the gap is a
      # work list rather than a mystery.
      - name: Which routines got stubbed
        run: |
          set -e
          f=build-ccx-weh/UNCONVERTED.txt
          if [ ! -s "$f" ]; then echo "  (none — every routine translated)"; exit 0; fi
          echo "  total entries: $(wc -l < $f)"
          echo
          echo "  --- untranslated (stubbed, i.e. silently do nothing) ---"
          grep -vE '^(STUB-FAIL|CC-FAIL)' "$f" | sed 's|.*/||' | sort | sed 's/^/    /'
          echo
          echo "  --- f2c could not even stub these ---"
          grep -E '^STUB-FAIL' "$f" | sed 's/^/    /' || echo "    (none)"
          echo
          echo "  --- failed to compile ---"
          grep -E '^CC-FAIL' "$f" | sed 's/^/    /' || echo "    (none)"

      # The error says "line 221" and I spent a long time reading line 221 of a LOCALLY
      # generated file, guessing whether it matched what CI fed f2c. It is the rewritten
      # file that f2c numbers, so print the offending lines from that file directly. Cheap,
      # and it removes the guess entirely.
      - name: Show the exact lines f2c rejected
        if: always()
        run: |
          set -e
          shopt -s nullglob
          for log in build-ccx-weh/f2c-*.log; do
            f=$(basename "$log" .log); f=${f#f2c-}
            src="build-ccx-weh/f77/$f"
            [ -e "$src" ] || continue
            grep -E '^Error' "$log" 2>/dev/null | head -4 | while read -r line; do
              n=$(echo "$line" | sed -nE 's/^Error on line ([0-9]+) of.*/\1/p')
              echo "  $f: $line"
              [ -n "$n" ] || continue
              awk -v n="$n" 'NR>=n-2 && NR<=n+1 {printf "      %5d| %s\n", NR, $0}' "$src"
              echo
            done
          done

      # WHY each routine fails, which is the thing that makes f77ify.py extendable. Without
      # this the gap is a list of names; with it, it is a list of unsupported constructs.
      - name: Why f2c rejected them
        run: |
          set -e
          n=$(ls build-ccx-weh/f2c-*.log 2>/dev/null | wc -l)
          echo "  logs kept: $n"
          [ "$n" -gt 0 ] || exit 0
          echo
          echo "  --- error kinds, most common first ---"
          cat build-ccx-weh/f2c-*.log 2>/dev/null             | grep -E '^(Error|Warning)'             | sed -E 's/line [0-9]+/line N/g; s/"[^"]*"/"X"/g; s/[0-9]+/N/g'             | sort | uniq -c | sort -rn | head -25 | sed 's/^/    /'
          echo
          echo "  --- a worked example: the 3D element stiffness routine ---"
          cat build-ccx-weh/f2c-e_c3d.f.log 2>/dev/null | head -12 | sed 's/^/    /' || echo "    (no log)"

      - name: Link ccx.wasm
        env:
          FCWEB_CCX_PTHREADS: ${{ inputs.pthreads && '1' || '0' }}
        run: |
          set -e
          . ./toolchain/env.sh
          # Must match how libccx.a was built: the serial build needs the --wrap flags, the
          # threaded one must NOT have them or wasm-ld segfaults instead of erroring.
          bash build-ccx-module-weh.sh
          ls -la play-gui/ccx.js play-gui/ccx.wasm | sed 's/^/  /'

      # Compare against what is live. A module that differs wildly in size, or not at all,
      # is worth noticing before anyone releases it.
      - name: Compare with the deployed module
        run: |
          set -e
          url=$(curl -sS https://freecad.virtastic.app/ | grep -oE 'ccx\.js\?v=[a-z0-9]+' | head -1)
          curl -fsS "https://freecad.virtastic.app/ccx.wasm" -o /tmp/live-ccx.wasm || true
          echo "  built : $(stat -c%s play-gui/ccx.wasm) bytes"
          [ -s /tmp/live-ccx.wasm ] && echo "  live  : $(stat -c%s /tmp/live-ccx.wasm) bytes"
          echo "  built md5: $(md5sum play-gui/ccx.wasm | cut -d' ' -f1)"
          [ -s /tmp/live-ccx.wasm ] && echo "  live  md5: $(md5sum /tmp/live-ccx.wasm | cut -d' ' -f1)"

      # THE GATE. Everything above only proves the module compiles and links. A stubbed
      # routine also compiles and links -- that is the entire defect this workflow exists to
      # expose -- so size and md5 cannot tell a working solver from a hollow one.
      #
      # scratchpad/ccxval/ holds four decks (elastic, modal, plastic, thermal) chosen to
      # exercise different solver paths. Each is run through the module just built AND
      # through the one production is serving, and the printed result extremes must MATCH.
      # Not "converge", not "look reasonable" -- match. A bounded array that is subtly wrong,
      # or a routine still stubbed, shows up here as a different number and nowhere else.
      #
      # BLOCKING, as of run 31992713435, where all four decks first agreed with production
      # digit for digit -- including the 1e-13 and 1e-14 round-off noise, which is what makes
      # this a reproduction rather than a resemblance. From that point on, any difference is
      # a regression in the build and not a known gap, so it fails the run.
      #
      # It has already caught two defects that were invisible to compilation: a routine the
      # stress path needs left stubbed, and an 80-line scan window that silently rewrote
      # ARPACK's dummy-argument array shapes. Both builds were green on every other check.
      - name: Validate the decks against production's module
        if: always()
        run: |
          set -e
          command -v node >/dev/null || { echo "  no node on the runner — skipping"; exit 0; }
          ls play-gui/ccx.js play-gui/ccx.wasm >/dev/null 2>&1 || { echo "  no module built"; exit 0; }
          mkdir -p /tmp/ccxval && cp play-gui/ccx.js play-gui/ccx.wasm /tmp/ccxval/

          run_decks() {                       # $1 = label
            for d in scratchpad/ccxval/*.inp; do
              j=$(basename "$d" .inp)
              echo "### $j"
              timeout 600 node scratchpad/ccxval/run.js "$d" > "/tmp/raw-$1-$j.txt" 2>&1 || true
              if grep -qE '^rc=' "/tmp/raw-$1-$j.txt"; then
                grep -E '^(rc=|[A-Z0-9]+: )' "/tmp/raw-$1-$j.txt"
              else
                # A deck that produces nothing is the interesting case, and the previous
                # version of this step filtered the reason out -- it kept only rc= and field
                # lines, so a module that aborted looked identical to one that ran and said
                # nothing. Keep the tail; it names the routine that died.
                echo "  NO RESULT:"
                tail -12 "/tmp/raw-$1-$j.txt" | sed 's/^/    | /'
              fi
            done > "/tmp/val-$1.txt" 2>&1
            echo "  --- $1 ---"; sed 's/^/    /' "/tmp/val-$1.txt"
          }

          run_decks built

          echo
          echo "  fetching production's module for comparison"
          if curl -fsS https://freecad.virtastic.app/ccx.wasm -o /tmp/live-ccx.wasm \
             && curl -fsS "https://freecad.virtastic.app/$(curl -sS https://freecad.virtastic.app/ \
                  | grep -oE 'ccx\.js\?v=[a-z0-9]+' | head -1)" -o /tmp/live-ccx.js; then
            cp /tmp/live-ccx.js play-gui/ccx.js
            cp /tmp/live-ccx.wasm play-gui/ccx.wasm
            run_decks live
            cp /tmp/ccxval/ccx.js /tmp/ccxval/ccx.wasm play-gui/     # restore the build
          else
            echo "  could not fetch production's module — comparison skipped"
            exit 0
          fi

          echo
          echo "  === built vs live, per deck ==="
          # Per-deck rather than one diff of the whole file, because "different" is not one
          # outcome. A deck production cannot run but this build CAN is an improvement, and
          # failing the build for it would punish exactly the work this workflow exists to
          # do. Only the reverse -- and a genuine numeric disagreement -- is a regression.
          # KNOWN GAPS: decks that document a real difference from production which this
          # build has NOT closed. They report in full but do not fail the run, because they
          # are not regressions -- the path was entirely stubbed before, so there is no
          # working state to regress from -- and a permanently red gate would destroy its
          # value for the decks that genuinely do guard against regression.
          #
          #   contact  mortar (face-to-face) contact. slavintmortar/slavintpoints CAN be
          #            bounded, and when they are this deck converges to a PHYSICALLY INVALID
          #            answer: contact pressure -93.2 (contact cannot pull), +4.07e-3 upward
          #            displacement where production has exactly 0, asymmetric response on a
          #            symmetric model, error estimate 68.5 vs 11.2. So they are deliberately
          #            left stubbed in tools/f77ify.py (SKIP_FILES) and this deck aborts --
          #            loudly and honestly -- instead of returning wrong stresses.
          #            Remove from SKIP_FILES and from here together, once it matches.
          KNOWN_GAP=" contact "

          fail=0
          for d in scratchpad/ccxval/*.inp; do
            j=$(basename "$d" .inp)
            b="/tmp/raw-built-$j.txt"; l="/tmp/raw-live-$j.txt"
            bok=$(grep -qE '^rc=' "$b" && echo 1 || echo 0)
            lok=$(grep -qE '^rc=' "$l" && echo 1 || echo 0)
            bn=$(grep -E '^(rc=|[A-Z0-9]+: )' "$b" 2>/dev/null || true)
            ln=$(grep -E '^(rc=|[A-Z0-9]+: )' "$l" 2>/dev/null || true)
            if [ "$bok" = 1 ] && [ "$lok" = 1 ]; then
              if [ "$bn" = "$ln" ]; then
                echo "    $j: OK — identical to production"
              else
                echo "::error::$j disagrees with production numerically"
                diff <(echo "$ln") <(echo "$bn") | sed 's/^/      /'
                fail=1
              fi
            elif [ "$bok" = 1 ] && [ "$lok" = 0 ]; then
              echo "    $j: IMPROVEMENT — this build runs a deck production cannot"
            elif [ "$bok" = 0 ] && [ "$lok" = 1 ]; then
              case "$KNOWN_GAP" in
                *" $j "*) echo "    $j: KNOWN GAP — production runs it, this build does not"
                          echo "      (documented in the workflow; not counted as a regression)"
                          tail -14 "$b" | sed 's/^/      | /'
                          continue ;;
              esac
              echo "::error::$j regressed — production runs it, this build does not"
              # Wide, because the interesting line is rarely the last one. A guard from
              # tools/f77ify.py firing ('*ERROR: <dim> above the wasm build bound') appears
              # near the TOP of the run, and tail -8 hid it.
              echo "      --- built (first 30) ---"; head -30 "$b" | sed 's/^/      | /'
              echo "      --- built (last 30) ---";  tail -30 "$b" | sed 's/^/      | /'
              echo "      --- guards that fired ---"
              grep -n 'above the wasm build bound' "$b" | sed 's/^/      | /' || echo "      | (none)"
              fail=1
            else
              echo "    $j: neither build runs it (both stubbed) — not a regression"
              grep -m1 'is not available' "$b" | sed 's/^/      | /' || true
            fi
          done
          # WHERE they first diverge, not just that they do. CalculiX prints per-increment and
          # per-iteration residuals, so the first differing line of raw stdout localises the
          # divergence to an increment -- which is the thing you need before you can reason
          # about a contact defect at all. Result extremes alone cannot tell you that.
          echo
          echo "  === first divergence in raw solver output ==="
          for d in scratchpad/ccxval/*.inp; do
            j=$(basename "$d" .inp)
            b="/tmp/raw-built-$j.txt"; l="/tmp/raw-live-$j.txt"
            [ -s "$b" ] && [ -s "$l" ] || continue
            if cmp -s "$b" "$l"; then echo "    $j: identical stdout"; continue; fi
            n=$(diff --unchanged-line-format='' --old-line-format='' \
                     --new-line-format='%dn\n' "$l" "$b" 2>/dev/null | head -1)
            echo "    $j: first differing line ~$n"
            diff -u "$l" "$b" 2>/dev/null | head -40 | sed 's/^/      /'
          done

          [ "$fail" = 0 ] || exit 1
          echo "  no deck regressed against production"

      - name: Disk after
        if: always()
        run: df -h / | sed 's/^/  /'

      # The decks are the thing that decides whether a threaded build is trustworthy: results
      # must MATCH, not merely converge, because a race in the assembly is a slightly
      # different answer rather than a crash.
      - name: Upload the module for deck validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccx-wasm-${{ inputs.pthreads && 'pthreads' || 'serial' }}
          path: |
            play-gui/ccx.js
            play-gui/ccx.wasm
            build-ccx-weh/UNCONVERTED.txt
            build-ccx-weh/f2c-*.log
            build-ccx-weh/f77-stubbed/*.f
          if-no-files-found: warn
          retention-days: 7
