name: ci

# The first automated verification this repo has ever had.
#
# tools/patch-freecad-js.py is the highest-integrity component in the tree: ~30 hand-derived
# patches to emscripten's generated GL glue, which EVERY relink silently drops, and without
# which the 3D view never comes up and newDocument() never returns. It ships with a selftest
# whose fixture is built from the patch table itself (so it cannot go stale) and a --check
# mode that verifies invariants rather than per-patch status -- because a memory-growth build
# once made nine patches report "already applied" while the file still threw from all nine.
#
# None of it ran automatically. This is an hour of work for the best correctness-per-effort
# ratio available here.
#
# SAFETY: these jobs run on the Virtastic OVH runner -- the same box that hosts every production
# container -- and this workflow triggers on pull_request. Once this repo is public, that pairing
# means anyone can open a PR and have their code execute on our own hardware. The `if` on every
# job therefore refuses pull requests that come from a fork; PRs from branches inside this repo
# (people who already have write access) still get full CI, and pushes to main always run. Same
# guard jk2-web and jka-web already carry.
on:
  push:
    # dev as well as main. Development happens on dev, and a hygiene gate that only runs
    # on the default branch reports on work that was merged rather than work being done --
    # which is the wrong end. These checks are seconds, not minutes.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-tool:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: patch-freecad-js selftest
        run: python3 tools/patch-freecad-js.py --selftest

      # Proves the patches are present in what production is actually serving. This is the
      # exact regression a relink causes, and it is invisible until the 3D view fails to come up.
      - name: Verify the deployed FreeCAD.js still carries the GL patches
        run: |
          set -e
          url=$(curl -sS https://freecad.virtastic.app/ | grep -oE 'FreeCAD\.js\?v=[a-z0-9]+' | head -1)
          echo "deployed loader: $url"
          curl -fsS "https://freecad.virtastic.app/$url" -o /tmp/FreeCAD.js
          ls -la /tmp/FreeCAD.js
          # The path is argv[1]; --check must follow it (and stops the tool writing back).
          # Verified against the live loader: every patch reports "already applied", exit 0.
          python3 tools/patch-freecad-js.py /tmp/FreeCAD.js --check

  # The C shims that get LINKED INTO the app -- gl_legacy_stubs.c above all, which supplies
  # every fixed-function GL entry point Coin calls that LEGACY_GL_EMULATION lacks -- have
  # never been compiled by CI. They are only ever built during a full FreeCAD link on the
  # build machine, so a typo in them is invisible here and costs an hour there.
  #
  # emcc -fsyntax-only is seconds once emsdk is cached, and it checks the thing that actually
  # bites: whether the entry points these files forward to exist with the signatures used.
  shims:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: emsdk
          key: emsdk-6.0.9-wasm64-shims-v1

      - name: Install emsdk 6.0.9
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9

      - name: Compile the linked C shims
        run: |
          set -e
          . ./toolchain/env.sh
          fail=0
          for f in gl_legacy_stubs.c bridge/ccx_stubs.c bridge/ccx_threads.c \
                   bridge/ccx_fortran_rt.c fcweb_export_stub.c postevent_wrap.c; do
            [ -e "$f" ] || { echo "::error::$f is gone -- the link command still names it"; fail=1; continue; }
            if emcc -fsyntax-only -pthread "$f" 2>/tmp/err.txt; then
              echo "  ok  $f"
            else
              echo "::error::$f does not compile"
              sed 's/^/      /' /tmp/err.txt
              fail=1
            fi
          done
          exit $fail

      # gl_compat.h is GENERATED from gl_legacy_stubs.c: one declaration per entry point
      # the stub file defines. Regenerating here and diffing catches the case where someone
      # adds, removes or re-signs a stub and hand-edits the header (or forgets to).
      - name: gl_compat.h is in sync with gl_legacy_stubs.c
        run: |
          set -e
          python3 tools/gen-gl-compat.py > /tmp/gl_compat.regen.h
          # --strip-trailing-cr: the header is checked out CRLF on Windows (autocrlf),
          # while the generator writes whatever the platform gives it. Only content
          # drift should fail this.
          if diff -u --strip-trailing-cr toolchain/include/gl_compat.h /tmp/gl_compat.regen.h; then
            echo "  ok  gl_compat.h matches the generator"
          else
            echo "::error::toolchain/include/gl_compat.h is stale. Regenerate it:"
            echo "::error::  python tools/gen-gl-compat.py > toolchain/include/gl_compat.h"
            exit 1
          fi

      # The decisive check on the reconstruction. gl_compat.h DECLARES exactly what
      # gl_legacy_stubs.c DEFINES, so compiling the stub file with the header force-included
      # makes the compiler compare all 58 signatures for us: any disagreement in return type
      # or parameter list is a hard error here rather than a mystery in the FreeCAD build.
      #
      # Note the real build compiles gl_legacy_stubs.c WITHOUT this header, deliberately --
      # see the comment at the top of that file. This is a validation compile, not the build.
      - name: gl_compat.h agrees with every stub signature
        run: |
          set -e
          . ./toolchain/env.sh
          if emcc -fsyntax-only -pthread -include toolchain/include/gl_compat.h                   gl_legacy_stubs.c 2>/tmp/glc.txt; then
            n=$(grep -cE '^[A-Za-z].*\);$' toolchain/include/gl_compat.h)
            echo "  ok  $n declarations agree with their definitions"
          else
            echo "::error::gl_compat.h disagrees with gl_legacy_stubs.c"
            sed 's/^/      /' /tmp/glc.txt
            exit 1
          fi

      # A WRONG constant is worse than a missing one: it compiles and then misbehaves at
      # run time. gl_compat.h carries 236 legacy GL enum values, and for every one that a
      # real GL header also defines, this asserts the two agree -- at preprocess time, so
      # a disagreement is an error and not a silent difference.
      #
      # Compiled WITHOUT the force-include, deliberately: the system headers have to be the
      # authority here, and the generated unit embeds the table's values as literals.
      - name: gl_compat.h constants match the system GL headers
        run: |
          set +e
          . ./toolchain/env.sh
          python3 tools/gen-gl-compat.py --check > /tmp/gl_compat_check.c
          n=$(grep -c '^#error' /tmp/gl_compat_check.c)
          if emcc -fsyntax-only -pthread /tmp/gl_compat_check.c 2>/tmp/gce.txt; then
            echo "  ok  $n constants checked against the system headers, no disagreement"
            exit 0
          fi
          echo "::error::gl_compat.h disagrees with a system GL header on a constant value"
          grep -E "error" /tmp/gce.txt | head -20
          exit 1

      # gl_compat.h is force-included into every C and C++ unit, and Coin3D's sources
      # include <GL/gl.h> -- emscripten's own legacy header, which declares part of the
      # same API. If the two disagree on any signature, every Coin translation unit fails,
      # and that would only ever have surfaced deep in the FreeCAD build. Check it here
      # against both GL headers and in both languages, since the force-include applies to
      # C and C++ alike.
      - name: gl_compat.h coexists with the emscripten GL headers
        run: |
          set +e
          . ./toolchain/env.sh
          fail=0
          for lang in c c++; do
            for hdr in GL/gl.h GLES2/gl2.h GLES3/gl3.h; do
              { echo "#include <$hdr>"; echo "int main(void){return 0;}"; } > /tmp/t.$lang
              if emcc -fsyntax-only -x $lang -pthread                       -include toolchain/include/gl_compat.h /tmp/t.$lang 2>/tmp/e.txt; then
                echo "  ok       $lang + <$hdr>"
              else
                echo "::error::gl_compat.h conflicts with <$hdr> in $lang"
                sed 's/^/      /' /tmp/e.txt | head -20
                fail=1
              fi
            done
          done
          exit $fail

      # qprocess_stub.h needs Qt headers, which this job does not have, so the most that can
      # be checked here is that it is self-consistent C++ and that the design contract still
      # holds: no Q_OBJECT (it cannot be moc'd), and therefore no signals for anything to
      # connect to. patches/freecad.patch depends on both.
      - name: qprocess_stub.h keeps its no-moc contract
        run: |
          set -e
          h=toolchain/include/qprocess_stub.h
          fail=0
          if grep -qE '^\s*Q_OBJECT' "$h"; then
            echo "::error::$h declares Q_OBJECT -- a force-included header cannot be moc'd"
            fail=1
          fi
          if grep -qE '^\s*(signals|Q_SIGNALS)\s*:' "$h"; then
            echo "::error::$h declares signals -- without moc they cannot be connected"
            fail=1
          fi
          grep -q 'class QProcess: public QObject' "$h" || {
            echo "::error::$h must still derive from QObject -- kill() is used as a slot"
            fail=1
          }
          if [ "$fail" = 0 ]; then
            echo "  ok  no Q_OBJECT, no signals, still a QObject"
          fi
          exit $fail

      # gl_legacy_stubs.c exists to DEFINE the symbols the emulation lacks. An entry point
      # with an empty body is not 'unimplemented' at run time -- it is a draw, a state change
      # or a query silently discarded. So the count is worth watching, and it should only ever
      # fall. The tool classifies EMPTY / CONSTANT / FORWARDING and names them, because a bare
      # number hides which ones and because glRenderMode returning 0 is deliberate, not a gap.
      - name: Inventory the GL no-ops
        run: |
          python3 tools/gl-noop-inventory.py | tee /tmp/glinv.txt
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error::the GL no-op inventory failed (exit $rc)"; exit "$rc"; }
          {
            echo '### gl_legacy_stubs.c'
            echo '```'
            head -4 /tmp/glinv.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The publication gate, as a test. Each of these was a real finding, and each would
      # silently come back the next time someone regenerates a build file.
      # PyYAML keeps the last of a duplicated key and says nothing; GitHub refuses the
      # workflow, and the only symptom is a run that fails in under a second with no log
      # and no jobs -- "log not found", which reads like an API fault, not a syntax error.
      - name: Workflow files have no duplicate keys
        run: python3 tools/check-workflows.py

      # A backslash-n that reaches a run block as two characters is not a newline: bash
      # drops the backslash and passes a bare `n` as an argument. The first CI run of the
      # boot gate died that way AFTER two hours of compiling, and the same mangling was
      # sitting unnoticed in three older conditions -- one of which made the host shiboken
      # skip-check always false, so it rebuilt LLVM-linked shiboken on every single run.
      - name: Workflow run blocks have no mangled escapes
        run: python3 tools/check-run-block-escapes.py

      # `cmd | tee log` exits with tee's status, and tee always succeeds. A link that died
      # on `undefined symbol: PyInit_QtSvg` was recorded as "Link: success", handed on the
      # PREVIOUS bin/FreeCAD.{js,wasm,data}, and that artifact was released and served to
      # users for two days with no numpy, matplotlib, PIL or ifcopenshell. It booted in
      # 13 s the whole time. Four more of the same shape were still in the tree when this
      # check was written, including one that read `rc=$?` right after the pipe -- a guard
      # that looks correct and can never fire.
      - name: Build pipelines cannot report success after failing
        run: python3 tools/check-pipeline-status.py

      # emcc takes the LAST of a repeated -s setting and says nothing about the earlier
      # one, so a link line that states a setting twice runs on whichever copy is last.
      # This has now happened twice. ALLOW_MEMORY_GROWTH was passed =1 then =0, and the
      # linked JS came out full of GROWABLE_HEAP_F32() accessors -- the growth-on form,
      # which invalidates every hand-derived offset in tools/patch-freecad-js.py.
      # STACK_SIZE was passed 32MB by configure-gui-weh.sh and then 5MB by upstream
      # FreeCAD's own cmake target options, so the deliberate 32MB never once took
      # effect and production has always run a 5 MB main stack. Neither was visible in
      # the build output; both were found by reading the recorded command by hand.
      - name: Link settings are consistent (no conflicting dupes, heap ceiling agrees)
        run: python3 tools/check-link-settings.py

      # toolchain/env.sh is the single place that pins the SDK and sets EMCC_CFLAGS=-m64,
      # which is what makes this a wasm64 build. emcc appends EMCC_CFLAGS to every
      # invocation INCLUDING the probe compiles autotools and meson run during configure, so
      # a script that sources emsdk/emsdk_env.sh directly gets a working emcc that quietly
      # targets wasm32. When the wasm64 conversion started, fifteen scripts did exactly that
      # -- the whole CalculiX/gmsh solver stack and most of the Python extension stack --
      # plus the shipped link command itself, which called em++ by absolute path. Every one
      # would have produced a wasm32 artifact whose size and symbol counts look healthy.
      - name: Every emscripten-invoking script uses the pinned toolchain
        run: python3 tools/check-toolchain-env.py

      # A shell line continuation cannot span a comment: the command ends at the comment
      # and the next line is run as a command of its own. `bash -n` passes -- the text is
      # valid, it just means something else -- so this went unnoticed until a VTK configure
      # died with "-DCMAKE_CXX_FLAGS: command not found" and exit 127. The same check then
      # found two more, in the ccx and gmsh link commands, where the heap-ceiling flag was
      # being silently dropped from the link.
      - name: No comments inside shell line continuations
        run: python3 tools/check-line-continuations.py

      # A patch that nothing applies is not a fix, however carefully it is written.
      # patches/vtk-expat-wasm-xmlsize.patch sat in the tree for months, named in the deps
      # cache key so a change to it would rebuild VTK, with a comment describing exactly
      # the crash it prevents -- and no line in the repository applied it. Opening the
      # shipped FEMExample trapped on that crash the whole time.
      - name: Every patch is applied by something
        run: python3 tools/check-every-patch-is-applied.py

      # Registering a PySide module in the inittab, building its archive and checking that
      # archive for the symbol are three different things from putting it on the link line.
      # Doing the first three and not the fourth cost a two-hour compile that ended in
      # "undefined symbol: PyInit_QtNetwork".
      - name: PySide modules are registered, built and linked
        run: python3 tools/check-pyside-link-line.py

      - name: No absolute home directories in tracked files
        run: |
          if git grep -nE '/Users/[a-z]+/|C:\\\\Users\\\\' -- $(git ls-files) ; then
            echo "::error::a tracked file hardcodes someone's home directory -- see tools/gen-crossfiles.sh"
            exit 1
          fi
          echo "OK"

      # Was a grep for one hardcoded address, which is a record of past incidents rather
      # than a gate: it caught the OVH origin it was written for while ci/jenkins/README.md
      # sat in HEAD carrying the DEV origin's public IP, which it had never been told
      # about. Now any routable IPv4 literal fails; RFC1918 is still allowed, because this
      # repository documents its own LAN deliberately.
      - name: No routable IP in tracked files
        run: python3 tools/check-no-public-ip.py

      # The Addon Manager overlay forks two upstream worker modules and patches the
      # methods of a third. A stale fork is silent: FreeCAD moves on, the overlay keeps
      # shadowing it with the old logic, and the workbench quietly behaves like the
      # previous release with no error anywhere. Skips where the vendored source is
      # absent, so it is a no-op on runners that do not check it out.
      - name: Addon Manager overlay matches its upstream
        run: python3 tools/check-addon-overlay-drift.py

      - name: No tracked-but-ignored files
        run: |
          out=$(git ls-files --cached | git check-ignore --stdin --no-index || true)
          if [ -n "$out" ]; then
            echo "::error::tracked files match .gitignore: $out"
            exit 1
          fi
          echo "OK"

      - name: Licensing is declared and consistent
        run: |
          set -e
          test -s LICENSE
          test -s NOTICE
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" LICENSE
          grep -q '"license": "LGPL-2.1-or-later"' package.json
          ! grep -q '"ISC"' package.json
          echo "OK"

      # The dialog shims run inside wasm CPython, so they ship as base64 inside the page.
      # They were previously maintained AS base64 -- which is how a stub that made every
      # macro prompt return "cancelled" sat there unnoticed. Regenerating must be a no-op:
      # if it is not, the .py and the embedded copy have drifted and the .py is a lie.
      - name: Embedded dialog shims match their sources
        run: |
          set -e
          python3 tools/gen-dialog-shims.py
          if ! git diff --quiet -- play-gui/freecad-gui.html; then
            echo "::error::freecad-gui.html is out of date with the shim sources — run: python3 tools/gen-dialog-shims.py"
            git diff --stat -- play-gui/freecad-gui.html
            exit 1
          fi
          echo "OK — embedded payloads match play-gui/wasm_dialog_shim*.py"

      # The shipped shim must not reinstate the QInputDialog stubs: they return
      # (value, False) i.e. "cancelled" for every prompt, silently breaking macros and
      # Python workbench commands that ask for a name, count or length.
      - name: JSPI shim does not stub QInputDialog
        run: |
          set -e
          if grep -qE "QInputDialog\.(getText|getInt|getDouble|getItem)\s*=" play-gui/wasm_dialog_shim_jspi.py; then
            echo "::error::the JSPI shim stubs QInputDialog again — every macro prompt will silently cancel"
            exit 1
          fi
          echo "OK"

      # The harnesses are the only real verification this project has, so they must be
      # runnable by whoever needs them -- not just on one laptop. 142 of them hardcoded a
      # macOS Chrome path, which meant nobody on Windows or Linux could check anything.
      - name: Harnesses are runnable off macOS
        run: |
          set -e
          bad=$(grep -rl "Applications/Google Chrome.app" scratchpad/ 2>/dev/null \
                | xargs -r grep -L "process.env.CHROME_PATH" || true)
          if [ -n "$bad" ]; then
            echo "::error::these harnesses hardcode a macOS Chrome path with no CHROME_PATH fallback:"
            echo "$bad"
            exit 1
          fi
          echo "OK — $(grep -rl 'process.env.CHROME_PATH' scratchpad/ | wc -l) harnesses honour CHROME_PATH"

      # infra/Dockerfile greps for each of these after its sed; if a refactor renames one the
      # image build fails on the box. Catch it here instead, on a free runner.
      - name: Dockerfile stamp targets still present in the page
        run: |
          set -e
          for pat in "'FreeCAD.wasm'" "FreeCAD.data.gz?v=1" "'FreeCAD.js'" "'gmsh.js'" "'ccx.js'" "__FCWEB_BUILD__"; do
            grep -qF "$pat" play-gui/freecad-gui.html || { echo "::error::infra/Dockerfile stamps \"$pat\" but it is gone from freecad-gui.html"; exit 1; }
          done
          echo "OK"

      # The dependency manifest is the answer to "which OCCT was production built from?", and
      # right now nothing in the repo answers it. This does not fail the build -- the file can
      # only be produced on the build machine -- but an unanswered reproducibility question
      # should be visible on every run rather than buried in BUILD-WEH.md.
      - name: Dependency manifest present?
        run: |
          if [ -s deps-versions.txt ]; then
            echo "OK — $(grep -cvE '^\s*(#|$)' deps-versions.txt) dependencies pinned"
            unknown=$(grep -c 'unknown' deps-versions.txt || true)
            [ "$unknown" = "0" ] || echo "::warning::$unknown dependencies still report 'unknown'"
          else
            echo "::warning::deps-versions.txt is missing — 21 of 23 dependencies have no recorded version, so this build is not reproducible. Run tools/capture-dep-versions.sh on the build machine (read-only, ~1 min) and commit the output. See BUILD-WEH.md."
          fi

  # LGPL compliance is a build invariant here, not a one-time edit: the app ships under
  # LGPL-2.1-or-later, links LGPL-3.0 Qt/PySide, and fetches GPL gmsh/ccx as separate modules.
  # Two things must stay true on every commit -- every file we author says what it is licensed
  # under, and the attribution page the app links to is actually in the image.
  licensing:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Every authored file carries an SPDX header
        run: python3 tools/add-spdx-headers.py --check

      - name: The attribution page exists, is linked, and is shipped
        run: |
          set -e
          test -s play-gui/legal.html || { echo "::error::play-gui/legal.html is missing"; exit 1; }
          grep -qF 'legal.html' play-gui/freecad-gui.html \
            || { echo "::error::freecad-gui.html no longer links the license page"; exit 1; }
          grep -qF 'play-gui/legal.html' infra/Dockerfile \
            || { echo "::error::infra/Dockerfile does not COPY legal.html into the image"; exit 1; }
          grep -qF 'COPY LICENSE NOTICE' infra/Dockerfile \
            || { echo "::error::infra/Dockerfile no longer serves LICENSE/NOTICE same-origin"; exit 1; }
          echo "OK"

      - name: License texts present for everything we ship under
        run: |
          set -e
          for l in LGPL-3.0-only GPL-2.0-or-later GPL-3.0-only Apache-2.0 BSL-1.0 PSF-2.0; do
            test -s "LICENSES/$l.txt" || { echo "::error::LICENSES/$l.txt missing"; exit 1; }
          done
          test -s LICENSE && test -s NOTICE
          echo "OK"
