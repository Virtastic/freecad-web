# SPDX-License-Identifier: LGPL-2.1-or-later
# Build the freecad-web container image and publish it to GHCR. The shared box then pulls it
# (docker compose pull freecad && up -d), or Watchtower rolls it automatically. The box itself
# is a manually-managed shared resource and is intentionally NOT touched by this workflow.
#
# The large build artifacts (FreeCAD.wasm/.data/.js) are gitignored, so they're pulled from a
# GitHub Release published after a local build:
#     FC_SKIP_CONFIGURE=1 bash build-browser-gui.sh      # produces play-gui/FreeCAD.{js,wasm,data}
#     gh release create build-YYYYMMDD \
#         play-gui/FreeCAD.js play-gui/FreeCAD.wasm play-gui/FreeCAD.data
name: build-freecad-image
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the build artifacts (blank = latest)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build artifacts from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && [ "${{ github.event_name }}" = "release" ] && TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG=$(gh release view --json tagName -q .tagName)
          mkdir -p play-gui
          gh release download "$TAG" --dir play-gui \
            --pattern 'FreeCAD.js' --pattern 'FreeCAD.wasm' --pattern 'FreeCAD.data'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # ghcr.io/virtastic/freecad-web (lowercased)
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
