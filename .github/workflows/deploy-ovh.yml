name: deploy-ovh (freecad.virtastic.app)

# Deploys the FreeCAD-WASM app to the OVH VPS via the self-hosted runner in the Virtastic org.
# The runner executes ON the VPS with docker access, so steps use docker/docker compose directly
# (same pattern as openmw-wasm / ja2-web). Unlike openmw, FreeCAD is NOT compiled on the box — the
# huge prebuilt artifacts (FreeCAD.js/.wasm/.data) are gitignored and pulled from a GitHub Release
# published after a local build:
#     FC_SKIP_CONFIGURE=1 bash build-browser-gui.sh
#     gh release create build-YYYYMMDD play-gui/FreeCAD.js play-gui/FreeCAD.wasm play-gui/FreeCAD.data
#
# Prereqs on the box (one-time, shared with the other sites): the self-hosted runner, the shared
# `edge-caddy` container + `nostalgia` network, and /opt/edge/certs/virtastic.{crt,key}.
on:
  push:
    branches: [ovhcloud]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the artifacts (blank = latest)"
        required: false
        default: ""

concurrency:
  group: deploy-ovh-freecad
  cancel-in-progress: false

jobs:
  deploy:
    # Public-repo hardening: never run on forks or PR-triggered events — this job
    # executes on the production VPS runner.
    if: github.repository == 'Virtastic/freecad-web' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      # Pull the prebuilt engine artifacts into the build context. A clean checkout omits them
      # (gitignored); the Dockerfile COPY would fail without this. Self-contained (curl + python3,
      # both on the runner) — the self-hosted runner has no `gh` CLI.
      - name: Fetch build artifacts from the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQ_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          api="https://api.github.com/repos/$REPO/releases"
          if [ -n "$REQ_TAG" ]; then rel="$api/tags/$REQ_TAG"; else rel="$api/latest"; fi
          json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$rel")
          tag=$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')
          echo "using release: $tag"
          mkdir -p play-gui
          for name in FreeCAD.js FreeCAD.wasm FreeCAD.data gmsh.js gmsh.wasm ccx.js ccx.wasm; do
            aid=$(printf '%s' "$json" | python3 -c "import sys,json;print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='$name'))")
            echo "downloading $name (asset $aid)"
            curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$api/assets/$aid" -o "play-gui/$name"
          done
          test -s play-gui/FreeCAD.wasm && test -s play-gui/FreeCAD.data \
            && test -s play-gui/gmsh.wasm && test -s play-gui/ccx.wasm \
            || { echo "FATAL: artifacts missing/empty after download" >&2; exit 1; }
          # Hand the release tag to the image build so the page can name its own build.
          echo "REL_TAG=$tag" >> "$GITHUB_ENV"

      # Tagged by release + commit so a rollback is a retag, not a rebuild. `freecad:ovh`
      # used to be overwritten in place, leaving the previous image dangling and unnamed --
      # there was nothing to roll back TO. Keep that tag as the pointer the compose file
      # uses, and stamp the page with the build it came from.
      - name: Build image
        run: |
          set -e
          # Two forms on purpose. The page stamp is a display string and may contain '+';
          # a docker tag may NOT ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}), and using '+' failed
          # the build with "invalid reference format". Sanitise anything else out too, so a
          # release tag with an odd character can never break the deploy again.
          BUILD_ID="${REL_TAG}+${GITHUB_SHA::7}"
          IMAGE_TAG=$(printf '%s' "${REL_TAG}-${GITHUB_SHA::7}" | tr -c 'a-zA-Z0-9._-' '-')
          echo "building $BUILD_ID  (image tag: $IMAGE_TAG)"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "FCWEB_BUILD=$BUILD_ID" \
            -t "freecad:$IMAGE_TAG" -t freecad:ovh -f infra/Dockerfile .
          echo "BUILD_ID=$BUILD_ID"   >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          # Keep the last few build tags as rollback targets and drop the rest. Each image is
          # ~785 MB (the engine is baked in), so retaining every deploy fills the disk of a box
          # that also hosts other sites -- and a full disk there is an outage for all of them.
          # Only ever removes freecad:build-* tags: never freecad:ovh (the live pointer), and
          # never an image the running container still needs.
          docker images 'freecad' --format '{{.Tag}}\t{{.CreatedAt}}' \
            | grep -E '^build-' | sort -k2 -r | tail -n +6 | cut -f1 \
            | while read -r old; do
                echo "pruning freecad:$old"
                docker rmi "freecad:$old" || true
              done

      - name: Sync compose to /opt/freecad
        run: |
          sudo mkdir -p /opt/freecad
          sudo cp docker-compose.prod.yml /opt/freecad/docker-compose.prod.yml

      # Drop the vhost into the shared edge's sites dir (imported by /opt/edge/Caddyfile).
      - name: Install edge vhost
        run: sudo cp deploy/freecad.caddy /opt/edge/sites/freecad.caddy

      # Gate the NEW image before it serves anyone. Every check used to run after
      # `docker compose up -d`, so a failed gate turned the run red and left the broken
      # version serving -- the checks could report a problem but never prevent one.
      # A throwaway container on the same network gets the same nginx, the same stamped
      # page and the same headers, without touching the live one.
      - name: Gate the new image (canary, before any traffic moves)
        run: |
          set -e
          docker rm -f freecad-canary >/dev/null 2>&1 || true
          docker run -d --name freecad-canary --network nostalgia "freecad:$IMAGE_TAG" >/dev/null
          ok=0
          for i in $(seq 1 15); do
            docker run --rm --network nostalgia curlimages/curl:latest \
              -fsS -o /dev/null http://freecad-canary:80/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs freecad-canary 2>&1 | tail -30; echo "::error::canary never answered"; exit 1; }

          C() { docker run --rm --network nostalgia curlimages/curl:latest "$@"; }
          C -fsS -D /tmp/can -o /tmp/canbody http://freecad-canary:80/
          echo "--- canary / headers ---"; cat /tmp/can

          fail=0
          chk() { if eval "$2"; then echo "  PASS  $1"; else echo "  FAIL  $1"; fail=1; fi; }
          chk "COOP same-origin"        'grep -qi "^cross-origin-opener-policy: same-origin" /tmp/can'
          chk "COEP require-corp"       'grep -qi "^cross-origin-embedder-policy: require-corp" /tmp/can'
          # The page must be stamped: an unstamped build means the md5/build sed silently
          # did not apply, which is precisely the class of failure that killed returning
          # users once before.
          chk "engine URLs stamped"     'grep -qE "FreeCAD\.wasm\?v=[a-z0-9]{12}" /tmp/canbody'
          chk "data URL stamped"        'grep -qE "FreeCAD\.data\.gz\?v=[a-z0-9]{12}" /tmp/canbody'
          chk "build stamp applied"     '! grep -q "__FCWEB_BUILD__" /tmp/canbody'
          chk "engine assets present"   'C -fsS -o /dev/null -I http://freecad-canary:80/FreeCAD.wasm'

          if [ "$fail" != 0 ]; then
            echo "::error::the new image failed its gate -- NOT switching traffic to it"
            exit 1
          fi
          echo "canary OK -- safe to switch"

      # Always remove the canary, including when the gate above failed.
      - name: Remove canary
        if: always()
        run: docker rm -f freecad-canary >/dev/null 2>&1 || true

      - name: Start / update container
        run: docker compose -f /opt/freecad/docker-compose.prod.yml up -d

      # Validate, then restart the shared edge to apply the new vhost (admin API disabled, so
      # `caddy reload` can't be used; restart re-reads the Caddyfile, ~3s blip). Validate first to
      # protect the other sites on this edge.
      - name: Apply edge config
        run: |
          docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
          docker restart edge-caddy

      # Fast internal gate: the container itself answers 200 + COOP on the shared network.
      - name: Health check (container)
        run: |
          sleep 4
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS -D - -o /dev/null http://freecad:80/ \
            | tee /dev/stderr | grep -qi '^cross-origin-opener-policy: same-origin'

      # Real end-to-end gate for the config THIS deploy controls: the shared edge (TLS + sec_headers
      # + reverse_proxy to the container). Hit the edge DIRECTLY via --resolve to 127.0.0.1, bypassing
      # Cloudflare. -k because the edge presents the Cloudflare Origin CA cert (not a public CA).
      - name: Health check (edge, bypassing Cloudflare)
        run: |
          set -e
          E() { curl -sS -k --resolve freecad.virtastic.app:443:127.0.0.1 "$@"; }
          for i in $(seq 1 12); do
            E -o /dev/null https://freecad.virtastic.app/ && break
            echo "edge not ready yet ($i)…"; sleep 3
          done
          E -D /tmp/h -o /dev/null https://freecad.virtastic.app/
          echo "--- / headers (edge, pre-CF) ---"; cat /tmp/h
          grep -qi '^cross-origin-opener-policy: same-origin'   /tmp/h
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/h
          # engine wasm carries the correct MIME through the edge
          E -D - -o /dev/null https://freecad.virtastic.app/FreeCAD.wasm \
            | tee /tmp/w | grep -qi '^content-type: *application/wasm'
          # landing gate
          E -f -o /dev/null https://freecad.virtastic.app/
          echo "edge health OK"

      # Purge the edge cache. STABLE artifact names change every build, and Cloudflare caches the
      # small FreeCAD.js at the edge — if it isn't purged it goes stale against a fresh FreeCAD.wasm,
      # causing an EM_ASM "ASM_CONSTS[code] is not a function" mismatch (the .js and .wasm MUST be
      # from the same build). Also purge the harness HTML. Uses the same CLOUDFLARE_API_TOKEN the DNS
      # workflow already relies on (zone id resolved via API, so no separate CF_ZONE_ID secret). The
      # token needs the "Cache Purge" permission on the zone.
      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: virtastic.app
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping edge purge (set it: gh secret set CLOUDFLARE_API_TOKEN -R Virtastic/freecad-web)."
            exit 0
          fi
          api=https://api.cloudflare.com/client/v4
          zid=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api/zones?name=${ZONE}" \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"][0]["id"])')
          echo "purging zone $ZONE ($zid)"
          curl -fsS -X POST "$api/zones/$zid/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"files":[
              "https://freecad.virtastic.app/",
              "https://freecad.virtastic.app/freecad-gui.html",
              "https://freecad.virtastic.app/FreeCAD.js",
              "https://freecad.virtastic.app/FreeCAD.wasm",
              "https://freecad.virtastic.app/FreeCAD.data",
              "https://freecad.virtastic.app/FreeCAD.data.gz",
              "https://freecad.virtastic.app/gmsh.js",
              "https://freecad.virtastic.app/gmsh.wasm",
              "https://freecad.virtastic.app/ccx.js",
              "https://freecad.virtastic.app/ccx.wasm"
            ]}' | python3 -c 'import sys,json;d=json.load(sys.stdin);print("purge success:",d.get("success"))'

      # The gate that has never existed: verify what a REAL USER receives, through Cloudflare.
      # Every check above deliberately bypasses the CDN (--resolve to 127.0.0.1), so nothing in
      # this pipeline has ever looked at the layer most likely to break it. This repo's own
      # history has Cloudflare caching a 404 for a year, and caching FreeCAD.data.gz from a probe
      # made before nginx served it with Content-Encoding -- which would have broken every boot.
      # Runs after the purge, so it also proves the purge worked.
      - name: Health check (through Cloudflare, what users actually get)
        run: |
          set -e
          sleep 5
          fail=0
          chk() { if eval "$2"; then echo "  PASS  $1"; else echo "  FAIL  $1"; fail=1; fi; }

          curl -sS -D /tmp/ch -o /tmp/cb https://freecad.virtastic.app/
          echo "--- / headers (through Cloudflare) ---"; cat /tmp/ch

          chk "200 on /"                       'grep -qE "^HTTP/[0-9.]+ 200" /tmp/ch'
          chk "COOP same-origin"               'grep -qi "^cross-origin-opener-policy: same-origin" /tmp/ch'
          chk "COEP require-corp"              'grep -qi "^cross-origin-embedder-policy: require-corp" /tmp/ch'
          chk "entry HTML is no-cache"         'grep -qi "^cache-control:.*no-cache" /tmp/ch'

          # The stamps the browser will actually request must resolve THROUGH the CDN. A stale
          # edge object here is exactly the failure that killed returning users once before.
          for u in $(grep -oE "(FreeCAD\.wasm|FreeCAD\.data\.gz|gmsh\.js|ccx\.js)\?v=[a-z0-9]+" /tmp/cb | sort -u); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://freecad.virtastic.app/$u")
            chk "stamped asset $u -> $code" "[ \"$code\" = 200 ]"
          done

          curl -sS -D /tmp/cw -o /dev/null "https://freecad.virtastic.app/$(grep -oE 'FreeCAD\.wasm\?v=[a-z0-9]+' /tmp/cb | head -1)"
          chk "wasm content-type"              'grep -qi "^content-type: *application/wasm" /tmp/cw'
          chk "wasm immutable"                 'grep -qi "^cache-control:.*immutable" /tmp/cw'

          # MUST send Accept-Encoding: gzip. curl does not by default, and a CDN correctly
          # decompresses for a client that does not advertise it -- so without this header
          # the response has no Content-Encoding and the check fails on a perfectly healthy
          # origin. That false positive failed a deploy once; a gate that red-lights every
          # run is worse than no gate, because it teaches you to ignore red.
          curl -sS -H 'Accept-Encoding: gzip' -D /tmp/cd -o /dev/null \
            "https://freecad.virtastic.app/$(grep -oE 'FreeCAD\.data\.gz\?v=[a-z0-9]+' /tmp/cb | head -1)"
          chk "data.gz Content-Encoding gzip"  'grep -qi "^content-encoding: *gzip" /tmp/cd'
          chk "data.gz has a body"             '[ "$(grep -i "^content-length:" /tmp/cd | tr -dc 0-9)" -gt 1000000 ]'

          [ "$fail" = 0 ] || { echo "::error::what Cloudflare serves does not match what the edge serves"; exit 1; }
          echo "through-CDN health OK"
