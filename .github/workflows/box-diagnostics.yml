name: box diagnostics (read-only)

# Answers the questions that otherwise need a shell on the VPS, WITHOUT anyone holding an
# SSH key: the self-hosted runner already executes on that box, so this is the same channel
# the deploy uses -- audited, logged, repeatable, and revocable by disabling the runner.
#
# STRICTLY READ-ONLY. It inspects and reports; it never writes, restarts, pulls or prunes.
# Keep it that way -- the value here is that it is safe to run at any time, including while
# something is on fire.
#
# It deliberately never prints .credentials, tokens, or key material: the runner's
# .credentials file holds a live registration token, so only the SCOPE fields of .runner
# are read.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'Virtastic/freecad-web' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      # Needed so the sudoers candidate can be syntax-checked from the repo. Without it the
      # workspace holds whatever the last job left behind, and the validation step reported
      # "file not present" while looking straight at a stale directory.
      - uses: actions/checkout@v4

      - name: Runner identity and registration scope
        run: |
          echo "--- who this job runs as ---"
          echo "user: $(whoami)   uid: $(id -u)   groups: $(id -Gn)"
          echo "host: $(hostname)"
          echo "workdir: $(pwd)"
          echo
          echo "--- runner registration scope (the public-repo risk question) ---"
          # .runner records what the runner is registered against. .credentials sits next to
          # it and holds a live token -- never read that one.
          # There is MORE THAN ONE runner installed on this box. Guessing $HOME/actions-runner
          # read the wrong one (a different org's). Derive the install dir from the workspace
          # this job is actually executing in, so the scope reported is THIS runner's.
          mine=""
          if [ -n "${GITHUB_WORKSPACE:-}" ]; then
            d="$GITHUB_WORKSPACE"
            for _ in 1 2 3 4 5 6; do
              d="$(dirname "$d")"
              [ -f "$d/.runner" ] && { mine="$d/.runner"; break; }
            done
          fi
          echo "runner executing this job:"
          if [ -n "$mine" ]; then
            echo "  config: $mine"
            grep -oE '"(gitHubUrl|agentName|poolId|workFolder|ephemeral)"[^,}]*' "$mine" | sed 's/^/    /'
          else
            echo "  (could not locate this runner's .runner from $GITHUB_WORKSPACE)"
          fi
          echo
          echo "EVERY runner installed on this box (blast radius: who else can run here):"
          for c in /home/*/actions-runner*/.runner /opt/actions-runner*/.runner /srv/actions-runner*/.runner; do
            [ -f "$c" ] || continue
            url=$(grep -oE '"gitHubUrl"[^,}]*' "$c" | cut -d'"' -f4)
            name=$(grep -oE '"agentName"[^,}]*' "$c" | cut -d'"' -f4)
            echo "  $c"
            echo "    scope=$url  agent=$name"
          done
          echo "  RUNNER_NAME=${RUNNER_NAME:-?}  RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-?}"

      - name: Privilege the runner actually holds
        run: |
          echo "--- passwordless sudo? (this is what makes the runner root-equivalent) ---"
          if sudo -n true 2>/dev/null; then
            echo "  YES — this job can become root without a password"
            sudo -n -l 2>/dev/null | sed 's/^/    /' | head -15
          else
            echo "  no — sudo requires a password"
          fi
          echo
          echo "--- docker socket access? ---"
          if docker info >/dev/null 2>&1; then
            echo "  YES — full control of every container on this box"
          else
            echo "  no"
          fi

      - name: Disk (image pruning was added recently — did it hold?)
        run: |
          echo "--- filesystem ---"
          df -h / /var/lib/docker 2>/dev/null | sed 's/^/  /'
          echo
          echo "--- docker space ---"
          docker system df 2>/dev/null | sed 's/^/  /'
          echo
          echo "--- freecad images (rollback targets; deploy keeps the newest 5 build-*) ---"
          docker images 'freecad' --format '  {{.Tag}}\t{{.CreatedSince}}\t{{.Size}}' | sort -r
          echo
          echo "--- dangling images (waste) ---"
          echo "  count: $(docker images -f dangling=true -q | wc -l)"

      - name: Containers and health
        run: |
          echo "--- all containers on the shared box ---"
          docker ps -a --format '  {{.Names}}\t{{.Status}}\t{{.Image}}' | sed 's/^/ /'
          echo
          echo "--- freecad container health (HEALTHCHECK was added recently) ---"
          docker inspect --format '  state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}<none configured>{{end}} restarts={{.RestartCount}}' freecad 2>/dev/null \
            || echo "  (no container named freecad)"
          echo
          echo "--- last 20 log lines from freecad ---"
          docker logs --tail 20 freecad 2>&1 | sed 's/^/    /' || true

      - name: Validate the scoped sudoers candidate (does NOT install it)
        run: |
          echo "--- absolute paths the sudoers rule must match ---"
          # A sudoers Cmnd must be the fully-qualified path. If these differ from what
          # infra/sudoers-runner-scoped says, the rule silently will not match and the
          # deploy breaks the moment the blanket rule is removed.
          for c in mkdir cp ufw iptables; do
            printf '  %-9s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo '(not found)')"
          done
          echo
          echo "--- syntax check on infra/sudoers-runner-scoped ---"
          if [ -f infra/sudoers-runner-scoped ]; then
            if visudo -c -f infra/sudoers-runner-scoped 2>&1 | sed 's/^/  /'; then
              echo "  syntax OK"
            else
              echo "::error::infra/sudoers-runner-scoped is NOT valid — do not install it"
              exit 1
            fi
          else
            echo "  (file not present in this checkout)"
          fi
          echo
          echo "--- where the blanket NOPASSWD: ALL is defined (so it can be removed later) ---"
          sudo -n grep -rln "NOPASSWD: *ALL" /etc/sudoers /etc/sudoers.d/ 2>/dev/null | sed 's/^/  /' \
            || echo "  (not readable)"

      - name: What the box serves to the world
        run: |
          echo "--- listening sockets (is anything exposed beyond the edge?) ---"
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | sed 's/^/  /' | head -20
          echo
          echo "--- firewall ---"
          (sudo -n ufw status 2>/dev/null || sudo -n iptables -S 2>/dev/null | head -20 || echo "  (not readable)") | sed 's/^/  /'
