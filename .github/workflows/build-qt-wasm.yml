name: build Qt 6.11 for wasm (EH + JSPI)

# The last expensive piece of a FreeCAD relink, and the one I kept citing as the reason the
# whole thing was impossible here.
#
# THE THING THAT MAKES IT TRACTABLE
#
# Cross-building Qt for wasm needs a HOST Qt of the same version, to run moc/rcc/uic and the
# build tooling. That sounds like two full Qt builds and it is why "Qt from source" reads as
# 5+ hours. But only the TARGET needs production's special features:
#
#     -feature-wasm-exceptions -feature-wasm-jspi
#
# The host Qt runs on the runner's own CPU and never touches wasm, so it can be an ordinary
# prebuilt from aqtinstall. That removes one entire Qt build from the critical path and leaves
# a single cross-compile.
#
# This is exactly why an official Qt wasm binary cannot be used for the TARGET: the shipped
# wasm builds have neither feature, and BUILD-WEH.md is explicit that mixing one JS-EH library
# into this world silently reintroduces invoke_* trampolines, at which point JSPI cannot
# suspend across the JS frame and dialogs stop returning the user's real choice.
#
# NOT A REPRODUCTION. Qt 6.11.2 is named in BUILD-WEH.md, so unlike the other 21 dependencies
# this version is actually known -- but the configure flags here are reconstructed from that
# document, not captured from the machine that built production. Treat the output as "a Qt
# that should be compatible", and confirm against deps-versions.txt when it exists.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to build"
        type: choice
        default: vps
        options:
          - vps
          - ubuntu-latest

permissions:
  contents: read

jobs:
  qt:
    # `vps` by default -- see the note in build-deps.yml. This is the longest job in the
    # repository (2-3 h) and the Virtastic runner takes one job at a time, so dispatching it
    # queues every other Virtastic deploy behind it for that whole window. That is the trade
    # being made deliberately: hosted minutes were the scarce resource, deploy latency is not.
    runs-on: ${{ inputs.runner == 'vps' && fromJSON('["self-hosted","ovh","virtastic"]') || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # HOSTED RUNNERS ONLY. On a throwaway CI image these trees are reclaimable space; on the
      # OVH box they are somebody's filesystem, and that box also runs another product's
      # database. The `|| true` here would have swallowed the mistake rather than prevented
      # it, so the guard is the `if`, not the error handling.
      - name: Free disk
        if: ${{ inputs.runner != 'vps' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h / | sed 's/^/  /'

      - name: Disk before (self-hosted)
        if: ${{ inputs.runner == 'vps' }}
        run: |
          echo "  building on $(hostname) -- NOT deleting anything on this box"
          df -h / | sed 's/^/  /'
          nproc | sed 's/^/  cpus: /'

      # Same reasoning as build-ccx.yml's preflight. Qt's configure additionally needs perl
      # and a real ninja; on a hosted image both are given, on the box neither was until it
      # was provisioned.
      - name: Preflight -- is this machine able to build at all?
        run: |
          miss=""
          for t in cmake ninja python3 perl make curl tar; do
            command -v "$t" >/dev/null 2>&1 || miss="$miss $t"
          done
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || miss="$miss cc/gcc"
          if [ -n "$miss" ]; then
            echo "::error::this runner cannot build:$miss"
            echo "On the OVH box, provision it once with:"
            echo "    sudo apt-get install -y build-essential cmake ninja-build"
            exit 1
          fi
          echo "  toolchain ok: $(cmake --version | head -1), $(ninja --version)"

      - name: Cache the built Qt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: qt/6.11.2/wasm_mt_weh
          key: fcweb-qt-6.11.2-wasm64-eh-jspi-mt-emsdk6.0.9-v1

      - name: Install emsdk 6.0.9
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9
          . ./emsdk_env.sh && emcc --version | head -1

      # Everything below logs to /tmp/qtlogs and is uploaded as an ARTIFACT. GitHub's job-log
      # API has returned 404 for this repo for the whole session, so the normal way of finding
      # out why a step failed is unavailable -- but the artifacts API works. Routing the
      # diagnostics through it is the difference between a debuggable failure and a dead end.
      # The host Qt's TOOLS are dynamically linked desktop binaries, so they need desktop
      # runtime libraries even though nothing here draws anything. Diagnosed from run
      # 32040905674, which configured fine and then died 731 targets into the build:
      #   qsb: error while loading shared libraries: libEGL.so.1: cannot open shared object file
      # A bare ubuntu-latest runner has no libEGL. qsb only compiles shaders offline, but it
      # links against Qt Gui, so the .so has to be present regardless.
      - name: Host Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libglx0 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
          echo "  libEGL: $(ldconfig -p | grep -c libEGL.so.1) match(es)"

      - name: Prepare log dir + environment fingerprint
        run: |
          mkdir -p /tmp/qtlogs
          {
            echo "== tools =="
            for t in cmake ninja python3 gcc g++ perl; do
              printf '%-8s %s\n' "$t" "$(command -v $t || echo MISSING)"
            done
            cmake --version | head -1; ninja --version 2>/dev/null || echo "ninja: MISSING"
            echo; echo "== disk =="; df -h /
          } > /tmp/qtlogs/00-env.txt 2>&1
          cat /tmp/qtlogs/00-env.txt

      # The host Qt: ordinary desktop build, no wasm involved, so a prebuilt is fine and saves
      # roughly an hour and a half. It only has to match the target VERSION.
      - name: Host Qt 6.11.2 (prebuilt — it never touches wasm)
        run: |
          set -o pipefail
          rc=0
          # The host needs every module whose TOOLS the cross-build runs, not just qtbase.
          # Diagnosed from run 32040220795: configure died with
          #   "Qt6ShaderToolsTools package could not be found ... build and install the host
          #    ShaderTools module"  (qtshadertools/tools/qsb/CMakeLists.txt)
          # because qtdeclarative depends on qtshadertools and its qsb shader compiler has to
          # run ON THE HOST during the wasm build. The bare linux_gcc_64 package does not
          # include it. Mirror the target submodule list here.
          # --break-system-packages: this workflow used to run on a GitHub-hosted
          # runner, where pip installs freely. On the VPS the system Python is
          # PEP 668 externally-managed and the bare install dies with
          # "error: externally-managed-environment" -- which is what killed run
          # 32236578889 three minutes in, before Qt was configured at all.
          { { python3 -m pip install --quiet --break-system-packages aqtinstall 2>/dev/null || python3 -m pip install --quiet aqtinstall; } &&
            # ONLY qtshadertools. Run 32040636843 established that qtdeclarative, qtsvg and
            # qttools are not separate aqtinstall modules for 6.11.2 -- they ship inside the
            # base linux_gcc_64 package, and naming them makes aqt fail outright:
            #   "The packages ['qtdeclarative', 'qtsvg', 'qttools'] were not found"
            # qtshadertools IS separate, and is the one the cross-build actually needs.
            python3 -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 \
              -m qtshadertools -O "$PWD/qt-host"
          } > /tmp/qtlogs/01-host-qt.txt 2>&1 || rc=$?
          echo "  aqt exit=$rc"
          find "$PWD/qt-host" -maxdepth 3 -name qmake >> /tmp/qtlogs/01-host-qt.txt 2>&1 || true
          tail -25 /tmp/qtlogs/01-host-qt.txt
          exit $rc

      - name: Qt sources
        run: |
          set -o pipefail
          rc=0
          { curl -fsSL -o /tmp/qt.tar.xz \
              https://download.qt.io/archive/qt/6.11/6.11.2/single/qt-everywhere-src-6.11.2.tar.xz &&
            mkdir -p qt-src && tar xJf /tmp/qt.tar.xz -C qt-src --strip-components=1
          } > /tmp/qtlogs/02-src.txt 2>&1 || rc=$?
          ls qt-src/configure >> /tmp/qtlogs/02-src.txt 2>&1 || true
          echo "  src exit=$rc"; tail -10 /tmp/qtlogs/02-src.txt
          exit $rc

      # Only the modules FreeCAD actually links. Building all of Qt here would add hours for
      # things this app never loads.
      # Output is teed into the STEP SUMMARY, not just the log. GitHub's job-log API returned
      # 404 for this repo throughout, so a failure whose reason lives only in the log is one
      # nobody can act on. `-static` is dropped: Qt for wasm is always statically linked and
      # passing the flag explicitly is rejected by some configure versions -- a plausible
      # cause of the first run's failure, and harmless to remove regardless.
      - name: Configure for wasm
        run: |
          . ./toolchain/env.sh

          # Give Qt its own EMSDK directory instead of editing the real one.
          #
          # QtPublicWasmToolchainHelpers.cmake reads $ENV{EMSDK}/.emscripten, regex-extracts
          # the quoted EMSCRIPTEN_ROOT, and appends it to $EMSDK:
          #     set(EXECUTE_COMMANDPATH "$ENV{EMSDK}/${emroot_path}/emcc")
          # so the value must be the bare suffix "/upstream/emscripten". emsdk 6.0.9 writes
          # '$CFGDIR/upstream/emscripten' there, which Qt does not expand.
          #
          # Rewriting the REAL .emscripten to that suffix satisfied Qt and then broke the
          # very next step: emsdk_env.sh derives PATH from that file, got a nonexistent
          # /upstream/emscripten, and emcc vanished -- toolchain/env.sh refused to continue,
          # which is what that assertion is for. So the real file is never touched now.
          #
          # The shim holds only a Qt-shaped .emscripten and a symlink to the real upstream/,
          # so $shim/upstream/emscripten/emcc resolves. EMSDK is overridden for Qt's own
          # processes only; emcc itself uses EM_CONFIG and its file path, and never reads it.
          shim="$GITHUB_WORKSPACE/qt-emsdk-shim"
          rm -rf "$shim" && mkdir -p "$shim"
          ln -s "$EMSDK/upstream" "$shim/upstream"
          echo "EMSCRIPTEN_ROOT = '/upstream/emscripten'" > "$shim/.emscripten"
          "$shim/upstream/emscripten/emcc" --version | head -1 | sed "s/^/  shim resolves emcc: /"

          mkdir -p qt-build && cd qt-build
          rc=0
          EMSDK="$shim" ../qt-src/configure \
            -platform wasm-emscripten \
            -qt-host-path "$GITHUB_WORKSPACE/qt-host/6.11.2/gcc_64" \
            -prefix "$GITHUB_WORKSPACE/qt/6.11.2/wasm_mt_weh" \
            -feature-wasm-exceptions \
            -feature-wasm-jspi \
            `# THREADS. Qt for WebAssembly defaults to single-threaded, and this` \
            `# configure never asked for them -- so despite the wasm_mt prefix the` \
            `# result was a single-threaded Qt, and QtConcurrent (which requires` \
            `# thread) was silently not built at all. FreeCAD lists Concurrent among` \
            `# its four base Qt components, so its configure died on` \
            `# 'Could NOT find Qt6Concurrent'. Everything else in this stack is` \
            `# compiled -pthread, so a single-threaded Qt was wrong regardless.` \
            -feature-thread \
            -release -no-warnings-are-errors \
            -submodules qtbase,qtsvg,qtdeclarative,qttools \
            -skip qtwebengine \
            -- -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > /tmp/qtlogs/03-configure.txt 2>&1 || rc=$?
          # CMake's own error files say far more than configure's stdout when the failure is
          # in a compile test, and they are the usual reason a wasm configure dies.
          for f in qt-build/CMakeFiles/CMakeError.log qt-build/CMakeFiles/CMakeOutput.log \
                   qt-build/config.summary; do
            [ -s "$f" ] && cp "$f" "/tmp/qtlogs/04-$(basename "$f")" 2>/dev/null || true
          done
          {
            echo "### configure (exit $rc)"
            echo '```'
            tail -60 /tmp/qtlogs/03-configure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/qtlogs/03-configure.txt
          exit $rc

      - name: Build and install
        id: build
        run: |
          set -o pipefail
          . ./toolchain/env.sh
          t0=$SECONDS
          rc=0
          # Same shim as configure: cmake can re-run the configure step during a build,
          # and Qt would read the real .emscripten again and fail the same way.
          shim="$GITHUB_WORKSPACE/qt-emsdk-shim"
          { EMSDK="$shim" cmake --build qt-build --parallel && EMSDK="$shim" cmake --install qt-build; } \
            > /tmp/qtlogs/05-build.txt 2>&1 || rc=$?
          [ "$rc" = 0 ] && echo "secs=$((SECONDS-t0))" >> "$GITHUB_OUTPUT"
          echo "  === Qt build exit=$rc in $((SECONDS-t0))s ==="
          tail -40 /tmp/qtlogs/05-build.txt
          exit $rc

      # THE POINT OF ALL THE ABOVE. The jobs/logs API 404s for this repo; the artifacts API
      # works. So the diagnostics leave by the door that is actually open.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt-wasm-logs
          path: /tmp/qtlogs
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always()
        run: |
          {
            echo "## Qt 6.11.2 for wasm (wasm-exceptions + JSPI)"
            echo
            echo "build: ${{ steps.build.outputs.secs && format('{0}s', steps.build.outputs.secs) || '**FAILED**' }}"
            echo
            echo '```'
            ls qt/6.11.2/wasm_mt_weh/lib/*.a 2>/dev/null | head -30 || echo "(nothing installed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la qt/6.11.2/wasm_mt_weh/lib/ 2>/dev/null | head -20 | sed 's/^/  /' || echo "  (nothing)"

      - name: Disk after
        if: always()
        run: df -h / | sed 's/^/  /'
