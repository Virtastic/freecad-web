name: build the Python extension libraries (wasm)

# The FreeCAD C++ compiles clean (2676/2676) but does not LINK, and this is most of what
# stands between the two. MainGui.cpp's inittab registers builtin modules whose archives
# have to exist at link time:
#
#   numpy._core._multiarray_umath, numpy.fft._pocketfft_umath,
#   numpy.linalg._umath_linalg, numpy.linalg.lapack_lite   -> deps/wasm/lib/numpy-mod
#   matplotlib.* (8 extensions)                            -> deps/wasm/lib/mpl-mod
#   kiwisolver._cext                                       -> deps/wasm/lib/kiwi-mod
#   _ctypes                                                -> deps/wasm/lib/ctypes-mod
#   PIL._imaging                                           -> deps/wasm/lib/pil-mod
#
# The link is run with -sERROR_ON_UNDEFINED_SYMBOLS=0, so a missing archive does NOT fail
# the build -- it produces a binary whose PyInit_* is a trapping stub and whose `import
# numpy` dies in the browser. That is exactly the failure mode this repository keeps
# getting caught by, so every lane below asserts its own output.
#
# Separate from build-deps.yml on purpose: these need the CPython BUILD TREE
# (deps/src/cpython/builddir), not the staged libpython3.13.a, and rebuilding the whole
# C++ stack to add a Python extension would be absurd. Own cache, own key.

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "which lanes to build (space separated, or 'all')"
        type: string
        default: "all"
      rebuild:
        description: "ignore the cache and rebuild"
        type: boolean
        default: false
  push:
    branches: [freecad-1.1.3]
    paths:
      - '.github/workflows/build-python-deps.yml'
      - 'configure-numpy.sh'
      - 'configure-kiwisolver-weh.sh'
      - 'configure-matplotlib-weh.sh'
      - 'configure-ctypes.sh'
      - 'configure-pillow.sh'
      - 'emscripten-crossfile.meson.in'
      - 'matplotlib-crossfile.meson.in'
      - 'tools/gen-crossfiles.sh'

permissions:
  contents: read

env:
  PYDEPS_KEY: v1-emsdk3.1.70-cpython3.13.3-numpy2.1.3-mpl3.9.2

jobs:
  pydeps:
    timeout-minutes: 360
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the Python extension libraries
        id: pycache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/wasm/lib/numpy-mod
            deps/wasm/lib/mpl-mod
            deps/wasm/lib/kiwi-mod
            deps/wasm/lib/ctypes-mod
            deps/wasm/lib/pil-mod
            deps/wasm/lib/libffi.a
            deps/src/cpython
            deps/src/numpy
            build-numpy
          key: fcweb-pydeps-${{ env.PYDEPS_KEY }}-${{ hashFiles('configure-numpy.sh', 'configure-kiwisolver-weh.sh', 'configure-matplotlib-weh.sh', 'configure-ctypes.sh', 'configure-pillow.sh', 'patches/numpy.patch', '*.meson.in') }}
          restore-keys: |
            fcweb-pydeps-${{ env.PYDEPS_KEY }}-

      # CPython gets its OWN cache, keyed only on the scripts that build it, and saved
      # even when a later lane fails. Sharing the pydeps key meant every numpy fix
      # invalidated the CPython build too -- and since the pydeps cache only saves on full
      # success, three failed numpy attempts cost three 25-minute CPython rebuilds for a
      # tree that had not changed.
      - name: Restore CPython build tree
        id: cpycache
        uses: actions/cache/restore@v4
        with:
          path: deps/src/cpython
          key: fcweb-cpython-3.13.3-emsdk3.1.70-${{ hashFiles('build-cpython.sh', 'build-cpython-mt.sh', 'patches/cpython-ctypes-wasm.patch') }}

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.70-shims-v1

      - name: Install emsdk 3.1.70
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 3.1.70 && ./emsdk activate 3.1.70

      # The VPS system Python is 3.14 and ships no ensurepip, so `python3 -m venv` fails
      # outright ("you need to install the python3.14-venv package"), and there is no root
      # here to install it with. setup-python brings its own complete interpreter -- and at
      # 3.13, which matches the CPython being cross-compiled rather than sitting a version
      # ahead of it.
      - name: Host Python 3.13
        id: hostpy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # meson and ninja drive every lane. The build machine keeps them in .qtvenv, which
      # these scripts source when it exists; make the same thing here so they need no
      # special-casing for CI.
      - name: Build tools (meson, ninja, pybind11, setuptools)
        run: |
          set -e
          '${{ steps.hostpy.outputs.python-path }}' -m venv .qtvenv
          . .qtvenv/bin/activate
          python -m pip install --quiet --upgrade pip
          # cython: numpy's meson.build declares it as a compiler, so meson refuses to configure
          # without it -- "Unknown compiler(s): [['cython'], ['cython3']]". cppy is
          # kiwisolver's build dependency.
          python -m pip install --quiet meson ninja pybind11 setuptools wheel cppy cython
          echo "  python $(python -V), meson $(meson --version), ninja $(ninja --version)"

      # libffi is the one lane that still uses autotools: configure-ctypes.sh clones
      # hoodmane/libffi-emscripten and runs ./autogen.sh, which needs libtool's m4 macros.
      # Without them autoreconf stops at
      #   configure.ac:219: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
      # Try to install them; if there is no sudo here, say so plainly -- that is a
      # provisioning fact about the box, not a mystery about the build.
      - name: autotools for libffi
        continue-on-error: true
        run: |
          if command -v libtoolize >/dev/null 2>&1 && [ -e /usr/share/aclocal/libtool.m4 ]; then
            echo "  libtool already present"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq libtool automake autoconf
            echo "  installed libtool/automake/autoconf"
          else
            echo "::warning::no libtool and no passwordless sudo on this runner."
            echo "  libffi (and therefore _ctypes) cannot be autoreconf'd here."
            echo "  Provision once with: sudo apt-get install -y libtool automake autoconf"
          fi

      - name: Fetch sources
        run: |
          set -e
          mkdir -p deps/src
          get() {  # get <dir> <url> <strip> <marker>
            if [ -e "deps/src/$1/$4" ]; then echo "  $1: present"; return 0; fi
            echo "  $1: fetching"
            mkdir -p "deps/src/$1"
            curl -fsSL -o /tmp/s.tar.gz "$2"
            tar xzf /tmp/s.tar.gz -C "deps/src/$1" --strip-components="$3"
          }
          get cpython https://github.com/python/cpython/archive/refs/tags/v3.13.3.tar.gz 1 configure
          get numpy   https://github.com/numpy/numpy/releases/download/v2.1.3/numpy-2.1.3.tar.gz 1 meson.build
          get kiwisolver https://github.com/nucleic/kiwi/archive/refs/tags/1.4.7.tar.gz 1 py/src/kiwisolver.cpp
          get Pillow     https://github.com/python-pillow/Pillow/archive/refs/tags/10.4.0.tar.gz 1 src/_imaging.c
          get matplotlib https://github.com/matplotlib/matplotlib/archive/refs/tags/v3.9.2.tar.gz 1 meson.build

      - name: Apply the source patches
        run: |
          set -e
          FCWEB_PATCH_OPTIONAL=1 bash patches/apply.sh

      # numpy's code generators run on the host interpreter, and the meson cross-file points
      # at CPython's own build of it -- not the system python, whose version would not match
      # the wasm headers.
      - name: CPython 3.13.3 (host + wasm/pthreads)
        id: cpython
        run: |
          set -e
          . emsdk/emsdk_env.sh
          if [ -e deps/src/cpython/builddir/emscripten-mt/libpython3.13.a ] \
             && [ -e deps/src/cpython/builddir/build/python3-native ]; then
            echo "  cpython: already built (cache hit)"
            exit 0
          fi
          t0=$SECONDS
          bash build-cpython.sh
          bash build-cpython-mt.sh
          echo "  cpython built in $((SECONDS-t0))s"
          # The cross-file names python3-native specifically; CPython does not always
          # create it, and meson mono-wraps the .exe name if we point at that instead.
          cd deps/src/cpython/builddir/build
          if [ ! -e python3-native ]; then
            for c in python python.exe python3; do
              [ -x "$c" ] && ln -sf "$c" python3-native && break
            done
          fi
          ls -la python3-native

      - name: Save CPython build tree
        if: always() && steps.cpycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/src/cpython
          key: fcweb-cpython-3.13.3-emsdk3.1.70-${{ hashFiles('build-cpython.sh', 'build-cpython-mt.sh', 'patches/cpython-ctypes-wasm.patch') }}

      - name: numpy
        id: lane_numpy
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ -s deps/wasm/lib/numpy-mod/libnpy__multiarray_umath.a ] && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  numpy: already built (cache hit)"
            exit 0
          fi
          bash configure-numpy.sh

      # Each lane checks its own product rather than its own exit status. The link runs
      # with -sERROR_ON_UNDEFINED_SYMBOLS=0, so an archive that never got built becomes a
      # trapping PyInit_* at run time instead of an error at build time.
      - name: kiwisolver (matplotlib layout dependency)
        id: lane_kiwisolver
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/kiwi-mod/libkiwi__cext.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-kiwisolver-weh.sh
          else
            echo "  kiwisolver: already built"
          fi
          [ -s deps/wasm/lib/kiwi-mod/libkiwi__cext.a ]             || { echo "::error::kiwi-mod/libkiwi__cext.a not produced"; exit 1; }

      - name: _ctypes (+ libffi)
        id: lane_ctypes
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/ctypes-mod/lib_ctypes.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-ctypes.sh
          else
            echo "  _ctypes: already built"
          fi
          [ -s deps/wasm/lib/ctypes-mod/lib_ctypes.a ]             || { echo "::error::ctypes-mod/lib_ctypes.a not produced"; exit 1; }
          [ -s deps/wasm/lib/libffi.a ] || { echo "::error::libffi.a not produced"; exit 1; }

      - name: Pillow _imaging
        id: lane_pillow
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/pil-mod/libpil__imaging.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-pillow.sh
          else
            echo "  Pillow: already built"
          fi
          [ -s deps/wasm/lib/pil-mod/libpil__imaging.a ]             || { echo "::error::pil-mod/libpil__imaging.a not produced"; exit 1; }

      # Last, because it reaches into build-numpy for numpy's generated headers.
      - name: matplotlib
        id: lane_matplotlib
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/mpl-mod/libmpl__backend_agg.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-matplotlib-weh.sh
          else
            echo "  matplotlib: already built"
          fi
          n=$(ls -1 deps/wasm/lib/mpl-mod/*.a 2>/dev/null | wc -l | tr -d ' ')
          echo "  mpl-mod: $n archives"
          # 8 extensions + freetype/qhull/agg/ttconv. The darwin-only glob this script used
          # to have produced an empty directory and a silently crippled link.
          [ "$n" -ge 8 ] || { echo "::error::mpl-mod has $n archives, expected at least 8"; exit 1; }

      # One gate at the end, so a single broken lane does not hide the state of the
      # others. Every archive named here is one MainGui.cpp registers in its inittab; a
      # missing one is a trapping PyInit_* in the browser, not a link error.
      - name: Gate -- every archive the link needs
        run: |
          fail=0
          need() {
            if [ -s "$1" ]; then echo "  ok       $2"; else echo "::error::missing $2 ($1)"; fail=1; fi
          }
          need deps/wasm/lib/numpy-mod/libnpy__multiarray_umath.a "numpy _multiarray_umath"
          need deps/wasm/lib/numpy-mod/libnpy__pocketfft_umath.a  "numpy _pocketfft_umath"
          need deps/wasm/lib/numpy-mod/libnpy__umath_linalg.a     "numpy _umath_linalg"
          need deps/wasm/lib/numpy-mod/libnpy_lapack_lite.a       "numpy lapack_lite"
          need deps/wasm/lib/kiwi-mod/libkiwi__cext.a             "kiwisolver _cext"
          need deps/wasm/lib/ctypes-mod/lib_ctypes.a              "_ctypes"
          need deps/wasm/lib/libffi.a                             "libffi"
          need deps/wasm/lib/pil-mod/libpil__imaging.a            "PIL _imaging"
          n=$(ls -1 deps/wasm/lib/mpl-mod/*.a 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -ge 8 ]; then echo "  ok       matplotlib ($n archives)"
          else echo "::error::matplotlib has $n archives, expected at least 8"; fail=1; fi
          exit $fail

      - name: What exists now
        if: always()
        run: |
          for d in numpy-mod mpl-mod kiwi-mod ctypes-mod pil-mod; do
            n=$(ls -1 deps/wasm/lib/$d/*.a 2>/dev/null | wc -l | tr -d ' ')
            echo "  deps/wasm/lib/$d: $n archive(s)"
          done
          echo '--- PyInit_* symbols actually present ---'
          . emsdk/emsdk_env.sh 2>/dev/null || true
          for a in deps/wasm/lib/*/*.a; do
            [ -e "$a" ] || continue
            syms=$(emsdk/upstream/bin/llvm-nm "$a" 2>/dev/null | grep -c ' T PyInit' || true)
            [ "$syms" != 0 ] && echo "  ${a#deps/wasm/lib/}: $syms PyInit"
          done | sort

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pydeps-logs
          path: |
            build-numpy/meson-logs
          if-no-files-found: ignore
          retention-days: 14

      # always(), not success(). The gate is meant to REPORT what is missing, not to throw
      # away the lanes that worked -- numpy alone is 19 archives and a long build, and
      # discarding it because _ctypes needs libtool would make every iteration pay for it
      # again. Partial progress is exactly what is worth caching here.
      - name: Save the Python extension libraries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/wasm/lib/numpy-mod
            deps/wasm/lib/mpl-mod
            deps/wasm/lib/kiwi-mod
            deps/wasm/lib/ctypes-mod
            deps/wasm/lib/pil-mod
            deps/wasm/lib/libffi.a
            deps/src/cpython
            deps/src/numpy
            build-numpy
          key: fcweb-pydeps-${{ env.PYDEPS_KEY }}-${{ hashFiles('configure-numpy.sh', 'configure-kiwisolver-weh.sh', 'configure-matplotlib-weh.sh', 'configure-ctypes.sh', 'configure-pillow.sh', 'patches/numpy.patch', '*.meson.in') }}
