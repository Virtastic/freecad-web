name: build the Python extension libraries (wasm)

# The FreeCAD C++ compiles clean (2676/2676) but does not LINK, and this is most of what
# stands between the two. MainGui.cpp's inittab registers builtin modules whose archives
# have to exist at link time:
#
#   numpy._core._multiarray_umath, numpy.fft._pocketfft_umath,
#   numpy.linalg._umath_linalg, numpy.linalg.lapack_lite   -> deps/wasm/lib/numpy-mod
#   matplotlib.* (8 extensions)                            -> deps/wasm/lib/mpl-mod
#   kiwisolver._cext                                       -> deps/wasm/lib/kiwi-mod
#   _ctypes                                                -> deps/wasm/lib/ctypes-mod
#   PIL._imaging                                           -> deps/wasm/lib/pil-mod
#
# The link is run with -sERROR_ON_UNDEFINED_SYMBOLS=0, so a missing archive does NOT fail
# the build -- it produces a binary whose PyInit_* is a trapping stub and whose `import
# numpy` dies in the browser. That is exactly the failure mode this repository keeps
# getting caught by, so every lane below asserts its own output.
#
# Separate from build-deps.yml on purpose: these need the CPython BUILD TREE
# (deps/src/cpython/builddir), not the staged libpython3.13.a, and rebuilding the whole
# C++ stack to add a Python extension would be absurd. Own cache, own key.

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "which lanes to build (space separated, or 'all')"
        type: string
        default: "all"
      rebuild:
        description: "ignore the cache and rebuild"
        type: boolean
        default: false
  push:
    branches: [freecad-1.1.3]
    paths:
      - '.github/workflows/build-python-deps.yml'
      - 'configure-numpy.sh'
      - 'configure-kiwisolver-weh.sh'
      - 'configure-matplotlib-weh.sh'
      - 'configure-ctypes.sh'
      - 'configure-pillow.sh'
      - 'emscripten-crossfile.meson.in'
      - 'matplotlib-crossfile.meson.in'
      - 'configure-pivy-weh.sh'
      - 'configure-ifcopenshell-weh.sh'
      - 'build-shiboken-host.sh'
      - 'rebuild-pyside-weh.sh'
      - 'force-static.cmake'
      - 'build-cpython.sh'
      - 'build-cpython-mt.sh'
      - 'patches/apply.sh'
      - 'tools/**'
      # the cmake shims decide whether Coin, ICU and OpenGL are found at all
      - 'toolchain/**'

permissions:
  contents: read

env:
  PYDEPS_KEY: v1-emsdk3.1.70-cpython3.13.3-numpy2.1.3-mpl3.9.2

jobs:
  pydeps:
    timeout-minutes: 360
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the Python extension libraries
        id: pycache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/wasm/lib/numpy-mod
            deps/wasm/lib/mpl-mod
            deps/wasm/lib/kiwi-mod
            deps/wasm/lib/ctypes-mod
            deps/wasm/lib/pil-mod
            deps/wasm/lib/libffi.a
            deps/src/cpython
            deps/src/numpy
            deps/src/pivy
            deps/src/ifcopenshell
            deps/src/pyside-setup
            deps/src/eigen
            build-numpy
            build-pivy-wasm
            build-ifcopenshell
            deps/host/shiboken6
            deps/host/llvm-18.1.8
            deps/wasm/pyside-pkg
          key: fcweb-pydeps-${{ env.PYDEPS_KEY }}-${{ hashFiles('configure-numpy.sh', 'configure-kiwisolver-weh.sh', 'configure-matplotlib-weh.sh', 'configure-ctypes.sh', 'configure-pillow.sh', 'patches/numpy.patch', '*.meson.in') }}
          restore-keys: |
            fcweb-pydeps-${{ env.PYDEPS_KEY }}-

      # CPython gets its OWN cache, keyed only on the scripts that build it, and saved
      # even when a later lane fails. Sharing the pydeps key meant every numpy fix
      # invalidated the CPython build too -- and since the pydeps cache only saves on full
      # success, three failed numpy attempts cost three 25-minute CPython rebuilds for a
      # tree that had not changed.
      # pivy needs Coin3D and the force-included headers from the C++ stack, so restore
      # that cache too. Prefix key: build-deps.yml hashes its own scripts into the full
      # key, and none of that is anything this workflow changes.
      - name: Restore the C++ dependency stack
        id: depcache
        uses: actions/cache/restore@v4
        with:
          path: deps/wasm
          key: fcweb-deps-v1-emsdk3.1.70-pydeps-consumer
          restore-keys: |
            fcweb-deps-v1-emsdk3.1.70-

      - name: Restore CPython build tree
        id: cpycache
        uses: actions/cache/restore@v4
        with:
          path: deps/src/cpython
          key: fcweb-cpython-3.13.3-emsdk3.1.70-${{ hashFiles('build-cpython.sh', 'build-cpython-mt.sh', 'patches/cpython-ctypes-wasm.patch') }}

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.70-shims-v1

      - name: Install emsdk 3.1.70
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 3.1.70 && ./emsdk activate 3.1.70

      # The VPS system Python is 3.14 and ships no ensurepip, so `python3 -m venv` fails
      # outright ("you need to install the python3.14-venv package"), and there is no root
      # here to install it with. setup-python brings its own complete interpreter -- and at
      # 3.13, which matches the CPython being cross-compiled rather than sitting a version
      # ahead of it.
      - name: Host Python 3.13
        id: hostpy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # meson and ninja drive every lane. The build machine keeps them in .qtvenv, which
      # these scripts source when it exists; make the same thing here so they need no
      # special-casing for CI.
      - name: Build tools (meson, ninja, pybind11, setuptools)
        run: |
          set -e
          '${{ steps.hostpy.outputs.python-path }}' -m venv .qtvenv
          . .qtvenv/bin/activate
          python -m pip install --quiet --upgrade pip
          # cython: numpy's meson.build declares it as a compiler, so meson refuses to configure
          # without it -- "Unknown compiler(s): [['cython'], ['cython3']]". cppy is
          # kiwisolver's build dependency.
          # swig is PINNED. Whatever happens to be on the runner was 4.4.1, and IfcOpenShell
          # 0.8's SWIG interfaces do not compile against it:
          #   error: calling a private constructor of class 'SwigValueWrapper<OpaqueCoordinate<3>>'
          #   ConversionResult.h:205: static assertion failed: Incorrect number of arguments
          # 4.2.1 is what IfcOpenShell 0.8 is developed against, and pivy 0.6.9 only requires
          # >= 4.0, so one version serves both lanes. An unpinned host tool deciding whether
          # the build works is the same defect class as the unversioned deps/ trees.
          python -m pip install --quiet meson ninja pybind11 setuptools wheel cppy cython 'swig==4.2.1'
          echo "  swig $(swig -version 2>/dev/null | grep -i 'SWIG Version' | head -1)"
          echo "  python $(python -V), meson $(meson --version), ninja $(ninja --version)"

      # libffi is the one lane that still uses autotools: configure-ctypes.sh clones
      # hoodmane/libffi-emscripten and runs ./autogen.sh, which needs libtool's m4 macros.
      # Without them autoreconf stops at
      #   configure.ac:219: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
      # Try to install them; if there is no sudo here, say so plainly -- that is a
      # provisioning fact about the box, not a mystery about the build.
      - name: autotools for libffi
        continue-on-error: true
        run: |
          if command -v libtoolize >/dev/null 2>&1 && [ -e /usr/share/aclocal/libtool.m4 ]; then
            echo "  libtool already present"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq libtool automake autoconf
            echo "  installed libtool/automake/autoconf"
          else
            echo "::warning::no libtool and no passwordless sudo on this runner."
            echo "  libffi (and therefore _ctypes) cannot be autoreconf'd here."
            echo "  Provision once with: sudo apt-get install -y libtool automake autoconf"
          fi

      - name: Fetch sources
        run: |
          set -e
          mkdir -p deps/src
          # A failed fetch must not take the whole job down. One bad URL used to abort here,
          # skipping every lane -- including ones whose archives were already cached and
          # needed no source at all. Record the failure, keep going, and let each lane fail
          # on its own if it actually needed that tree.
          fetch_failed=""
          get() {  # get <dir> <url> <strip> <marker>
            if [ -e "deps/src/$1/$4" ]; then echo "  $1: present"; return 0; fi
            echo "  $1: fetching"
            mkdir -p "deps/src/$1"
            if ! curl -fsSL -o /tmp/s.tar.gz "$2"; then
              echo "::warning::$1: fetch failed -- $2"
              fetch_failed="$fetch_failed $1"
              return 0
            fi
            tar xf /tmp/s.tar.gz -C "deps/src/$1" --strip-components="$3" || {
              echo "::warning::$1: tarball did not extract"
              fetch_failed="$fetch_failed $1"
              return 0
            }
            [ -e "deps/src/$1/$4" ] || {
              echo "::warning::$1: extracted but $4 is missing -- wrong --strip-components?"
              fetch_failed="$fetch_failed $1"
            }
          }
          get cpython https://github.com/python/cpython/archive/refs/tags/v3.13.3.tar.gz 1 configure
          get numpy   https://github.com/numpy/numpy/releases/download/v2.1.3/numpy-2.1.3.tar.gz 1 meson.build
          get kiwisolver https://github.com/nucleic/kiwi/archive/refs/tags/1.4.7.tar.gz 1 py/src/kiwisolver.cpp
          get Pillow     https://github.com/python-pillow/Pillow/archive/refs/tags/10.4.0.tar.gz 1 src/_imaging.c
          get matplotlib https://github.com/matplotlib/matplotlib/archive/refs/tags/v3.9.2.tar.gz 1 meson.build
          get pivy       https://github.com/coin3d/pivy/archive/refs/tags/0.6.9.tar.gz 1 CMakeLists.txt
          # IfcOpenShell has no 0.8.x TAG -- 0.8 lives on the 0.8.0 branch, and "0.8.6" is the
          # Python package version built from it. Pinned to a commit rather than the branch head,
          # because a moving head is exactly the unreproducibility BUILD-WEH.md opens with.
          # 481676e5 is 0.8.0 as of 2025-11-21.
          get ifcopenshell https://github.com/IfcOpenShell/IfcOpenShell/archive/481676e51b65cb93e520b9f073123f22a06b212b.tar.gz 1 cmake/CMakeLists.txt
          get pyside-setup https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.9.0-src/pyside-setup-everywhere-src-6.9.0.tar.xz 1 sources/pyside6/cmake/Macros/PySideModules.cmake
          # src/svgfill is a SUBMODULE, and GitHub tarballs carry no submodules -- the same
          # fact that keeps Assembly and AddonManager out of the FreeCAD build. The Python
          # wrapper needs it unconditionally: IfcPython.i includes svgfill.h outside the
          # IFOPSH_WITH_CGAL guard, and IfcGeomWrapper.i declares %template over svgfill::
          # types, so WITH_CGAL=OFF does not avoid it. ba09c29b is the commit IfcOpenShell
          # pins at 481676e5.
          if [ ! -e deps/src/ifcopenshell/src/svgfill/src/svgfill.h ]; then
            echo "  svgfill: fetching (submodule of ifcopenshell)"
            mkdir -p deps/src/ifcopenshell/src/svgfill
            if curl -fsSL -o /tmp/svgfill.tar.gz \
                 https://github.com/IfcOpenShell/svgfill/archive/ba09c29b81325c27d77cd41be84d7e84c9c06f5b.tar.gz; then
              tar xf /tmp/svgfill.tar.gz -C deps/src/ifcopenshell/src/svgfill --strip-components=1
              [ -e deps/src/ifcopenshell/src/svgfill/src/svgfill.h ] \
                || echo "::warning::svgfill extracted but src/svgfill.h is missing"
            else
              echo "::warning::svgfill: fetch failed"
              fetch_failed="$fetch_failed svgfill"
            fi
          else
            echo "  svgfill: present"
          fi
          # IfcGeom includes <Eigen/Dense>; header-only, never staged into deps/wasm.
          get eigen https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz 1 Eigen/Dense

          [ -z "$fetch_failed" ] || echo "::warning::sources not fetched:$fetch_failed"

      - name: Apply the source patches
        run: |
          set -e
          FCWEB_PATCH_OPTIONAL=1 bash patches/apply.sh

      # numpy's code generators run on the host interpreter, and the meson cross-file points
      # at CPython's own build of it -- not the system python, whose version would not match
      # the wasm headers.
      - name: CPython 3.13.3 (host + wasm/pthreads)
        id: cpython
        run: |
          set -e
          . emsdk/emsdk_env.sh
          if [ -e deps/src/cpython/builddir/emscripten-mt/libpython3.13.a ] \
             && [ -e deps/src/cpython/builddir/build/python3-native ]; then
            echo "  cpython: already built (cache hit)"
            exit 0
          fi
          t0=$SECONDS
          bash build-cpython.sh
          bash build-cpython-mt.sh
          echo "  cpython built in $((SECONDS-t0))s"
          # The cross-file names python3-native specifically; CPython does not always
          # create it, and meson mono-wraps the .exe name if we point at that instead.
          cd deps/src/cpython/builddir/build
          if [ ! -e python3-native ]; then
            for c in python python.exe python3; do
              [ -x "$c" ] && ln -sf "$c" python3-native && break
            done
          fi
          ls -la python3-native

      - name: Save CPython build tree
        if: always() && steps.cpycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/src/cpython
          key: fcweb-cpython-3.13.3-emsdk3.1.70-${{ hashFiles('build-cpython.sh', 'build-cpython-mt.sh', 'patches/cpython-ctypes-wasm.patch') }}

      # PySide needs BOTH Qts: the wasm one this repo builds, and a host one for the
      # tools (moc, rcc, qmake) that run during the cross-build. build-qt-wasm.yml caches
      # the first and installs the second with aqt; do the same rather than rebuild Qt.
      - name: Restore Qt (wasm)
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: qt/6.9.0/wasm_mt_weh
          key: fcweb-qt-6.9.0-wasm-eh-jspi-mt-emsdk3.1.70-v2

      - name: Host Qt 6.9.0 (tools only)
        continue-on-error: true
        run: |
          set -e
          if [ -x qt-host/6.9.0/gcc_64/bin/moc ]; then echo "  host Qt present"; exit 0; fi
          . .qtvenv/bin/activate
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt linux desktop 6.9.0 linux_gcc_64 -m qtshadertools -O "$PWD/qt-host"
          ls qt-host/6.9.0/gcc_64/bin/moc && echo "  host Qt installed"


      - name: numpy
        id: lane_numpy
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ -s deps/wasm/lib/numpy-mod/libnpy__multiarray_umath.a ] && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  numpy: already built (cache hit)"
            exit 0
          fi
          bash configure-numpy.sh

      # Each lane checks its own product rather than its own exit status. The link runs
      # with -sERROR_ON_UNDEFINED_SYMBOLS=0, so an archive that never got built becomes a
      # trapping PyInit_* at run time instead of an error at build time.
      - name: kiwisolver (matplotlib layout dependency)
        id: lane_kiwisolver
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/kiwi-mod/libkiwi__cext.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-kiwisolver-weh.sh
          else
            echo "  kiwisolver: already built"
          fi
          [ -s deps/wasm/lib/kiwi-mod/libkiwi__cext.a ]             || { echo "::error::kiwi-mod/libkiwi__cext.a not produced"; exit 1; }

      - name: _ctypes (+ libffi)
        id: lane_ctypes
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/ctypes-mod/lib_ctypes.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-ctypes.sh
          else
            echo "  _ctypes: already built"
          fi
          [ -s deps/wasm/lib/ctypes-mod/lib_ctypes.a ]             || { echo "::error::ctypes-mod/lib_ctypes.a not produced"; exit 1; }
          [ -s deps/wasm/lib/libffi.a ] || { echo "::error::libffi.a not produced"; exit 1; }

      - name: Pillow _imaging
        id: lane_pillow
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/pil-mod/libpil__imaging.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-pillow.sh
          else
            echo "  Pillow: already built"
          fi
          [ -s deps/wasm/lib/pil-mod/libpil__imaging.a ]             || { echo "::error::pil-mod/libpil__imaging.a not produced"; exit 1; }

      # Last, because it reaches into build-numpy for numpy's generated headers.
      # matplotlib builds freetype and qhull as meson subprojects, and meson fetches
      # freetype 2.6.1 from savannah's "freetype-old" path, which is currently answering
      # 502 on every retry. meson checks the packagecache first and verifies the hash from
      # the .wrap, so seeding it from a mirror that serves the identical tarball is safe --
      # a wrong file fails the hash rather than building something unexpected.
      - name: Pre-seed the meson subproject downloads
        continue-on-error: true
        run: |
          set -e
          cache=deps/src/matplotlib/subprojects/packagecache
          mkdir -p "$cache"
          want=$(ls deps/src/matplotlib/subprojects/*.wrap 2>/dev/null | head -20)
          echo "  wraps: $(echo "$want" | wc -l | tr -d ' ')"
          if [ ! -s "$cache/freetype-2.6.1.tar.gz" ]; then
            for u in               "https://downloads.sourceforge.net/project/freetype/freetype2/2.6.1/freetype-2.6.1.tar.gz"               "https://download.savannah.gnu.org/releases/freetype/freetype-2.6.1.tar.gz"               "https://mirrors.dotsrc.org/nongnu/freetype/freetype-2.6.1.tar.gz"; do
              echo "  trying $u"
              if curl -fsSL --max-time 120 -o "$cache/freetype-2.6.1.tar.gz" "$u"; then
                echo "  got freetype-2.6.1.tar.gz ($(stat -c%s "$cache/freetype-2.6.1.tar.gz") bytes)"
                break
              fi
              rm -f "$cache/freetype-2.6.1.tar.gz"
            done
          else
            echo "  freetype tarball already cached"
          fi
          # Report the expected hash next to what we fetched, so a mismatch is obvious in
          # the log rather than surfacing later as a confusing meson error.
          grep -h -A1 'source_filename *= *freetype' deps/src/matplotlib/subprojects/*.wrap 2>/dev/null | sed 's/^/    /' || true
          [ -s "$cache/freetype-2.6.1.tar.gz" ] && sha256sum "$cache/freetype-2.6.1.tar.gz" | sed 's/^/    got  /' || true

      - name: matplotlib
        id: lane_matplotlib
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ ! -s deps/wasm/lib/mpl-mod/libmpl__backend_agg.a ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            bash configure-matplotlib-weh.sh
          else
            echo "  matplotlib: already built"
          fi
          n=$(ls -1 deps/wasm/lib/mpl-mod/*.a 2>/dev/null | wc -l | tr -d ' ')
          echo "  mpl-mod: $n archives"
          # 8 extensions + freetype/qhull/agg/ttconv. The darwin-only glob this script used
          # to have produced an empty directory and a silently crippled link.
          [ "$n" -ge 8 ] || { echo "::error::mpl-mod has $n archives, expected at least 8"; exit 1; }

      # IfcOpenShell: real IFC for the BIM workbench, built against OUR wasm OCCT 7.8.1 --
      # the version match matters, since it links OCCT's geometry kernel directly.
      - name: IfcOpenShell (_ifcopenshell_wrapper)
        id: lane_ifc
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          if [ -s deps/wasm/lib/ifc-mod/lib_ifcopenshell_wrapper.a ] && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  IfcOpenShell: already built"; exit 0
          fi
          bash configure-ifcopenshell-weh.sh

      # shiboken's GENERATOR runs on the host and parses Qt's headers with libclang. It
      # has never been built anywhere but the build machine, where deps/host/shiboken6
      # already existed. build-shiboken-host.sh reports every place it looks for libclang,
      # so a failure here says which, rather than dying inside cmake.
      - name: shiboken generator (host)
        id: lane_shiboken_host
        continue-on-error: true
        run: |
          set -e
          # also require the .llvm-prefix marker: a generator built before it existed will
          # search for clang builtins on its own and silently emit nothing.
          # The generator must have been built against LLVM 20: emsdk 3.1.70 ships clang 20,
          # and an older libclang cannot parse its sysroot however it is configured. A
          # cached 17.0.6 generator would skip this step and fail identically later.
          if [ -x deps/host/shiboken6/bin/shiboken6 ] \n             && grep -q "llvm-20" deps/host/shiboken6/.llvm-prefix 2>/dev/null \n             && [ -s deps/host/shiboken6/.builtin-includes-skippable ] \n             && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  host shiboken: already built"; exit 0
          fi
          # MEASURED: libclang must match the resource dir it is given, which is emsdk's
          # clang 20. libclang 19 against clang-20 headers gives 126 stddef/nullptr_t
          # errors -- the same as no override at all -- while libclang 20 against them
          # parses <cstddef> cleanly and reaches deep into libc++. Version MATCHING is
          # the rule, not a particular older release.
          export FCWEB_LLVM_VERSION=20.1.8
          bash build-shiboken-host.sh

      # PySide/shiboken for wasm -> deps/wasm/pyside-pkg, which the link preloads.
      - name: PySide + shiboken (wasm)
        id: lane_pyside
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          if [ -d deps/wasm/pyside-pkg ] && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  pyside: already built"; exit 0
          fi
          if [ ! -x deps/host/shiboken6/bin/shiboken6 ]; then
            echo "::warning::no host shiboken -- skipping the wasm PySide build"
            exit 0
          fi
          # Measured, not guessed. With libclang 20 and -resource-dir pointing at emsdk's
          # clang 20, the <cstddef> failure disappears and the parse reaches deep into
          # libc++ (unique_ptr.h). WITHOUT it the same run produces 126 stddef/nullptr_t
          # errors. So the override helps; it is simply not sufficient on its own.
          # clang -v showed shiboken ALWAYS injects a clang builtins directory ahead of
          # the compiler-discovered paths -- CLANG_INSTALL_DIR only chose WHICH one, and
          # with it unset the distro's llvm-21 takes the slot. libc++'s <cstddef>
          # requires <stddef.h> to resolve to libc++'s own copy, so a C stddef.h in
          # front of it breaks every header after.
          #
          # shiboken's OWN --include-paths entries come first of all, so putting
          # libc++ there beats the injected directory.
          # LIBCXX_FIRST sets the variable (and is still needed for it); ISYSTEM is what
          # actually places libc++ ahead of the injected builtins. --include-paths alone
          # does not: clang drops a normal include dir that duplicates a system dir and
          # keeps the system position, so libc++ was searched 8th despite being 1st on
          # the command line.
          export FCWEB_SHIBOKEN_LIBCXX_FIRST=1
          export FCWEB_SHIBOKEN_LIBCXX_ISYSTEM=1
          export FCWEB_SHIBOKEN_VERBOSE=1   # keep -v: it is how this was found
          bash rebuild-pyside-weh.sh


      # One gate at the end, so a single broken lane does not hide the state of the
      # others. Every archive named here is one MainGui.cpp registers in its inittab; a
      # missing one is a trapping PyInit_* in the browser, not a link error.
      # pivy: the SWIG Coin3D bindings, registered by MainGui.cpp as the builtin `_coin`.
      # Needs the staged compat headers, so stage them from toolchain/include first --
      # forcing the tracked copies over whatever a restored cache happens to hold, for the
      # same reason build-deps.yml does.
      - name: pivy (_coin)
        id: lane_pivy
        continue-on-error: true
        run: |
          set -e
          . emsdk/emsdk_env.sh
          . .qtvenv/bin/activate
          if [ -s deps/wasm/lib/pivy-mod/lib_coin.a ] && [ "${{ inputs.rebuild }}" != "true" ]; then
            echo "  pivy: already built"; exit 0
          fi
          FCWEB_FORCE_STAGE_HEADERS=1 bash toolchain/stage-headers.sh
          bash configure-pivy-weh.sh

      - name: Gate -- every archive the link needs
        run: |
          fail=0
          need() {
            if [ -s "$1" ]; then echo "  ok       $2"; else echo "::error::missing $2 ($1)"; fail=1; fi
          }
          need deps/wasm/lib/numpy-mod/libnpy__multiarray_umath.a "numpy _multiarray_umath"
          need deps/wasm/lib/numpy-mod/libnpy__pocketfft_umath.a  "numpy _pocketfft_umath"
          need deps/wasm/lib/numpy-mod/libnpy__umath_linalg.a     "numpy _umath_linalg"
          need deps/wasm/lib/numpy-mod/libnpy_lapack_lite.a       "numpy lapack_lite"
          need deps/wasm/lib/kiwi-mod/libkiwi__cext.a             "kiwisolver _cext"
          need deps/wasm/lib/ctypes-mod/lib_ctypes.a              "_ctypes"
          need deps/wasm/lib/libffi.a                             "libffi"
          need deps/wasm/lib/pil-mod/libpil__imaging.a            "PIL _imaging"
          need deps/wasm/lib/pivy-mod/lib_coin.a                  "pivy _coin"
          need deps/wasm/lib/ifc-mod/lib_ifcopenshell_wrapper.a   "IfcOpenShell wrapper"
          n=$(ls -1 deps/wasm/lib/mpl-mod/*.a 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -ge 8 ]; then echo "  ok       matplotlib ($n archives)"
          else echo "::error::matplotlib has $n archives, expected at least 8"; fail=1; fi
          exit $fail

      - name: What exists now
        if: always()
        run: |
          for d in numpy-mod mpl-mod kiwi-mod ctypes-mod pil-mod; do
            n=$(ls -1 deps/wasm/lib/$d/*.a 2>/dev/null | wc -l | tr -d ' ')
            echo "  deps/wasm/lib/$d: $n archive(s)"
          done
          echo '--- PyInit_* symbols actually present ---'
          . emsdk/emsdk_env.sh 2>/dev/null || true
          for a in deps/wasm/lib/*/*.a; do
            [ -e "$a" ] || continue
            syms=$(emsdk/upstream/bin/llvm-nm "$a" 2>/dev/null | grep -c ' T PyInit' || true)
            [ "$syms" != 0 ] && echo "  ${a#deps/wasm/lib/}: $syms PyInit"
          done | sort

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pydeps-logs
          path: |
            build-numpy/meson-logs
          if-no-files-found: ignore
          retention-days: 14

      # always(), not success(). The gate is meant to REPORT what is missing, not to throw
      # away the lanes that worked -- numpy alone is 19 archives and a long build, and
      # discarding it because _ctypes needs libtool would make every iteration pay for it
      # again. Partial progress is exactly what is worth caching here.
      - name: Save the Python extension libraries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/wasm/lib/numpy-mod
            deps/wasm/lib/mpl-mod
            deps/wasm/lib/kiwi-mod
            deps/wasm/lib/ctypes-mod
            deps/wasm/lib/pil-mod
            deps/wasm/lib/libffi.a
            deps/src/cpython
            deps/src/numpy
            deps/src/pivy
            deps/src/ifcopenshell
            deps/src/pyside-setup
            deps/src/eigen
            build-numpy
            build-pivy-wasm
            build-ifcopenshell
            deps/host/shiboken6
            deps/host/llvm-18.1.8
            deps/wasm/pyside-pkg
          key: fcweb-pydeps-${{ env.PYDEPS_KEY }}-${{ hashFiles('configure-numpy.sh', 'configure-kiwisolver-weh.sh', 'configure-matplotlib-weh.sh', 'configure-ctypes.sh', 'configure-pillow.sh', 'patches/numpy.patch', '*.meson.in') }}
