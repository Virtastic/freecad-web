# nginx config baked into the freecad-wasm image. Listens on plain HTTP:80; the shared
# reverse proxy (Traefik) and Cloudflare handle TLS. server_name is a catch-all because the
# proxy has already routed this request to this container by Host.
# FreeCAD.data is a 341 MB filesystem image and is the single biggest thing a first-time
# visitor downloads. Cloudflare compresses the .wasm and .js at the edge but NOT this one
# (its content type is not in the edge's compressible set), so it went over the wire raw.
# It gzips to 83 MB, so a pre-compressed copy is baked into the image (see infra/Dockerfile)
# and served to anything that accepts gzip -- which is every browser.
map $http_accept_encoding $fcdata_suffix {
    default   "";
    "~*gzip"  ".gz";
}
map $http_accept_encoding $fcdata_encoding {
    default   "";       # nginx omits an add_header whose value is empty
    "~*gzip"  "gzip";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index freecad-gui.html;

    # Cross-origin isolation on EVERY response. FreeCAD is a Qt multi-thread wasm build;
    # without SharedArrayBuffer (which requires COOP+COEP) it will not boot. Set here so it
    # holds regardless of the shared proxy's config.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Compress text at the origin. The .wasm and .js are compressed by Cloudflare at the
    # edge; .data is NOT (the edge does not compress its content type), which is why the
    # pre-compressed copy below exists.
    gzip on;
    gzip_types application/javascript text/css image/svg+xml; # text/html is gzipped by default
    # NB: nginx 1.27's mime.types already maps .wasm -> application/wasm. Do NOT add a bare
    # `types {}` block here — it REPLACES the whole map and breaks text/html etc.

    # Landing page.
    location = / { try_files /freecad-gui.html =404; }

    # Immutable build artifacts (152MB wasm + 341MB data): cache hard at Cloudflare + browser.
    # Publish a new GitHub Release (new image) on each engine redeploy, then purge Cloudflare.
    location ~* \.(wasm|data|js)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # NOT "always": that applies the header to error responses too, so a 404 for an
        # artifact that has not been deployed yet gets cached at the edge for a year.
        # (That happened to ccx.js: probed before its first deploy, then stuck at 404.)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Must come before the artifact regex below (exact match wins in nginx regardless,
    # but keep them adjacent). add_header at this level cancels inheritance of the ones
    # above, so every header the artifacts need is repeated here.
    # Cloudflare refuses to cache /FreeCAD.data (cf-cache-status: DYNAMIC every time, so
    # all 83 MB comes off this box for every cold visitor) but it does cache a .gz path --
    # verified MISS then HIT. The page asks for this URL via Module.locateFile; the bytes
    # are the same pre-compressed file, just named so the edge will keep it.
    location = /FreeCAD.data.gz {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Encoding gzip;
        add_header Vary "Accept-Encoding";
        default_type application/octet-stream;
        try_files /FreeCAD.data.gz =404;
    }

    location = /FreeCAD.data {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Encoding $fcdata_encoding;
        add_header Vary "Accept-Encoding";
        # No fallback to the raw file on purpose: Content-Encoding is already set from
        # the request, so serving the uncompressed copy under it would hand the browser
        # raw bytes labelled gzip. The Dockerfile makes the .gz and fails if it is absent.
        try_files /FreeCAD.data$fcdata_suffix =404;
    }

    location / { try_files $uri $uri/ =404; }
}
