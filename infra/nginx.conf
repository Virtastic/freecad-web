# nginx config baked into the freecad-web image. Listens on plain HTTP:80; the shared
# reverse proxy (Traefik) and Cloudflare handle TLS. server_name is a catch-all because the
# proxy has already routed this request to this container by Host.
# FreeCAD.data is a 341 MB filesystem image and is the single biggest thing a first-time
# visitor downloads. Cloudflare compresses the .wasm and .js at the edge but NOT this one
# (its content type is not in the edge's compressible set), so it went over the wire raw.
# It gzips to 83 MB, so a pre-compressed copy is baked into the image (see infra/Dockerfile)
# and served to anything that accepts gzip -- which is every browser.
map $http_accept_encoding $fcdata_suffix {
    default   "";
    "~*gzip"  ".gz";
}
map $http_accept_encoding $fcdata_encoding {
    default   "";       # nginx omits an add_header whose value is empty
    "~*gzip"  "gzip";
}

# Anonymous event counters. Before this, a failure died in the user's tab: there was no way
# to know what fraction of visitors never reach Ready, or how often the 2 GB heap aborts.
#
# Deliberately NOT a backend. The events are enumerated values in a query string, and nginx
# already has a logger -- so the whole "telemetry pipeline" is one log_format and a location
# returning 204. No app server, no third-party SDK (which cross-origin isolation would fight
# anyway), and nothing to keep patched.
#
# PRIVACY: what is recorded is exactly these fields and nothing else. No IP (deliberately
# absent from the format), no document names, no free text, no identifier of any kind, and
# no cookie. $arg_e and $arg_k are validated against an allowlist below before logging, so a
# crafted request cannot inject arbitrary strings into the log.
log_format fcweb_events '$time_iso8601 e=$arg_e k=$arg_k ms=$arg_ms b=$arg_b ua=$http_user_agent';

# Only known event/kind values are recorded; anything else logs as "other".
map $arg_e $fcweb_event_ok {
    default            "other";
    "boot_start"       "boot_start";
    "boot_ready"       "boot_ready";
    "boot_gate"        "boot_gate";
    "abort"            "abort";
}

# ---- Outbound HTTP -------------------------------------------------------------------
# The app is cross-origin isolated (COOP+COEP) because a -pthread wasm build needs
# SharedArrayBuffer. Under COEP:require-corp the browser refuses any cross-origin response
# that does not carry CORP, and almost no third-party host sends it -- so from inside the
# page, the rest of the web is unreachable. That is what stops the Addon Manager, the
# documentation links and anything else that needs to fetch.
#
# This proxies those requests through our own origin, where the response is same-origin and
# COEP is satisfied.
#
# It is deliberately NOT an open proxy. There is no ?url= parameter, because this container
# runs on the same box as everything else we operate: an open fetcher here is a hole
# straight into the internal network. Instead each allowed destination gets a fixed key
# below, and a request that does not match one is refused. Adding a destination is a
# one-line change and a deploy, which is the correct amount of friction.
map $fcproxy_key $fcproxy_host {
    default     "";                                 # unknown key -> refused
    "github"    "github.com";
    "api"       "api.github.com";
    "codeload"  "codeload.github.com";              # source zips
    "raw"       "raw.githubusercontent.com";        # addon index, icons
    "objects"   "objects.githubusercontent.com";    # where release assets redirect to
    "wiki"      "wiki.freecad.org";
    "docs"      "freecad.org";
}

# A page that can drive fetches is a page that can be used to hammer someone else. Ten a
# second with a burst is far more than the Addon Manager needs and far less than anything
# worth complaining about.
limit_req_zone $binary_remote_addr zone=fcproxy:1m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index freecad-gui.html;

    # /proxy/<key>/<path> -> https://<host-for-key>/<path>
    location ~ ^/proxy/([a-z]+)/(.*)$ {
        set $fcproxy_key $1;
        set $fcproxy_path $2;
        if ($fcproxy_host = "") { return 403 "proxy: destination not allowed\n"; }
        # Only reads. A page should not be able to POST through our origin to anyone.
        limit_except GET HEAD { deny all; }
        limit_req zone=fcproxy burst=20 nodelay;

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://$fcproxy_host/$fcproxy_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $fcproxy_host;
        # Never forward the user's credentials or ours to a third party.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        client_max_body_size 1m;

        # GitHub answers a download with a redirect to another host. Rewrite the ones we
        # allow back through this proxy, so the browser stays same-origin the whole way.
        proxy_redirect https://objects.githubusercontent.com/ /proxy/objects/;
        proxy_redirect https://codeload.github.com/          /proxy/codeload/;
        proxy_redirect https://raw.githubusercontent.com/    /proxy/raw/;

        # Same-origin to the page, so COEP is satisfied; say so explicitly rather than
        # relying on the server-wide header below.
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Fcweb-Proxy "$fcproxy_host" always;
    }

    # Event sink. Returns 204 with no body and no cache, so a beacon costs the client
    # nothing. Logged to its own file on a volume so it survives the container being
    # recreated on every deploy -- the default access log would not.
    location = /t {
        access_log /var/log/fcweb/events.log fcweb_events;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Cross-origin isolation on EVERY response. FreeCAD is a Qt multi-thread wasm build;
    # without SharedArrayBuffer (which requires COOP+COEP) it will not boot. Set here so it
    # holds regardless of the shared proxy's config.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Compress text at the origin. The .wasm and .js are compressed by Cloudflare at the
    # edge; .data is NOT (the edge does not compress its content type), which is why the
    # pre-compressed copy below exists.
    gzip on;
    gzip_types application/javascript text/css image/svg+xml; # text/html is gzipped by default
    # NB: nginx 1.27's mime.types already maps .wasm -> application/wasm. Do NOT add a bare
    # `types {}` block here — it REPLACES the whole map and breaks text/html etc.

    # Landing page. MUST revalidate: with no Cache-Control at all the browser applies
    # heuristic caching from Last-Modified, and a returning visitor keeps running an old
    # page -- which is how a fix that was verifiably live still did not reach them. The
    # HTML is ~120 KB and every engine artifact it references is immutable and content
    # addressed, so revalidating it on each load costs a round trip and nothing else.
    location = / {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files /freecad-gui.html =404;
    }

    location = /freecad-gui.html {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files /freecad-gui.html =404;
    }

    # Immutable build artifacts (152MB wasm + 341MB data): cache hard at Cloudflare + browser.
    # Publish a new GitHub Release (new image) on each engine redeploy, then purge Cloudflare.
    location ~* \.(wasm|data|js)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        # NOT "always": that applies the header to error responses too, so a 404 for an
        # artifact that has not been deployed yet gets cached at the edge for a year.
        # (That happened to ccx.js: probed before its first deploy, then stuck at 404.)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Must come before the artifact regex below (exact match wins in nginx regardless,
    # but keep them adjacent). add_header at this level cancels inheritance of the ones
    # above, so every header the artifacts need is repeated here.
    # Cloudflare refuses to cache /FreeCAD.data (cf-cache-status: DYNAMIC every time, so
    # all 83 MB comes off this box for every cold visitor) but it does cache a .gz path --
    # verified MISS then HIT. The page asks for this URL via Module.locateFile; the bytes
    # are the same pre-compressed file, just named so the edge will keep it.
    location = /FreeCAD.data.gz {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Encoding gzip;
        add_header Vary "Accept-Encoding";
        default_type application/octet-stream;
        try_files /FreeCAD.data.gz =404;
    }

    location = /FreeCAD.data {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Encoding $fcdata_encoding;
        add_header Vary "Accept-Encoding";
        # No fallback to the raw file on purpose: Content-Encoding is already set from
        # the request, so serving the uncompressed copy under it would hand the browser
        # raw bytes labelled gzip. The Dockerfile makes the .gz and fails if it is absent.
        try_files /FreeCAD.data$fcdata_suffix =404;
    }

    # The service worker must never be cached hard: it is how the app is updated, and a
    # year-long immutable copy would pin a broken one forever. It also matches the .js
    # artifact rule above, which is exactly that -- so give it an exact location first.
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=3600";
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    location / { try_files $uri $uri/ =404; }
}
