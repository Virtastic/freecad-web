# freecad-wasm's slice of the shared box's stack. Drop this service into the box (or merge it
# into the box's compose project) so it joins the shared reverse-proxy network. The proxy
# routes Host -> this container:80; the container serves the COOP/COEP headers itself.
#
# Prereqs on the box (see openmw-wasm/infra/SHARED-BOX-SETUP.md): a reverse proxy (Traefik
# shown) attached to an external docker network named "proxy":  docker network create proxy
services:
  freecad:
    # Pull the prebuilt image published by CI:
    image: ghcr.io/virtastic/freecad-wasm:latest
    # ...or build locally instead of pulling (context is the repo root):
    # build:
    #   context: ..
    #   dockerfile: infra/Dockerfile
    restart: unless-stopped
    networks: [proxy]
    labels:
      # Watchtower auto-rolls the container when a new :latest is pushed to GHCR.
      - "com.centurylinklabs.watchtower.enable=true"
      # --- Traefik (label-based routing) ---
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.freecad.rule=Host(`freecad.virtastic.app`)"
      - "traefik.http.routers.freecad.entrypoints=websecure"
      - "traefik.http.routers.freecad.tls=true"
      - "traefik.http.services.freecad.loadbalancer.server.port=80"
    # --- Alternative: jwilder/nginx-proxy instead of Traefik ---
    # environment:
    #   VIRTUAL_HOST: freecad.virtastic.app
    #   VIRTUAL_PORT: "80"

networks:
  proxy:
    external: true
