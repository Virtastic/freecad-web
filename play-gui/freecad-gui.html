<!doctype html><html><head><meta charset="utf-8"><title>FreeCAD-Web</title><link rel="icon" href="/icon-192.png">
<!-- Build identity. infra/Dockerfile rewrites the placeholder at image build time with the
     release tag + short SHA. Without this a bug report cannot be tied to a build, which is
     why it is set here, before anything else, rather than somewhere convenient later. The
     literal below is what you see when running the page straight from a checkout. -->
<script>window.FCWEB_BUILD = "__FCWEB_BUILD__".indexOf("FCWEB_BUILD") >= 0 ? "dev" : "__FCWEB_BUILD__";
document.addEventListener('DOMContentLoaded', function(){
  var el = document.getElementById('buildstamp');
  if (el) el.textContent = ' · build ' + window.FCWEB_BUILD;
});</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2b2f36">
<!-- Without this a tablet renders the canvas at a fake 980px width and then scales it,
     so the UI is tiny and every hit-test is offset. user-scalable=no because the 3D view
     does its own pinch-zoom; letting the browser zoom the page too fights it. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
 html,body{margin:0;height:100%;background:#2b2b2b;color:#ddd;font:13px ui-monospace,Menlo,monospace;overflow:hidden}
 /* Qt fills the ENTIRE browser window. The boot log is an optional overlay, not
    a permanent strip, so FreeCAD gets the full viewport. */
 #screen{position:absolute;inset:0}
 #screen>canvas{width:100%;height:100%;display:block}
 #log{position:absolute;left:0;right:0;bottom:0;height:170px;overflow:auto;white-space:pre-wrap;
      background:rgba(17,17,27,.95);border-top:1px solid #444;padding:6px 8px;color:#a6e3a1;font-size:11px;z-index:10}
 #log.hidden{display:none}
 .err{color:#f38ba8} #status{color:#f9e2af}
 #logtoggle{position:absolute;right:6px;bottom:6px;z-index:11;background:#1e1e2e;color:#8087a2;
      border:1px solid #45475a;border-radius:4px;padding:1px 7px;font:11px ui-monospace,Menlo,monospace;cursor:pointer;opacity:.45}
 #logtoggle:hover{opacity:1}
 /* --- Themed loading overlay (Virtastic house style, shared with openmw-web / ja2-web:
    deep-slate ground + a cool CAD-blue glow). Covers the app during download/boot;
    fades out on the first frame. --- */
 #boot{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      padding:24px;text-align:center;background:#0d0f12;color:#e3e9f2;
      font:16px/1.6 "Inter","Segoe UI",-apple-system,Roboto,"Helvetica Neue",sans-serif;
      transition:opacity .6s ease}
 #boot.done{opacity:0;pointer-events:none}
 #boot::before{content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(150% 74% at 50% 134%, rgba(74,158,255,.28), rgba(74,158,255,.05) 34%, transparent 60%),
        radial-gradient(90% 60% at 50% 136%, rgba(127,196,255,.12), transparent 56%);
      animation:fcGlow 9s ease-in-out infinite}
 @keyframes fcGlow{0%,100%{opacity:.8}50%{opacity:1}}
 #boot .ld-inner{position:relative;width:100%;max-width:440px}
 #boot .ld-glyph{width:60px;height:60px;margin:0 auto 26px;color:#4a9eff;animation:fcsp 7s linear infinite}
 #boot .ld-glyph svg{width:100%;height:100%;display:block;
      filter:drop-shadow(0 0 14px rgba(74,158,255,.35))}
 @keyframes fcsp{to{transform:rotate(360deg)}}
 #boot .bt{margin:0 0 10px;font-family:"Inter","Segoe UI",Roboto,sans-serif;font-weight:600;
      font-size:clamp(28px,5vw,42px);letter-spacing:.005em;color:#eef3fa;
      text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 34px rgba(74,158,255,.14)}
 #boot .bt .accent{color:#4a9eff;text-shadow:0 0 22px rgba(74,158,255,.45)}
 #boot .bs{margin:0 0 22px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
      font-weight:600;color:#7fb2e6;min-height:1.4em}
 #boot .ld-bar{position:relative;height:4px;border-radius:3px;overflow:hidden;background:rgba(74,158,255,.16)}
 #boot .ld-fill{height:100%;width:0;border-radius:3px;
      background:linear-gradient(90deg,#2f6fb0,#4a9eff,#8fc7ff);transition:width .3s ease}
 #boot.indet .ld-fill{width:34%;animation:ldSlide 1.25s ease-in-out infinite}
 @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
 #boot .ld-detail{margin-top:13px;min-height:16px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#6b7686}
 #boot .ld-credit{margin-top:28px;font-size:11px;letter-spacing:.08em;color:#5c6675}
 #boot .ld-credit a{color:#4a9eff;text-decoration:none;border-bottom:1px solid rgba(74,158,255,.4)}
 #boot .berr{color:#f38ba8}
 #boot.err .ld-glyph{animation:none;color:#f38ba8}
 #boot.err .bs{color:#f38ba8}
 @media (prefers-reduced-motion:reduce){
   #boot::before,#boot .ld-glyph{animation:none}
   #boot.indet .ld-fill{animation:none;width:100%}
 }
</style></head>
<body>
<div id="screen"></div>
<div id="boot" class="indet">
  <div class="ld-inner">
    <div class="ld-glyph" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <!-- isometric CAD cube -->
        <path d="M24 5 41 14.5 41 33.5 24 43 7 33.5 7 14.5Z"/>
        <path d="M24 5 24 24 41 14.5M24 24 7 14.5M24 24 24 43"/>
        <circle cx="24" cy="24" r="2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="bt">Free<span class="accent">CAD</span></div>

    <div class="ld-bar"><div class="ld-fill" id="bootfill"></div></div>

    <div class="ld-credit">FreeCAD-Web by <a href="https://virtastic.app" target="_blank" rel="noopener">Virtastic</a>

  </div>
</div>
<div id="log" class="hidden"><span id="status">loading…</span></div>
<button id="logtoggle" title="show/hide boot log">log</button>
<script>
// Blocking HTML confirm used by the JSPI dialog bridge (_fcwebdlg.confirm ->
// fcweb_html_confirm EM_ASYNC_JS -> here). Returns a Promise resolving to the
// clicked button index; the wasm side suspends (JSPI) until then.
// ---- gmsh bridge ---------------------------------------------------------
// gmsh is a SEPARATE wasm module (play-gui/gmsh.wasm) with its own filesystem, loaded
// the first time someone meshes so the 152 MB main binary does not grow. FreeCAD writes
// the .brep + .geo into ITS FS and calls _fcwebgmsh.run(...), which suspends via JSPI
// until this resolves; we ferry the bytes across, run the script, and copy the .unv back
// so Fem.read() on the FreeCAD side finds it exactly where the .geo's Save line put it.
(function () {
  var modP = null;                       // cached module promise (load once)
  function load() {
    if (modP) { return modP; }
    modP = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'gmsh.js';
      s.onload = function () {
        if (typeof GmshModule !== 'function') { reject(new Error('gmsh.js did not define GmshModule')); return; }
        // Carry the ?v= stamp from this script's URL over to gmsh.wasm. infra/Dockerfile
        // keys that stamp on the WASM's md5, so propagating it content-addresses the wasm
        // too. Without this the .js gets a fresh URL while the .wasm -- served immutable
        // for a year -- stays stale in a returning browser, i.e. new loader, old engine.
        var q = (s.src.split('?')[1] || '');
        GmshModule(q ? { locateFile: function (f) { return /\.wasm$/.test(f) ? f + '?' + q : f; } } : {})
          .then(resolve, reject);
      };
      s.onerror = function () { reject(new Error('failed to fetch gmsh.js')); };
      document.head.appendChild(s);
    });
    modP.catch(function () { modP = null; });   // let a later attempt retry
    return modP;
  }
  var base = function (p) { return String(p).replace(/^.*\//, ''); };

  window.fcwebGmshRun = async function (geoPath, brepPath, unvPath, verbosity) {
    var fc = window.fcInstance;
    if (!fc || !fc.FS) { return 1; }
    var G;
    try {
      if (typeof window.fcwebNotify === 'function' && !modP) {
        window.fcwebNotify('Loading the mesher…', 'info');
      }
      G = await load();
    } catch (e) {
      if (typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('Could not load the mesher: ' + e.message, 'error');
      }
      return 1;
    }
    try {
      // gmsh resolves the .geo's Merge/Save paths relative to the script, so keep
      // everything in one flat working dir inside the gmsh module's FS.
      var wd = '/work';
      try { G.FS.mkdir(wd); } catch (e) {}
      var geoName = base(geoPath), brepName = base(brepPath), unvName = base(unvPath);
      G.FS.writeFile(wd + '/' + brepName, fc.FS.readFile(brepPath));
      G.FS.writeFile(wd + '/' + geoName, fc.FS.readFile(geoPath));
      try { G.FS.chdir(wd); } catch (e) {}

      var rc = G.ccall('fcweb_gmsh_run', 'number', ['string', 'number'],
                       [wd + '/' + geoName, verbosity | 0]);
      if (rc !== 0) {
        if (typeof window.fcwebNotify === 'function') {
          window.fcwebNotify('Meshing failed (gmsh returned ' + rc + ').', 'error');
        }
        return rc;
      }
      var out;
      try { out = G.FS.readFile(wd + '/' + unvName); }
      catch (e) {
        if (typeof window.fcwebNotify === 'function') {
          window.fcwebNotify('The mesher produced no output file.', 'error');
        }
        return 1;
      }
      fc.FS.writeFile(unvPath, out);      // hand it back where Fem.read() expects it
      // Don't let one run's files confuse the next.
      try { G.FS.unlink(wd + '/' + brepName); G.FS.unlink(wd + '/' + geoName); G.FS.unlink(wd + '/' + unvName); } catch (e) {}
      return 0;
    } catch (e) {
      try { console.error('[fcweb] gmsh bridge', e); } catch (_) {}
      if (typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('Meshing failed: ' + (e && e.message ? e.message : e), 'error');
      }
      return 1;
    }
  };

  window.fcwebGmshVersion = async function () {
    try {
      var G = await load();
      return G.ccall('fcweb_gmsh_version', 'string', [], []);
    } catch (e) { return null; }
  };
})();

// ---------------------------------------------------------------------------
// CalculiX. FreeCAD's FEM solver writes <job>.inp and runs `ccx -i <job>`, then reads
// back <job>.frd and <job>.dat. ccx is a separate wasm module with its own filesystem,
// so the files are ferried across here.
//
// A FRESH module instance is created per solve, unlike the mesher: ccx keeps state in
// globals and was written as a one-shot process, so reusing an instance would carry the
// previous run's state into the next one. The cost is re-instantiating ~4 MB, which is
// small next to the solve itself.
(function () {
  var scriptP = null;
  var ccxOpts = {};                      // locateFile for ccx.wasm, set once the script URL is known

  function loadScript() {
    if (scriptP) { return scriptP; }
    scriptP = new Promise(function (resolve, reject) {
      if (typeof CcxModule === 'function') { resolve(); return; }
      var s = document.createElement('script');
      s.src = 'ccx.js';
      s.onload = function () {
        if (typeof CcxModule !== 'function') { reject(new Error('ccx.js did not define CcxModule')); return; }
        // Propagate this script's ?v= stamp to ccx.wasm -- see the same note in the gmsh
        // loader above. The stamp is keyed on the wasm's md5, so without forwarding it a
        // rebuilt solver stays stale behind a year-long immutable cache.
        var q = (s.src.split('?')[1] || '');
        if (q) { ccxOpts = { locateFile: function (f) { return /\.wasm$/.test(f) ? f + '?' + q : f; } }; }
        resolve();
      };
      s.onerror = function () { reject(new Error('failed to fetch ccx.js')); };
      document.head.appendChild(s);
    });
    scriptP.catch(function () { scriptP = null; });   // let a later attempt retry
    return scriptP;
  }

  function dirOf(p) { var i = String(p).lastIndexOf('/'); return i < 0 ? '.' : p.slice(0, i); }
  function base(p) { return String(p).split('/').pop(); }

  // Everything ccx may write. Missing ones are skipped: which appear depends on the
  // analysis type and on what the deck asked to be printed.
  var OUTPUTS = ['.frd', '.dat', '.sta', '.cvg', '.12d', '.out'];

  window.fcwebCcxRun = async function (inpPath) {
    var fc = window.fcInstance;
    if (!fc || !fc.FS) { return 1; }
    try {
      if (typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('Loading the solver\u2026', 'info');
      }
      await loadScript();
    } catch (e) {
      if (typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('Could not load the solver: ' + e.message, 'error');
      }
      return 1;
    }

    var job = base(inpPath).replace(/\.inp$/i, '');
    var outDir = dirOf(inpPath);
    try {
      var M = await CcxModule(ccxOpts);
      var wd = '/work';
      try { M.FS.mkdir(wd); } catch (e) {}
      try { M.FS.chdir(wd); } catch (e) {}
      M.FS.writeFile(wd + '/' + job + '.inp', fc.FS.readFile(inpPath));

      var rc = M.ccall('fcweb_ccx_run', 'number', ['string'], [job]);

      var wrote = 0;
      for (var i = 0; i < OUTPUTS.length; i++) {
        var name = job + OUTPUTS[i];
        try {
          fc.FS.writeFile(outDir + '/' + name, M.FS.readFile(wd + '/' + name));
          wrote++;
        } catch (e) { /* this analysis did not produce that file */ }
      }
      if (rc !== 0 && typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('The solver reported an error (ccx returned ' + rc + ').', 'error');
      } else if (!wrote && typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('The solver produced no result files.', 'error');
      }
      return rc | 0;
    } catch (e) {
      try { console.error('[fcweb] ccx failed', e); } catch (_) {}
      if (typeof window.fcwebNotify === 'function') {
        window.fcwebNotify('The solver failed: ' + (e && e.message ? e.message : e), 'error');
      }
      return 1;
    }
  };

  window.fcwebCcxVersion = async function () {
    try {
      await loadScript();
      var M = await CcxModule(ccxOpts);
      return M.ccall('fcweb_ccx_version', 'string', [], []);
    } catch (e) { return null; }
  };
})();

window.fcwebColor = function(title, initialRgb){
  return new Promise(function(resolve){
    try{
      var hex='#'+('000000'+((initialRgb>>>0)&0xffffff).toString(16)).slice(-6);
      var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');};
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
      var box=document.createElement('div');
      box.style.cssText='min-width:320px;background:#2b2b2b;color:#e8e8e8;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);overflow:hidden';
      box.innerHTML='<div style="padding:16px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #3a3a3a">'+esc(title||'Select Color')+'</div>'+
        '<div style="padding:22px 20px;display:flex;align-items:center;gap:14px"><input type="color" style="width:64px;height:64px;border:none;background:none;cursor:pointer"><span style="font-family:monospace;font-size:14px" class="hx"></span></div>'+
        '<div style="padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;background:#242424;border-top:1px solid #3a3a3a">'+
        '<button data-a="cancel" style="padding:7px 16px;border-radius:5px;border:1px solid #4a4a4a;background:#383838;color:#fff;font-size:13px;cursor:pointer;min-width:72px">Cancel</button>'+
        '<button data-a="ok" style="padding:7px 16px;border-radius:5px;border:1px solid #2d7dd2;background:#2d7dd2;color:#fff;font-size:13px;cursor:pointer;min-width:72px">OK</button></div>';
      ov.appendChild(box); document.body.appendChild(ov);
      var inp=box.querySelector('input'); var hx=box.querySelector('.hx'); inp.value=hex; hx.textContent=hex.toUpperCase();
      inp.addEventListener('input',function(){ hx.textContent=inp.value.toUpperCase(); });
      var done=function(val){ try{ov.remove();}catch(e){} document.removeEventListener('keydown',kd,true); resolve(val); };
      var kd=function(e){ if(e.key==='Escape'){e.preventDefault();done(null);} };
      document.addEventListener('keydown',kd,true);
      box.querySelector('[data-a="ok"]').addEventListener('click',function(){ done(parseInt(inp.value.slice(1),16)); });
      box.querySelector('[data-a="cancel"]').addEventListener('click',function(){ done(null); });
    }catch(e){ resolve(null); }
  });
};
window.fcwebPrompt = function(title, text, deflt){
  return new Promise(function(resolve){
    try{
      var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
      var box=document.createElement('div');
      box.style.cssText='min-width:360px;max-width:520px;background:#2b2b2b;color:#e8e8e8;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);overflow:hidden';
      box.innerHTML='<div style="padding:16px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #3a3a3a">'+esc(title||'FreeCAD')+'</div>'+
        '<div style="padding:18px 20px 6px;font-size:14px">'+esc(text||'')+'</div>'+
        '<div style="padding:6px 20px 16px"><input type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:5px;border:1px solid #4a4a4a;background:#1f1f1f;color:#fff;font-size:14px"></div>'+
        '<div style="padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;background:#242424;border-top:1px solid #3a3a3a">'+
        '<button data-a="cancel" style="padding:7px 16px;border-radius:5px;border:1px solid #4a4a4a;background:#383838;color:#fff;font-size:13px;cursor:pointer;min-width:72px">Cancel</button>'+
        '<button data-a="ok" style="padding:7px 16px;border-radius:5px;border:1px solid #2d7dd2;background:#2d7dd2;color:#fff;font-size:13px;cursor:pointer;min-width:72px">OK</button></div>';
      ov.appendChild(box); document.body.appendChild(ov);
      var inp=box.querySelector('input'); inp.value=(deflt==null?'':String(deflt));
      var done=function(val){ try{ov.remove();}catch(e){} document.removeEventListener('keydown',kd,true); resolve(val); };
      var kd=function(e){ if(e.key==='Escape'){e.preventDefault();done(null);} else if(e.key==='Enter'){e.preventDefault();done(inp.value);} };
      document.addEventListener('keydown',kd,true);
      box.querySelector('[data-a="ok"]').addEventListener('click',function(){done(inp.value);});
      box.querySelector('[data-a="cancel"]').addEventListener('click',function(){done(null);});
      setTimeout(function(){ inp.focus(); inp.select(); },0);
    }catch(e){ resolve(null); }
  });
};
window.fcwebConfirm = function(title, text, buttonsPipe){
  return new Promise(function(resolve){
    try{
      var btns=String(buttonsPipe||'').split('|').filter(function(s){return s.length>0;});
      if(!btns.length) btns=['OK'];
      var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
      var box=document.createElement('div');
      box.style.cssText='min-width:320px;max-width:520px;background:#2b2b2b;color:#e8e8e8;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5);overflow:hidden';
      var h='<div style="padding:16px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #3a3a3a">'+esc(title||'FreeCAD')+'</div>'+
            '<div style="padding:20px;font-size:14px;line-height:1.5;white-space:pre-wrap">'+esc(text||'')+'</div>'+
            '<div style="padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;background:#242424;border-top:1px solid #3a3a3a">';
      for(var i=0;i<btns.length;i++){var pr=(i===btns.length-1);h+='<button data-i="'+i+'" style="padding:7px 16px;border-radius:5px;border:1px solid '+(pr?'#2d7dd2':'#4a4a4a')+';background:'+(pr?'#2d7dd2':'#383838')+';color:#fff;font-size:13px;cursor:pointer;min-width:72px">'+esc(btns[i])+'</button>';}
      h+='</div>'; box.innerHTML=h; ov.appendChild(box); document.body.appendChild(ov);
      var done=function(idx){try{ov.remove();}catch(e){} document.removeEventListener('keydown',kd,true); resolve(idx);};
      var kd=function(e){if(e.key==='Escape'){e.preventDefault();done(0);}else if(e.key==='Enter'){e.preventDefault();done(btns.length-1);}};
      document.addEventListener('keydown',kd,true);
      var els=box.querySelectorAll('button');
      for(var j=0;j<els.length;j++){(function(el){el.addEventListener('click',function(){done(parseInt(el.getAttribute('data-i'),10));});})(els[j]);}
      var last=box.querySelector('button[data-i="'+(btns.length-1)+'"]'); if(last)last.focus();
    }catch(e){ resolve(0); }
  });
};

// ---- touch input ---------------------------------------------------------
// Qt-for-WebAssembly listens for mouse/wheel on its canvas; a bare touch produces
// none of those on its own, so the 3D view was dead on tablets. Map the gestures
// people expect onto the events Coin's navigation already handles:
//   1 finger drag  -> left-drag   (rotate)
//   2 finger drag  -> middle-drag (pan)
//   2 finger pinch -> wheel       (zoom)
//   tap            -> click       (select)
// Attached in capture phase on #screen so it also sees the canvas inside Qt's
// shadow DOM. Passive:false because we must preventDefault to stop the browser
// scrolling/zooming the page out from under the canvas.
(function () {
  if (typeof window === 'undefined' || !('ontouchstart' in window)) { return; }
  var TAP_MS = 250, TAP_SLOP = 8;
  var mode = 0, last = null, startT = 0, startPt = null, pinch0 = 0, moved = 0;
  var mid = function (t) {
    return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 };
  };
  var dist = function (t) {

  // 3D navigation ignores. So synthesize POINTER events and label them "mouse": Qt then
  // delivers QMouseEvent, which is the path the viewport actually handles.

// silently when the binary is absent). Anything the user should know about

      'color:#e8e8e8;border-radius:8px;padding:11px 13px;font:13px -apple-system,Segoe UI,Roboto,sans-serif;' +
      'box-shadow:0 8px 28px rgba(0,0,0,.45);line-height:1.45;opacity:0;transition:opacity .15s';
    var msg = document.createElement('div');
    msg.textContent = String(text == null ? '' : text);
    var x = document.createElement('button');
    x.textContent = '×';
    x.setAttribute('aria-label', 'Dismiss');
    x.style.cssText = 'float:right;margin:-4px -4px 0 8px;background:none;border:none;color:#cfcfcf;' +
      'font-size:17px;line-height:1;cursor:pointer';
    var kill = function () { try { t.remove(); } catch (e) {} };
    x.addEventListener('click', kill);
    t.appendChild(x); t.appendChild(msg);
    if (actions && actions.length) {
      var row = document.createElement('div');
      row.style.cssText = 'margin-top:9px;display:flex;gap:8px;flex-wrap:wrap';
      actions.forEach(function (a) {
        var btn = document.createElement('button');
        btn.textContent = a.label;
        btn.style.cssText = 'background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);' +
          'color:#e8e8e8;border-radius:6px;padding:5px 10px;font:12px inherit;cursor:pointer';
        btn.addEventListener('click', function () { try { a.onClick(btn); } catch (e) {} });
        row.appendChild(btn);
      });
      t.appendChild(row);
    }
    host.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    if (kind !== 'error') { setTimeout(function () { t.style.opacity = '0'; setTimeout(kill, 200); }, 9000); }
  } catch (e) { try { console.warn('[fcweb] notify failed', e, text); } catch (_) {} }
};

<script>
// ---- installability ----------------------------------------------------------------
// Chrome grants persistent storage automatically to an INSTALLED app, and refuses it
// otherwise (measured: three engaged visits, still denied). Persistent storage is what
// stops the browser evicting a user's documents when the disk gets tight, so making the
// app installable is a data-safety feature before it is a convenience.
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').then(function (r) {
        console.log('[fcweb] service worker registered, scope ' + r.scope);
      }, function (e) {
        console.log('[fcweb] service worker registration failed: ' + e.message);
      });
    });
  }
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    window.__fcInstallable = true;
    if (typeof window.fcwebNotify !== 'function') return;
    window.fcwebNotify(
      'Install FreeCAD as an app? Installed, the browser guarantees your saved documents ' +
      'are never evicted to reclaim disk space, and it opens in its own window.',
      'info',
      [{ label: 'Install', onClick: function (btn) {
          btn.textContent = 'Installing…';
          deferred.prompt();
          deferred.userChoice.then(function (c) {
            btn.textContent = c.outcome === 'accepted' ? 'Installed' : 'Not now';
            if (c.outcome === 'accepted' && navigator.storage && navigator.storage.persist) {
              navigator.storage.persist().then(function (ok) {
                console.log('[fcweb] persistent storage after install: ' + ok);
              });
            }
          });
        } }]);
  });
  window.addEventListener('appinstalled', function () {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (ok) {
        if (ok && typeof window.fcwebNotify === 'function') {
          window.fcwebNotify('Installed. Your documents are now stored persistently.', 'info');
        }
      });
    }
  });
})();
// ---- crash reporting and storage health ------------------------------------------
// Until now a trap reached the console and nowhere else: the user saw the app stop
// responding with no explanation, and we never learned it happened. Two things are
// needed for a public build -- the user has to be TOLD, and they need a way to hand us
// something actionable.
(function () {
  var RING = [];                       // recent log lines, for the diagnostic report
  var MAX_RING = 120;
  var seen = new Set();                // one toast per distinct failure
  window.fcwebLogRing = function (line) {
    if (typeof line !== 'string') return;
    RING.push(line.length > 400 ? line.slice(0, 400) + '…' : line);
    if (RING.length > MAX_RING) RING.shift();
  };

  function report(kind, detail) {
    var m = window.fcInstance;
    var docs = '?';
    try { docs = m && m.FS ? m.FS.readdir('/home/web_user/.fcweb-autosave')
      .filter(function (f) { return f.endsWith('.FCStd'); }).join(',') : '?'; } catch (e) { docs = '?'; }
    return [
      'FreeCAD-Web diagnostic report',
      'when:      ' + new Date().toISOString(),
      'kind:      ' + kind,
      'detail:    ' + String(detail).slice(0, 1500),
      'page:      ' + location.href,
      'browser:   ' + navigator.userAgent,
      'memory:    ' + (m && m.HEAPU8 ? (m.HEAPU8.length / 1048576).toFixed(0) + ' MB heap' : 'n/a') +
        (performance.memory ? ', js ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + ' MB' : ''),
      'autosaved: ' + docs,
      '',
      '--- last ' + RING.length + ' log lines ---',
      RING.join('\n'),
    ].join('\n');
  }

  // One toast per distinct failure, with the two things a user can actually do:
  // take their work with them, and give us something to act on.
  window.fcwebCrash = function (kind, detail) {
    var key = kind + '|' + String(detail).slice(0, 120);
    if (seen.has(key)) return;
    seen.add(key);
    var text = 'Something went wrong (' + kind + '). Your work is autosaved and will be ' +
               'restored if you reload. If it keeps happening, please send us the report.';
    if (typeof window.fcwebNotify !== 'function') { try { console.error(text, detail); } catch (e) {} return; }
    window.fcwebNotify(text, 'error', [
      { label: 'Copy report', onClick: function (btn) {
          var txt = report(kind, detail);
          var done = function () { btn.textContent = 'Copied'; };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done, function () { fallback(txt, done); });
          } else { fallback(txt, done); }
        } },
      // The report goes on the clipboard, never into the URL -- it carries a user's
      // document names and page state.
      { label: 'Open issue tracker', onClick: function () {
          window.open('https://github.com/Virtastic/freecad-web/issues/new', '_blank', 'noopener');
        } },
    ]);
  };
  function fallback(txt, done) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }

  window.addEventListener('error', function (e) {
    if (e && e.message) window.fcwebCrash('script error', e.message + ' @' + (e.filename || '?') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    window.fcwebCrash('unhandled rejection', (r && (r.stack || r.message)) || String(r));
  });

  // ---- storage health --------------------------------------------------------------
  // Everything the persistence work bought is void if the browser evicts the database or
  // it fills up: saves then fail silently, which is the exact failure mode we just spent
  // a day removing. Ask for persistent storage (a browser may evict non-persistent
  // origins under pressure), and watch how full it is.
  window.addEventListener('load', function () {
    if (!navigator.storage) return;
    try {
      if (navigator.storage.persist) {
        navigator.storage.persisted().then(function (already) {
          if (already) { console.log('[fcweb] storage already persistent'); return; }
          navigator.storage.persist().then(function (ok) {
            console.log('[fcweb] persistent storage ' + (ok ? 'granted' : 'DENIED (work may be evicted)'));
          });
        });
      }
    } catch (e) {}
    var warned = false;
    setInterval(function () {
      if (!navigator.storage.estimate) return;
      navigator.storage.estimate().then(function (q) {
        if (!q || !q.quota) return;
        var pct = q.usage / q.quota;
        if (pct > 0.85 && !warned && typeof window.fcwebNotify === 'function') {
          warned = true;
          window.fcwebNotify('Browser storage is ' + Math.round(pct * 100) + '% full (' +
            (q.usage / 1048576).toFixed(0) + ' of ' + (q.quota / 1048576).toFixed(0) + ' MB). ' +
            'Saving may start to fail — download anything you need to keep.', 'warn');
        }
        if (pct < 0.7) warned = false;
      }).catch(function () {});
    }, 60000);
  });
})();
</script>

<script>
// FCWEB: the GL emulation calls enable/disable/vertexAttribPointer with
// location -1 for attributes its generated shader doesn't use — each call spams
// "INVALID_VALUE: index out of range". GL semantics are error+ignore, so skip
// them silently.
(function(){
  ['enableVertexAttribArray','disableVertexAttribArray'].forEach(function(nm){
    var o=WebGL2RenderingContext.prototype[nm];
    WebGL2RenderingContext.prototype[nm]=function(i){ if(i<0||i===4294967295) return; return o.call(this,i); };
  });
  var vap=WebGL2RenderingContext.prototype.vertexAttribPointer;
  WebGL2RenderingContext.prototype.vertexAttribPointer=function(i){ if(i<0||i===4294967295) return; return vap.apply(this,arguments); };
})();
// FCWEB PERF: during interactive redraw Coin queries FRAMEBUFFER_BINDING + VIEWPORT
// ~29x per draw (~380k JS<->GPU round-trips per orbit) and the immediate-mode flush
// re-binds the same shader program every batch. Those round-trips dominated the frame
// (~17 FPS). Cache framebuffer + viewport (tracked via bindFramebuffer/viewport) and
// skip redundant useProgram. Correct because every state change flows through these same
// wrapped methods; per-context state lives on the context object, so context loss/reuse
// re-initialises cleanly. Restores interactive orbit toward 30+ FPS.
(function(){
  var P=WebGL2RenderingContext.prototype;
  var FB_BINDING=0x8CA6, VIEWPORT=0x0BA2, TARGET_FRAMEBUFFER=0x8D40;
  var _gp=P.getParameter;
  P.getParameter=function(pn){
    if(pn===FB_BINDING && this._fcFB!==undefined) return this._fcFB;
    if(pn===VIEWPORT && this._fcVP) return this._fcVP;
    return _gp.apply(this,arguments);
  };
  var _bf=P.bindFramebuffer;
  P.bindFramebuffer=function(target,fb){ this._fcFB=(target===TARGET_FRAMEBUFFER)?fb:undefined; return _bf.apply(this,arguments); };
  var _vp=P.viewport;
  P.viewport=function(x,y,w,h){ var a=this._fcVP||(this._fcVP=new Int32Array(4)); a[0]=x;a[1]=y;a[2]=w;a[3]=h; return _vp.apply(this,arguments); };
  var _up=P.useProgram;
  P.useProgram=function(prog){ if(this._fcProg===prog) return; this._fcProg=prog; return _up.apply(this,arguments); };
  // Skip redundant ARRAY_BUFFER re-binds (global state, not VAO-scoped, so safe to cache).
  var ARRAY_BUFFER=0x8892;
  var _bb=P.bindBuffer;
  P.bindBuffer=function(target,buf){ if(target===ARRAY_BUFFER){ if(this._fcAB===buf) return; this._fcAB=buf; } return _bb.apply(this,arguments); };
})();

<script>
// FCWEB GL tracer: wrap WebGL2 draw calls to see what actually reaches the GPU.
//
// OPT-IN (?gltrace=1). It used to run for every user, and it is not free: it wraps every
// drawArrays/drawElements and, for the first 400, issues synchronous getParameter /
// isEnabled reads. Those flush the GL pipeline, on a renderer that is already draw-call
// bound at ~11 fps on a heavy scene -- so the diagnostic was taxing the exact thing it
// exists to diagnose, and retaining 400 records with shader and uniform dumps besides.
//
// The render-debug switches below (?nodepth, ?nocull, ?darkbg) live in the same block and
// are gated on ?dev=1. They are support surface, not security: a user who lands on a
// shared link carrying ?skipCoin or ?nodepth files a bug nobody can reproduce.
(function(){
  var __qs = location.search;
  var __trace = /[?&]gltrace=1/.test(__qs);
  var __dev   = /[?&]dev=1/.test(__qs);
  if (!__trace && !__dev) { return; }
  window.__gllog = [];
  function wrap(proto, name){
    var orig = proto[name];
    proto[name] = function(){
      if (window.__gllog.length < 400) {
        var prog = this.getParameter(this.CURRENT_PROGRAM);
        var vp = this.getParameter(this.VIEWPORT);
        var rec = { fn:name, args:Array.prototype.slice.call(arguments,0,5),
          prog: prog? (prog.__fcid || (prog.__fcid = ++window.__progn||(window.__progn=1))) : 0,
          depth: this.isEnabled(this.DEPTH_TEST), vp: vp && Array.prototype.slice.call(vp) };
        // For the box face draw (TRIANGLES, big count, main viewport) capture MVP uniforms
        if (name==='drawArrays' && arguments[0]===4 && arguments[2]>=24 && vp && vp[2]>400 && prog && !window.__mvpDumped) {
          window.__mvpDumped = true;
          try {
            var gl=this, dump={};
            var n=gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);

            var a0 = { enabled: gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_ENABLED),
              size: gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_SIZE),
              type: gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_TYPE),
              stride: gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_STRIDE),
              bufBound: !!gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_BUFFER_BINDING) };

                enabled: gl.getVertexAttrib(loc, gl.VERTEX_ATTRIB_ARRAY_ENABLED),
                size: gl.getVertexAttrib(loc, gl.VERTEX_ATTRIB_ARRAY_SIZE),
                stride: gl.getVertexAttrib(loc, gl.VERTEX_ATTRIB_ARRAY_STRIDE),
                offset: gl.getVertexAttribOffset(loc, gl.VERTEX_ATTRIB_ARRAY_POINTER) }); }

    if (qp.has('nodepth') || qp.has('nocull')) {

      " _fp=_f.ParamGet('User parameter:BaseApp/Preferences/Mod/Draft')",

      " _vp=_f.ParamGet('User parameter:BaseApp/Preferences/View')",

    // altering any state the GPU can observe.
    //
    // NOTE: merging the draw calls themselves was tried and REVERTED. 93% of this scene's
    // draws are two-vertex edge segments and they do merge (2.8 per batch), but the
    // emulation still emits bufferSubData + vertexAttribPointer + enable/disable for each
    // segment either way, so batching only the draw adds work: it measured 3x SLOWER.
    // Fixing that has to happen where the per-segment setup is generated -- emscripten's
    // GLImmediate flush, or Coin emitting one GL_LINES batch per shape.
    (function () {
      if (/[?&]noredundant=1/.test(location.search)) return;
      var P = WebGL2RenderingContext.prototype;
      var realUseProgram = P.useProgram, realLineWidth = P.lineWidth;
      var realVA4fv = P.vertexAttrib4fv, realVA4f = P.vertexAttrib4f;
      var skipped = window.__glSkipped = { useProgram: 0, vertexAttrib: 0, lineWidth: 0 };
      function stt(gl) { return gl.__rs || (gl.__rs = { va: {} }); }
      P.useProgram = function (pr) {
        var s = stt(this);
        if (s.prog === pr) { skipped.useProgram++; return; }
        s.prog = pr;
        return realUseProgram.apply(this, arguments);
      };
      P.lineWidth = function (w) {
        var s = stt(this);
        if (s.lw === w) { skipped.lineWidth++; return; }
        s.lw = w;
        return realLineWidth.apply(this, arguments);
      };
      function constAttr(gl, idx, x, y, z, w, orig, args) {
        var c = stt(gl).va, p = c[idx];
        if (p && p[0] === x && p[1] === y && p[2] === z && p[3] === w) { skipped.vertexAttrib++; return; }
        c[idx] = [x, y, z, w];
        return orig.apply(gl, args);
      }
      P.vertexAttrib4fv = function (idx, v) {
        return constAttr(this, idx, v[0], v[1], v[2], v[3], realVA4fv, arguments); };
      P.vertexAttrib4f = function (idx, x, y, z, w) {
        return constAttr(this, idx, x, y, z, w, realVA4f, arguments); };
      // Drain any pending immediate-mode line batch before ANY other GL call: while it
      // accumulates, no GL call happens at all, which is the entire point.
      (function () {
        var busy = false;
        Object.getOwnPropertyNames(P).forEach(function (k) {
          var f; try { f = P[k]; } catch (e) { return; }
          if (typeof f !== 'function') return;
          P[k] = function () {
            var G = globalThis.__GLI;
            if (!busy && G && G.__mrgPend) { busy = true; try { G.__flushMerged(); } finally { busy = false; } }
            return f.apply(this, arguments);
          };
        });
      })();
      console.log('[fcweb] redundant GL state elimination + line merging ON');
    })();


    // --- Readable window decorations -------------------------------------------------
    // Qt-wasm draws each top-level window's frame as DOM inside #qt-shadow-container's
    // shadow root (.qt-decorated-window > .title-bar > .window-name), styled by Qt's own
    // stylesheet. Its defaults are unusable over FreeCAD's dark theme: the title text is
    // #dddddd while the frame behind it is #d3d3d3 — a ~1.06:1 contrast ratio, i.e. the
    // dialog title is invisible ("Active Body Required" reads as a blank bar). The same
    // light frame is what shows as the big grey slab around a dialog before its canvas
    // paints. Restyle the decoration to match the app's dark theme and give the title real
    // contrast. Shadow DOM is isolated, so page CSS can't reach it — inject a stylesheet
    // into the shadow root itself.
    (function(){
      var CSS = [
        '.qt-decorated-window { background-color:#31363b !important;',
        '  border:1px solid #21262b !important; border-radius:4px !important; }',
        '.title-bar { background-color:#3a4046 !important; height:22px !important;',
        '  padding:2px 4px 4px 4px !important; border-bottom:1px solid #21262b !important; }',
        '.title-bar .window-name { color:#f2f4f6 !important; font-weight:600 !important;',
        "  font-family:'Segoe UI',system-ui,-apple-system,sans-serif !important; font-size:12px !important; }",
        // Qt marks unfocused windows .inactive — keep those legible too, just dimmer.
        '.qt-decorated-window.inactive .title-bar { background-color:#33383d !important; }',
        '.qt-decorated-window.inactive .title-bar .window-name { color:#c2c8ce !important; }',
        // the close/max glyphs are dark-on-dark by default
        '.title-bar .image-button { filter:invert(92%) !important; opacity:.9 !important; }'
      ].join('\n');
      function inject(){
        var host=document.getElementById('qt-shadow-container');
        if(!host || !host.shadowRoot) return false;
        if(host.shadowRoot.getElementById('fcweb-decor')) return true;
        var st=document.createElement('style'); st.id='fcweb-decor'; st.textContent=CSS;
        host.shadowRoot.appendChild(st);
        console.log('[fcweb] window decoration style injected');
        return true;
      }
      if(!inject()){ var iv=setInterval(function(){ if(inject()) clearInterval(iv); },300);
        setTimeout(function(){ clearInterval(iv); },120000); }
    })();
  })();
})();
</script>
<script>
/* Browser support gate. This runs BEFORE FreeCAD.js, because loading that script starts
   the ~115 MB download immediately -- and on a browser that cannot run this build the
   user previously watched all of it arrive, saw "DOWNLOADING 100%", and then waited
   forever with nothing logged anywhere.

   JSPI (WebAssembly.Suspending) is the hard one: modal dialogs, the gmsh and CalculiX
   bridges and every Python-triggered dialog suspend through it. As of today that means
   Chrome/Edge 137+. SharedArrayBuffer needs COOP+COEP (served by infra/nginx.conf), and
   Coin renders through WebGL2. */
(function () {
  function webgl2() {
    try { return !!document.createElement('canvas').getContext('webgl2'); }
    catch (e) { return false; }
  }
  var missing = [];
  if (typeof WebAssembly === 'undefined' || typeof WebAssembly.Suspending !== 'function') {
    missing.push(['JavaScript Promise Integration (JSPI)',
                  'Chrome or Edge 137 and later. Firefox and Safari do not support it yet.']);
  }
  if (typeof SharedArrayBuffer === 'undefined' || !self.crossOriginIsolated) {
    missing.push(['SharedArrayBuffer with cross-origin isolation',
                  'the page must be served with COOP and COEP headers.']);
  }
  if (!webgl2()) {
    missing.push(['WebGL2', 'hardware acceleration may be disabled in your browser settings.']);
  }

  if (!missing.length) {
    ['FreeCAD.js', 'qtloader.js'].reduce(function (chain, src) {
      return chain.then(function () {
        return new Promise(function (ok, no) {
          var s = document.createElement('script');
          s.src = src; s.onload = ok; s.onerror = function () { no(new Error(src)); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve()).then(function () { init(); }, function (e) {
      var d = document.getElementById('bootstatus');
      if (d) { d.textContent = 'could not load ' + e.message; }
    });
    return;
  }

  window.__FC_UNSUPPORTED = true;
  var boot = document.getElementById('boot');
  if (boot) { boot.className = ''; }
  var st = document.getElementById('bootstatus');
  if (st) { st.textContent = 'This browser cannot run FreeCAD-Web'; }
  var fill = document.getElementById('bootfill');
  if (fill && fill.parentNode) { fill.parentNode.style.display = 'none'; }
  var det = document.getElementById('bootdetail');
  if (det) {
    var html = 'Nothing has been downloaded. FreeCAD-Web needs:<br><br>';
    for (var i = 0; i < missing.length; i++) {
      html += '<b>' + missing[i][0] + '</b> &mdash; ' + missing[i][1] + '<br>';
    }
    html += '<br>Please open this page in Chrome or Edge 137 or later on a desktop.';
    det.innerHTML = html;
    det.style.maxWidth = '34em';
    det.style.lineHeight = '1.6';
  }
})();
</script>
<script>
/* FCWEB file bridge: Qt-for-WebAssembly's native Open/Save-As dialogs need ASYNCIFY
   (absent in this multithread build) — they abort with "emscripten_sleep needs async".
   So bridge file I/O through the browser directly: Save = write the doc to the IDBFS
   home, read the bytes, download a Blob; Open = HTML file input -> write to the FS ->
   openDocument/insert. Wired to on-screen buttons AND Ctrl+S / Ctrl+O (capture phase,
   so the broken native dialog never fires). Work also persists across reloads via the
   IDBFS home, so nothing is lost regardless. */
(function(){
  function py(code){ var m=window.fcInstance; if(!m||!m._fcweb_run_python) return false;
    var n=new TextEncoder().encode(code).length+1, q=m._malloc(n); m.stringToUTF8(code,q,n);
    // Route through the guarded runner: sets __fcPyBusy so periodic intervals back
    // off while this (possibly long, JSPI-suspending) op runs, and frees the ptr
    // only when the call actually settles (a raw finally-free would free it while a
    // suspended call still holds it). File open/save go through here.
    (window.fcRunPy||function(mm,pp){ mm._fcweb_run_python(pp); mm._free(pp); })(m,q);
    return true; }
  function ready(){ var m=window.fcInstance; return m && m._fcweb_run_python && m.FS; }

  async function download(){
    if(!ready()){ return; }
    var m=window.fcInstance, FS=m.FS, dir='/home/web_user/_dl';
    try{ FS.mkdirTree ? FS.mkdirTree(dir) : FS.mkdir(dir); }catch(e){}
    try{ FS.unlink(dir+'/done'); }catch(e){}
    py([
      "import FreeCAD, os",
      "d = FreeCAD.ActiveDocument",
      "o = "+JSON.stringify(dir),
      "os.makedirs(o, exist_ok=True)",
      "err=''",
      "try:",
      "  if d is None: err='no active document'",
      "  else:",
      "    lbl=''.join(c for c in (d.Label or 'document') if c.isalnum() or c in '-_ ').strip() or 'document'",
      "    fp=os.path.join(o, lbl+'.FCStd')",
      "    d.saveAs(fp)",
      "    open(os.path.join(o,'name'),'w').write(lbl+'.FCStd')",
      "except Exception as e: err=str(e)",
      "open(os.path.join(o,'done'),'w').write(err)"
    ].join('\n'));
    for(var i=0;i<80;i++){
      await new Promise(function(r){setTimeout(r,150);});
      var err; try{ err=new TextDecoder().decode(FS.readFile(dir+'/done')); }catch(e){ continue; }
      if(err){ alert('Save failed: '+err); return; }
      var name=new TextDecoder().decode(FS.readFile(dir+'/name'));
      var bytes=FS.readFile(dir+'/'+name);
      var blob=new Blob([bytes],{type:'application/octet-stream'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},15000);
      // The staged copy has been handed to the browser, so drop it. _dl sits UNDER the
      // IDBFS mount, so anything left here is copied into IndexedDB and kept forever --
      // the same storage autosave depends on. Left alone it grows without bound and the
      // first symptom is the "your work is NOT being saved" quota toast, i.e. data loss.
      try{ FS.unlink(dir+'/'+name); }catch(e){}
      try{ FS.unlink(dir+'/name'); }catch(e){}
      try{ FS.unlink(dir+'/done'); }catch(e){}
      return;
    }
    alert('Save timed out');
  }

  // Drop the staged upload once Python has consumed it. Appended to the SAME python
  // snippet that does the import rather than unlinked from JS, because py() only queues
  // the work -- deleting from JS would race the read.
  //
  // Deliberately NOT used for .FCStd: an opened document's FileName IS this path, and
  // FreeCAD needs it to save. Those are left in place; they are files the user explicitly
  // opened, not invisible litter. Everything else (STEP/STL/SVG/DXF/macros/zips) is copied
  // into the document or the Mod dir on import, so the staged file is pure waste -- and
  // _up lives under the IDBFS mount, so waste here is permanent IndexedDB growth.
  function DROP_UPLOAD(p){
    return "\ntry:\n import os; os.remove("+JSON.stringify(p)+")\nexcept Exception: pass";
  }

  function openFile(filter){
    if(!ready()){ return; }
    var inp=document.createElement('input'); inp.type='file';
    inp.accept='.FCStd,.fcstd,.step,.stp,.iges,.igs,.brep,.brp,.stl,.obj,.FCMacro,.py,.svg,.dxf,.zip';
    inp.style.cssText='position:fixed;left:-9999px;'; document.body.appendChild(inp);
    inp.onchange=async function(){
      try{
      var f=inp.files&&inp.files[0]; if(!f){ inp.remove(); return; }
      var buf=new Uint8Array(await f.arrayBuffer());
      var m=window.fcInstance, FS=m.FS, dir='/home/web_user/_up';
      try{ FS.mkdirTree ? FS.mkdirTree(dir) : FS.mkdir(dir); }catch(e){}
      var safe=f.name.replace(/[^A-Za-z0-9._-]/g,'_'), path=dir+'/'+safe;
      FS.writeFile(path, buf);
      var ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ext==='fcstd'){
        py("import FreeCAD, FreeCADGui as Gui\nD=FreeCAD.openDocument("+JSON.stringify(path)+")\nGui.updateGui()\ntry:\n v=Gui.activeDocument().activeView(); v.viewIsometric(); v.fitAll()\nexcept Exception: pass");
      } else if(ext==='fcmacro'||ext==='py'){
        // Macro / Python script: copy into the user macro dir (so it shows in Macro > Macros...)
        // and run it immediately, exactly like FreeCAD's "Execute macro".
        py([
          "import os, shutil, FreeCAD, FreeCADGui as Gui",
          "src="+JSON.stringify(path),
          "md=FreeCAD.getUserMacroDir(True)",
          "os.makedirs(md, exist_ok=True)",
          "dst=os.path.join(md, os.path.basename(src))",
          "try: shutil.copyfile(src, dst)",
          "except Exception: dst=src",
          "try:",
          "  Gui.doCommandGui('exec(open(%r, encoding=\"utf-8\").read())' % dst)",
          "except Exception as e:",
          "  import sys; sys.__stderr__.write('macro error: %s\\n'%e)",
          // Only if the copy into the macro dir actually landed somewhere else -- the
          // except branch above falls back to dst=src, and removing it then would delete
          // the macro we are about to run.
          "if dst != src:",
          "  try: os.remove(src)",
          "  except Exception: pass"
        ].join('\n'));
      } else if(ext==='zip'){
        // Custom workbench / addon package: extract into the user Mod dir and load it, so an
        // engineer can install a plugin they already have as a .zip (no network needed).
        installWorkbenchZip(path);
      } else if(ext==='svg'||ext==='dxf'){
        py("import FreeCAD, FreeCADGui as Gui, importSVG, importDXF\nd=FreeCAD.ActiveDocument or FreeCAD.newDocument('Imported')\n(importSVG if "+JSON.stringify(ext)+"=='svg' else importDXF).insert("+JSON.stringify(path)+", d.Name)\nd.recompute()\nGui.updateGui()\ntry:\n v=Gui.activeDocument().activeView(); v.viewIsometric(); v.fitAll()\nexcept Exception: pass"+DROP_UPLOAD(path));
      } else {
        py("import FreeCAD, Part, FreeCADGui as Gui\nd=FreeCAD.ActiveDocument or FreeCAD.newDocument('Imported')\nPart.insert("+JSON.stringify(path)+", d.Name)\nd.recompute()\nGui.updateGui()\ntry:\n v=Gui.activeDocument().activeView(); v.viewIsometric(); v.fitAll()\nexcept Exception: pass"+DROP_UPLOAD(path));
      }
      } finally { inp.remove(); }
    };
    inp.click();
  }
  // Save bridge: FreeCAD's native File > Save / Save As / Export (patched Gui/FileDialog.cpp
  // getSaveFileName) hands us a staging path under /home/web_user/_dl and writes the file there
  // in whatever format the user chose. We watch each registered path and download it to the
  // user's machine when it appears or changes (mtime/size), so every Save/Export menu path works.
  var pendingSaves={};  // path -> last {mtime,size} we handled
  var saveTargets={};   // path -> Promise<FileSystemFileHandle|'cancelled'|null> (chosen destination)
  // Ask the user WHERE to put the file, using the real OS save dialog (File System Access API)
  // so they choose folder + filename instead of it silently landing in Downloads. This MUST be
  // called synchronously from the menu click: showSaveFilePicker() requires transient user
  // activation, and registerSave() is invoked straight from FileDialog.cpp's EM_ASM during the
  // click. The handle is used later, once FreeCAD has finished writing the staging file.
  function pickSaveTarget(path){
    if(!window.showSaveFilePicker) return null;   // Firefox/Safari -> download fallback
    var name=path.replace(/^.*\//,'');
    var ext=(name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
    var opts={suggestedName:name};
    if(ext){ var acc={}; acc['application/octet-stream']=[ext];
      opts.types=[{description:ext.slice(1).toUpperCase()+' file', accept:acc}]; }
    try{
      return window.showSaveFilePicker(opts).catch(function(){ return 'cancelled'; });
    }catch(e){ return null; }
  }
  function registerSave(path){
    if(!ready()) return;
    var m=window.fcInstance, FS=m.FS, dir=path.replace(/\/[^\/]*$/,'');
    try{ FS.mkdirTree ? FS.mkdirTree(dir) : FS.mkdir(dir); }catch(e){}
    if(!(path in pendingSaves)) pendingSaves[path]=null;
    // Only prompt when we don't already have a destination for this path: FreeCAD calls
    // getSaveFileName for Save As/Export/first save, then writes the same path on later
    // Ctrl+S without asking — matching desktop, those re-saves go to the chosen file silently.
    if(!(path in saveTargets)) saveTargets[path]=pickSaveTarget(path);
    ensureSaveWatcher();
  }
  // Write bytes to the user's chosen file; falls back to a download when the picker is
  // unavailable (non-Chromium). Returns true if handled, false to use the download path.
  function writeToTarget(path, bytes){
    var t=saveTargets[path];
    if(!t) return false;
    t.then(function(h){
      if(!h || h==='cancelled') return;            // user cancelled -> don't write anywhere
      return Promise.resolve(h.queryPermission && h.queryPermission({mode:'readwrite'}))
        .then(function(st){ return (st && st!=='granted' && h.requestPermission)
          ? h.requestPermission({mode:'readwrite'}) : st; })
        .then(function(){ return h.createWritable(); })
        .then(function(w){ return Promise.resolve(w.write(bytes)).then(function(){ return w.close(); }); })
        .then(function(){ logmsg('saved to '+(h.name||path.replace(/^.*\//,''))); })
        .catch(function(e){ logmsg('save failed: '+e); });
    });
    return true;
  }
  var saveWatch=null;
  function ensureSaveWatcher(){
    if(saveWatch) return;
    saveWatch=setInterval(function(){
      if(!ready()) return;
      var m=window.fcInstance, FS=m.FS;
      for(var path in pendingSaves){
        var st; try{ st=FS.stat(path); }catch(e){ continue; }   // not written yet
        if(!st || !st.size) continue;
        var sig=st.mtime+':'+st.size, prev=pendingSaves[path];
        if(prev===sig) continue;                                 // unchanged since last download
        // wait one tick for a size-stable file (write finished), then download
        pendingSaves[path]=sig;
        (function(p,size){
          var bytes; try{ bytes=FS.readFile(p); }catch(e){ return; }
          if(bytes.length!==size) { pendingSaves[p]=null; return; } // mid-write; retry next tick
          // Preferred: write straight into the file the user picked in the OS save dialog.
          if(writeToTarget(p, bytes)) return;
          // Fallback (no File System Access API): download it.
          var name=p.replace(/^.*\//,'');
          var blob=new Blob([bytes],{type:'application/octet-stream'});
          var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){URL.revokeObjectURL(a.href);},15000);
        })(path,st.size);
      }
    },400);
  }
  function logmsg(s){ try{ py("import sys; sys.__stderr__.write("+JSON.stringify(s+"\n")+")"); }catch(e){} }

  // Load any freshly-added workbenches under the user Mod dir without a restart: exec each
  // Init.py / InitGui.py the way FreeCAD's startup does. Best-effort; errors go to the log.
  function loadUserMods(){
    py([
      "import os, sys, FreeCAD, FreeCADGui as Gui",
      "moddir=os.path.join(FreeCAD.getUserAppDataDir(),'Mod')",
      "loaded=getattr(FreeCAD,'_fcweb_loaded_mods',None)",
      "if loaded is None: loaded=FreeCAD._fcweb_loaded_mods=set()",
      "if os.path.isdir(moddir):",
      " for name in sorted(os.listdir(moddir)):",
      "  d=os.path.join(moddir,name)",
      "  if not os.path.isdir(d) or d in loaded: continue",
      "  loaded.add(d)",
      "  if d not in sys.path: sys.path.append(d)",
      "  for boot in ('Init.py','InitGui.py'):",
      "   fp=os.path.join(d,boot)",
      "   if os.path.isfile(fp):",
      "    try:",
      "     ns={'__file__':fp,'__name__':'__main__'}; exec(open(fp,encoding='utf-8').read(), ns)",
      "     sys.__stderr__.write('addon loaded: %s (%s)\\n'%(name,boot))",
      "    except Exception as e: sys.__stderr__.write('addon %s %s error: %s\\n'%(name,boot,e))"
    ].join('\n'));
  }

  function installWorkbenchZip(path){
    logmsg('installing workbench from '+path.replace(/^.*\//,'')+' ...');
    py([
      "import os, zipfile, FreeCAD",
      "src="+JSON.stringify(path),
      "moddir=os.path.join(FreeCAD.getUserAppDataDir(),'Mod')",
      "os.makedirs(moddir, exist_ok=True)",
      "wbname=os.path.splitext(os.path.basename(src))[0] or 'CustomWB'",
      "try:",
      "  with zipfile.ZipFile(src) as z:",
      "    names=[n for n in z.namelist() if not n.startswith('/') and '..' not in n and not n.endswith('/')]",
      "    # A workbench must live in its OWN dir under Mod/. If every entry already shares a single",
      "    # top-level folder, keep it as-is (Mod/<top>/...). If the zip is flat, wrap it in Mod/<wbname>/.",
      "    tops=set(n.split('/')[0] for n in names)",
      "    flat = not all('/' in n for n in names) or len(tops)!=1",
      "    for n in names:",
      "      rel = (wbname+'/'+n) if flat else n",
      "      dst=os.path.join(moddir, rel)",
      "      os.makedirs(os.path.dirname(dst), exist_ok=True)",
      "      with z.open(n) as fsrc, open(dst,'wb') as fdst: fdst.write(fsrc.read())",
      "    FreeCAD.Console.PrintMessage('workbench extracted to %s\\n'%moddir)",
      "except Exception as e:",
      "  import sys; sys.__stderr__.write('zip install error: %s\\n'%e)"
    ].join('\n'));
    loadUserMods();
  }

  // Browser-native addon install from GitHub: no git/subprocess (unavailable in wasm). Uses the
  // GitHub REST tree API + raw.githubusercontent (both send CORS *), so it works from the page.
  // Only codeload zipballs lack CORS, which we avoid by fetching individual files.
  async function installAddonFromGitHub(spec){
    if(!ready()){ logmsg('not ready'); return; }
    var mm=spec.replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').split('/');
    var owner=mm[0], repo=mm[1]; if(!owner||!repo){ logmsg('bad repo spec: '+spec); return; }
    logmsg('fetching '+owner+'/'+repo+' from GitHub ...');
    try{
      var meta=await (await fetch('https://api.github.com/repos/'+owner+'/'+repo)).json();
      var branch=meta.default_branch||'master';
      var tree=await (await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/git/trees/'+branch+'?recursive=1')).json();
      if(!tree.tree){ logmsg('could not list files (rate limited?)'); return; }
      var files=tree.tree.filter(function(t){return t.type==='blob';});
      if(tree.truncated) logmsg('note: large repo, file list truncated by GitHub');
      if(files.length>1200){ logmsg('repo has '+files.length+' files — too large to install in-browser; aborting'); return; }
      var m=window.fcInstance, FS=m.FS;
      // resolve the real user Mod dir from FreeCAD (don't assume the XDG path)
      py("import os, FreeCAD\nopen('/tmp/_fcmoddir','w').write(os.path.join(FreeCAD.getUserAppDataDir(),'Mod'))");
      var moddir='/home/web_user/.local/share/FreeCAD/Mod';
      try{ moddir=new TextDecoder().decode(FS.readFile('/tmp/_fcmoddir'))||moddir; }catch(e){}
      var base=moddir+'/'+repo;
      try{ FS.mkdirTree(base); }catch(e){}
      var n=0;
      for(var i=0;i<files.length;i++){
        var fp=files[i].path;
        var r=await fetch('https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+fp);
        if(!r.ok) continue;
        var bytes=new Uint8Array(await r.arrayBuffer());
        var dst=base+'/'+fp, d=dst.replace(/\/[^\/]*$/,'');
        try{ FS.mkdirTree(d); }catch(e){}
        FS.writeFile(dst, bytes); n++;
        if(n%15===0) logmsg('  '+n+'/'+files.length+' files...');
      }
      logmsg('downloaded '+n+' files -> Mod/'+repo);
      loadUserMods();
    }catch(e){ logmsg('addon install failed: '+e); }
  }

  window.fcwebDownload=download; window.fcwebOpen=openFile; window.fcwebRegisterSave=registerSave;
  window.fcInstallAddon=installAddonFromGitHub; window.fcLoadUserMods=loadUserMods;
  window.fcInstallWorkbenchZip=installWorkbenchZip;

  // Bridge FreeCAD.installAddon('owner/repo') (Python console) -> the JS GitHub fetcher.
  setInterval(function(){
    if(!ready()) return;
    var FS=window.fcInstance.FS, spec;
    try{ spec=new TextDecoder().decode(FS.readFile('/tmp/_fcaddonreq')).trim(); }catch(e){ return; }
    try{ FS.unlink('/tmp/_fcaddonreq'); }catch(e){}
    if(spec) installAddonFromGitHub(spec);
  },700);

  // Ctrl+S / Ctrl+O convenience -> same bridge (capture phase so a stray native dialog never runs)
  window.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey)&&k==='s'){ e.preventDefault(); e.stopImmediatePropagation(); download(); }
    else if((e.metaKey||e.ctrlKey)&&k==='o'){ e.preventDefault(); e.stopImmediatePropagation(); openFile(); }
    else if(k==='escape'){ closeActivePopup(); }
  },true);

  // ---- keyboard outside text fields -----------------------------------------
  // Measured on this build: Qt receives keys ONLY while a text widget has focus. With the
  // model tree focused an application-wide Qt event filter sees NOTHING -- so Delete does
  // not delete (the Std_Delete action is enabled and the command works when invoked
  // directly), Ctrl+Z does not undo, and no single-key shortcut fires. Qt-wasm focuses a
  // hidden DOM input only for text widgets; otherwise document.activeElement is BODY and
  // the keydown never enters Qt.
  //
  // Re-dispatching the same event onto Qt's own canvas DOES drive it (verified: the object
  // was deleted), so forward there instead of hard-coding a shortcut table -- every key
  // keeps whatever meaning FreeCAD gives it.
  function qtCanvas(){
    try{
      var hosts=[].slice.call(document.querySelectorAll('*')).filter(function(e){return e.shadowRoot;});
      for(var i=0;i<hosts.length;i++){
        var c=hosts[i].shadowRoot.querySelector('canvas');
        if(c) return c;
      }
    }catch(e){}
    return null;
  }
  function textHasFocus(){
    var d=document.activeElement;
    while(d && d.shadowRoot && d.shadowRoot.activeElement) d=d.shadowRoot.activeElement;
    if(!d) return false;
    var t=d.tagName;
    return t==='INPUT' || t==='TEXTAREA' || d.isContentEditable === true;
  }
  function forwardKeyToQt(e){
    // isTrusted is the loop guard: our re-dispatched copy is synthetic, so it is ignored
    // here and cannot bounce. Skip when a text field has focus -- Qt already gets those,
    // and forwarding would type every character twice.
    if(!e.isTrusted) return;
    if(e.metaKey || e.ctrlKey){
      var k=(e.key||'').toLowerCase();
      if(k==='s'||k==='o') return;          // handled by the shell above
    }
    if(textHasFocus()) return;
    var c=qtCanvas(); if(!c) return;
    c.dispatchEvent(new KeyboardEvent(e.type, {
      key:e.key, code:e.code, keyCode:e.keyCode, which:e.which, location:e.location,
      ctrlKey:e.ctrlKey, shiftKey:e.shiftKey, altKey:e.altKey, metaKey:e.metaKey,
      repeat:e.repeat, isComposing:e.isComposing, bubbles:true, cancelable:true, composed:true
    }));
  }
  window.addEventListener('keydown', forwardKeyToQt, true);
  window.addEventListener('keyup', forwardKeyToQt, true);

  // Escape closes an open menu. Measured on this Qt-wasm build: with a popup open the
  // key never enters Qt's event system at all -- an application-wide Qt event filter
  // installed on QApplication does NOT see it, though the same filter sees Escape fine
  // when no popup is open, and typing works normally. So Qt cannot fix this from inside;
  // the shell has to notice the key and ask Qt to close the popup.
  // Deliberately narrow: does nothing unless a popup is actually open, so Escape keeps
  // its normal meaning everywhere else (task dialogs, Sketcher tools). Nested submenus
  // close one level per press, as on desktop.
  function closeActivePopup(){
    try{
      var m=window.fcInstance; if(!m||!m._malloc) return;
      if(window.__fcPyBusy) return;           // never re-enter a running interpreter
      var code="from PySide6 import QtWidgets as _W\n"
             + "_w=_W.QApplication.activePopupWidget()\n"
             + "\nif _w is not None:\n    _w.close()\n";
      var n=new TextEncoder().encode(code).length+1;
      var q=m._malloc(n); m.stringToUTF8(code,q,n);
      (window.fcRunPy||function(mm,pp){mm._fcweb_run_python(pp);mm._free(pp);})(m,q);
    }catch(err){}
  }
})();
</script>
</body></html>
